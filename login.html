<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Klyon - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000000; --text: #ffffff; --dim: #888888; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Inter', sans-serif;
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            height: 100vh;
            overflow: hidden;
        }

        /* Efeito Eclipse do Logo */
        .logo-container {
            position: relative;
            margin-bottom: 80px;
            text-align: center;
        }
        .eclipse {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: transparent;
            box-shadow: -15px -5px 40px -10px rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .logo-k { font-size: 80px; font-weight: 300; letter-spacing: -5px; }
        .brand-name { font-size: 24px; letter-spacing: 12px; font-weight: 400; margin-top: 10px; }
        .brand-sub { font-size: 12px; letter-spacing: 8px; color: var(--dim); margin-top: 5px; }

        .welcome-section { text-align: center; margin-bottom: 60px; }
        .welcome-section h2 { font-weight: 400; font-size: 20px; margin-bottom: 10px; }
        .welcome-section p { color: var(--dim); font-size: 14px; }

        .btn-google {
            width: 85%;
            max-width: 320px;
            padding: 16px;
            border-radius: 30px;
            border: 1px solid #333;
            background: transparent;
            color: #fff;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-google:hover { border-color: #666; background: rgba(255,255,255,0.05); }

        .footer-terms {
            position: absolute;
            bottom: 40px;
            font-size: 11px;
            color: var(--dim);
            text-align: center;
            line-height: 1.6;
        }
        .footer-terms span { color: #00f2ff; } /* Cor sutil de destaque */
    </style>
</head>
<body>

    <div class="logo-container">
        <div class="eclipse"><span class="logo-k">K</span></div>
        <div class="brand-name">K L Y O N</div>
        <div class="brand-sub">— VOID —</div>
    </div>

    <div class="welcome-section">
        <h2>Bem-vindo ao vazio.</h2>
        <p>Aqui, ninguém sabe quem você é.</p>
    </div>

    <button class="btn-google" id="loginBtn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/pwa_google_color_128dp.png" width="18">
        Continuar com Google
    </button>

    <div class="footer-terms">
        Ao continuar, você concorda com nossos<br>
        <span>Termos de Uso</span> e <span>Política de Privacidade</span>.
    </div>

    </body>
</html>
