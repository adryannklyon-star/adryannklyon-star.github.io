<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLYON | Acesso</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --bg: #030307; }
        body { 
            margin: 0; background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex; align-items: center; justify-content: center; height: 100vh;
            background: radial-gradient(circle at center, #0f172a 0%, #030307 100%); overflow: hidden;
        }
        .login-card {
            text-align: center; padding: 40px; width: 90%; max-width: 400px;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px; backdrop-filter: blur(20px); animation: slideUp 0.8s ease;
        }
        .logo-k {
            font-family: 'Orbitron'; font-size: 5rem; font-weight: 900;
            background: linear-gradient(to bottom, #fff, var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 10px; filter: drop-shadow(0 0 15px rgba(0,242,255,0.3));
        }
        h1 { font-family: 'Orbitron'; font-size: 1.2rem; letter-spacing: 4px; margin-bottom: 30px; color: var(--primary); }
        .btn-google {
            width: 100%; padding: 16px; border-radius: 20px; border: none;
            background: #fff; color: #000; font-weight: 800; font-family: 'Orbitron';
            display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-k">K</div>
        <h1>KLYON ELITE</h1>
        <button class="btn-google" id="loginBtn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/pwa_google_color_128dp.png" width="20">
            ENTRAR COM GOOGLE
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", authDomain: "klyon-a97ba.firebaseapp.com", projectId: "klyon-a97ba", storageBucket: "klyon-a97ba.appspot.com" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, user => { if(user) window.location.href = "index.html"; });

        document.getElementById('loginBtn').onclick = async () => {
            const result = await signInWithPopup(auth, new GoogleAuthProvider());
            const user = result.user;
            const userRef = doc(db, "users", user.uid);
            const userSnap = await getDoc(userRef);

            // SÓ CRIA SE NÃO EXISTIR. Se já existir, não sobrescreve foto/nome.
            if (!userSnap.exists()) {
                await setDoc(userRef, {
                    name: user.displayName,
                    photo: user.photoURL,
                    handle: user.email.split('@')[0].toLowerCase().replace(/\s/g, ''),
                    uid: user.uid,
                    followers: [], following: []
                });
            }
            window.location.href = "index.html";
        };
    </script>
</body>
</html>
