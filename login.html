<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Klyon - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --accent: #00f2ff; --border: #1a1a1a; }
        body { 
            margin: 0; background: var(--bg); color: #fff; 
            font-family: 'Inter', sans-serif; height: 100vh; 
            display: flex; align-items: center; justify-content: center;
        }
        .login-card { text-align: center; width: 90%; max-width: 350px; }
        .logo-k { 
            font-family: 'Orbitron'; font-size: 60px; color: var(--accent); 
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.5); margin-bottom: 10px; 
        }
        h1 { font-size: 18px; font-weight: 300; letter-spacing: 4px; margin-bottom: 40px; color: #888; }
        .btn-google {
            width: 100%; padding: 15px; border-radius: 30px; border: 1px solid #333;
            background: #fff; color: #000; font-weight: 600; font-size: 14px;
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-google:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,255,255,0.1); }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-k">K</div>
    <h1>KLYON</h1>
    <button class="btn-google" id="loginBtn">
        <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" width="18">
        Continuar com Google
    </button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", 
        authDomain: "klyon-a97ba.firebaseapp.com", 
        projectId: "klyon-a97ba"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => { 
        if(user) window.location.href = "index.html"; 
    });

    document.getElementById('loginBtn').onclick = async () => {
        const provider = new GoogleAuthProvider();
        try {
            const result = await signInWithPopup(auth, provider);
            const user = result.user;
            const userRef = doc(db, "users", user.uid);
            const snap = await getDoc(userRef);

            if (!snap.exists()) {
                await setDoc(userRef, {
                    name: user.displayName,
                    handle: user.email.split('@')[0].toLowerCase() + Math.floor(Math.random() * 99),
                    uid: user.uid,
                    friends: [],
                    bio: "Conectado ao vazio.",
                    joinedAt: serverTimestamp()
                });
            }
            window.location.href = "index.html";
        } catch (e) { console.error(e); }
    };
</script>
</body>
</html>
