<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLYON | Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --bg: #030307; --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); --text-dim: #94a3b8; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at 50% 0%, #0f172a 0%, #030307 100%); min-height: 100vh; padding-bottom: 100px; scroll-behavior: smooth; }
        
        header { position: fixed; top: 0; width: 100%; height: 60px; background: rgba(3,3,7,0.8); backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .logo { font-family: 'Orbitron'; color: var(--primary); letter-spacing: 5px; text-shadow: 0 0 10px var(--primary); }
        
        .container { max-width: 500px; margin: auto; padding-top: 75px; }
        .post { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px; padding: 18px; margin: 0 15px 15px 15px; position: relative; transition: 0.3s; }
        .post:target { border-color: var(--primary); box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); }

        .repost-link { color: var(--primary); text-decoration: none; font-size: 0.7rem; font-family: 'Orbitron'; display: block; margin-bottom: 5px; cursor: pointer; }
        .mention { color: var(--primary); text-decoration: none; font-weight: 600; }

        .post-actions, .comment-actions { display: flex; gap: 15px; margin-top: 10px; }
        .action-btn { background: none; border: none; color: var(--text-dim); font-size: 0.7rem; cursor: pointer; font-family: 'Orbitron'; display: flex; align-items: center; gap: 4px; }
        
        .comment-box { margin-top: 15px; padding-left: 10px; border-left: 1px solid var(--glass-border); }
        .comment { background: rgba(255,255,255,0.02); padding: 10px; border-radius: 12px; margin-bottom: 8px; transition: 0.3s; }
        .comment:target { border: 1px solid var(--primary); background: rgba(0, 242, 255, 0.05); }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 4000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .modal-card { background: #0f172a; width: 90%; max-width: 450px; padding: 25px; border-radius: 24px; border: 1px solid var(--primary); }
        textarea { width: 100%; height: 120px; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 15px; color: #fff; padding: 15px; resize: none; margin: 10px 0; }
        
        .btn-main { width: 100%; background: var(--primary); border: none; padding: 15px; border-radius: 15px; font-weight: 800; font-family: 'Orbitron'; cursor: pointer; }
        #fab { position: fixed; bottom: 105px; right: 25px; width: 60px; height: 60px; background: var(--primary); border-radius: 20px; border: none; font-size: 32px; box-shadow: 0 0 15px var(--primary); z-index: 999; }
    </style>
</head>
<body>

<header><div class="logo">KLYON</div></header>

<main class="container" id="feed"></main>

<div id="actionModal" class="modal">
    <div class="modal-card">
        <h2 id="modalTitle" style="font-family:'Orbitron'; font-size: 0.8rem; color: var(--primary);">TRANSMISSÃO</h2>
        <textarea id="modalInput"></textarea>
        <button id="modalSubmit" class="btn-main">ENVIAR</button>
        <button onclick="closeModal('actionModal')" style="width:100%; background:transparent; color:#ff2d55; border:none; margin-top:10px; cursor:pointer;">CANCELAR</button>
    </div>
</div>

<button id="fab" onclick="openPostModal()">+</button>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, doc, getDoc, updateDoc, arrayUnion, arrayRemove, addDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", authDomain: "klyon-a97ba.firebaseapp.com", projectId: "klyon-a97ba" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let me = null;

    onAuthStateChanged(auth, async user => {
        if (!user) return window.location.href = "login.html";
        const snap = await getDoc(doc(db, "users", user.uid));
        me = snap.data();
        loadFeed();
    });

    // Função para scroll até o elemento original
    window.goTo = (id) => {
        const el = document.getElementById(id);
        if(el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            el.style.boxShadow = "0 0 30px var(--primary)";
            setTimeout(() => el.style.boxShadow = "", 2000);
        } else {
            alert("O conteúdo original pode ter sido deletado ou está mais abaixo no feed.");
        }
    };

    function parseText(text) {
        // Transforma @usuario em link de perfil
        text = text.replace(/@(\w+)/g, '<a href="perfil.html?u=$1" class="mention">@$1</a>');
        // Transforma referências de post em links de scroll
        text = text.replace(/#ref_(\w+)/g, '<span class="repost-link" onclick="goTo(\'$1\')">↗ VER ORIGINAL</span>');
        return text;
    }

    function loadFeed() {
        onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc")), snap => {
            const feed = document.getElementById('feed');
            feed.innerHTML = "";
            snap.forEach(docSnap => {
                const p = { id: docSnap.id, ...docSnap.data() };
                const isLiked = p.likes?.includes(auth.currentUser.uid);
                
                const postDiv = document.createElement('div');
                postDiv.className = 'post';
                postDiv.id = p.id;
                postDiv.innerHTML = `
                    <div style="font-size:0.8rem; margin-bottom:10px;">
                        <b onclick="window.location.href='perfil.html?u=${p.authorHandle}'" style="cursor:pointer">@${p.authorHandle}</b>
                    </div>
                    <div class="post-content">${parseText(p.content)}</div>
                    <div class="post-actions">
                        <button class="action-btn" onclick="window.likePost('${p.id}', ${isLiked})">🔥 ${p.likes?.length || 0}</button>
                        <button class="action-btn" onclick="window.prepComment('${p.id}')">💬</button>
                        <button class="action-btn" onclick="window.repost('${p.id}', 'post')">🔄</button>
                    </div>
                    <div class="comment-box" id="comments-${p.id}"></div>
                `;
                feed.appendChild(postDiv);
                loadComments(p.id);
            });
        });
    }

    function loadComments(postId) {
        onSnapshot(query(collection(db, `posts/${postId}/comments`), orderBy("createdAt", "asc")), snap => {
            const box = document.getElementById(`comments-${postId}`);
            box.innerHTML = "";
            snap.forEach(cDoc => {
                const c = cDoc.data();
                const cid = cDoc.id;
                const isCLiked = c.likes?.includes(auth.currentUser.uid);
                box.innerHTML += `
                    <div class="comment" id="${cid}">
                        <b>@${c.handle}</b>: ${parseText(c.text)}
                        <div class="comment-actions">
                            <span class="action-btn" onclick="window.likeComment('${postId}', '${cid}', ${isCLiked})">🔥 ${c.likes?.length || 0}</span>
                            <span class="action-btn" onclick="window.repost('${cid}', 'comment', '${postId}')">🔄 Republicar</span>
                        </div>
                    </div>`;
            });
        });
    }

    window.openPostModal = () => {
        const modal = document.getElementById('actionModal');
        modal.style.display = 'flex';
        document.getElementById('modalTitle').innerText = "NOVA TRANSMISSÃO";
        document.getElementById('modalInput').value = "";
        document.getElementById('modalSubmit').onclick = async () => {
            const txt = document.getElementById('modalInput').value;
            if(!txt.trim()) return;
            await addDoc(collection(db, "posts"), {
                uid: auth.currentUser.uid,
                authorName: me.name,
                authorHandle: me.handle,
                content: txt,
                likes: [],
                createdAt: serverTimestamp()
            });
            modal.style.display = 'none';
        };
    };

    window.repost = async (id, type, postId = null) => {
        let originalContent = "";
        let originalHandle = "";
        
        if(type === 'post') {
            const snap = await getDoc(doc(db, "posts", id));
            originalContent = snap.data().content;
            originalHandle = snap.data().authorHandle;
        } else {
            const snap = await getDoc(doc(db, `posts/${postId}/comments`, id));
            originalContent = snap.data().text;
            originalHandle = snap.data().handle;
        }

        await addDoc(collection(db, "posts"), {
            uid: auth.currentUser.uid,
            authorName: me.name,
            authorHandle: me.handle,
            content: `🔄 Republicado de @${originalHandle}:\n"${originalContent}"\n#ref_${id}`,
            likes: [],
            createdAt: serverTimestamp()
        });
        alert("Republicado com sucesso!");
    };

    window.prepComment = (postId) => {
        const modal = document.getElementById('actionModal');
        modal.style.display = 'flex';
        document.getElementById('modalTitle').innerText = "RESPONDER";
        document.getElementById('modalInput').value = "";
        document.getElementById('modalSubmit').onclick = async () => {
            const txt = document.getElementById('modalInput').value;
            await addDoc(collection(db, `posts/${postId}/comments`), {
                uid: auth.currentUser.uid,
                handle: me.handle,
                text: txt,
                likes: [],
                createdAt: serverTimestamp()
            });
            modal.style.display = 'none';
        };
    };

    window.likePost = (id, isLiked) => updateDoc(doc(db, "posts", id), { likes: isLiked ? arrayRemove(auth.currentUser.uid) : arrayUnion(auth.currentUser.uid) });
    window.likeComment = (pId, cId, isLiked) => updateDoc(doc(db, `posts/${pId}/comments`, cId), { likes: isLiked ? arrayRemove(auth.currentUser.uid) : arrayUnion(auth.currentUser.uid) });
    window.closeModal = (id) => document.getElementById(id).style.display = 'none';
</script>
</body>
</html>
