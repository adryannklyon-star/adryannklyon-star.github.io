<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLYON</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --bg: #030307; --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); --text-dim: #94a3b8; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at 50% 0%, #0f172a 0%, #030307 100%); min-height: 100vh; padding-bottom: 100px; }
        
        /* Header Limpo */
        header { position: fixed; top: 0; width: 100%; height: 60px; background: rgba(3,3,7,0.8); backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .logo { font-family: 'Orbitron'; color: var(--primary); letter-spacing: 5px; font-size: 1.1rem; text-shadow: 0 0 10px rgba(0, 242, 255, 0.5); }
        
        .container { max-width: 550px; margin: auto; padding-top: 75px; }

        /* Posts */
        .post { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px; padding: 18px; margin: 15px; animation: fadeIn 0.4s ease; }
        .post-head { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; cursor: pointer; }
        .post-head img { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--primary); object-fit: cover; }
        .post-content { font-size: 0.95rem; line-height: 1.5; color: #e2e8f0; margin-bottom: 10px; }
        .post-img { width: 100%; border-radius: 15px; border: 1px solid var(--glass-border); margin-bottom: 10px; }

        .post-actions { display: flex; gap: 20px; border-top: 1px solid var(--glass-border); padding-top: 12px; }
        .action-btn { background: none; border: none; color: var(--text-dim); font-size: 0.85rem; display: flex; align-items: center; gap: 6px; cursor: pointer; font-family: 'Orbitron'; }
        .action-btn.active { color: var(--primary); }

        /* Modal Comentários */
        #commentSheet { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; display: none; align-items: flex-end; }
        .sheet-content { background: #0f172a; width: 100%; max-height: 80vh; border-radius: 30px 30px 0 0; padding: 20px; display: flex; flex-direction: column; border-top: 1px solid var(--primary); animation: slideUp 0.3s ease-out; }
        .comment-list { flex: 1; overflow-y: auto; margin-bottom: 20px; }
        .comment-item { margin-bottom: 15px; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 15px; }
        .comment-input-area { display: flex; gap: 10px; padding-bottom: 10px; }
        .comment-input-area input { flex: 1; background: var(--glass); border: 1px solid var(--glass-border); padding: 12px; border-radius: 15px; color: #fff; }
        .send-c-btn { background: var(--primary); border: none; padding: 0 20px; border-radius: 15px; font-weight: 800; cursor: pointer; }

        /* Menu Inferior Atualizado (4 Itens) */
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 450px; height: 70px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border-radius: 28px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-around; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .nav-link { position: relative; display: flex; flex-direction: column; align-items: center; text-decoration: none; }
        .nav-link img { width: 26px; filter: invert(1); opacity: 0.4; transition: 0.3s; }
        .nav-link.active img { opacity: 1; filter: drop-shadow(0 0 8px var(--primary)) invert(1); }
        
        /* Badge de Notificação no Menu */
        .notif-badge { position: absolute; top: -2px; right: -2px; width: 10px; height: 10px; background: #ff2d55; border-radius: 50%; border: 2px solid #0f172a; display: none; }

        /* FAB */
        #fab { position: fixed; bottom: 105px; right: 25px; width: 55px; height: 55px; background: var(--primary); border-radius: 18px; border: none; font-size: 28px; cursor: pointer; z-index: 999; box-shadow: 0 5px 15px rgba(0, 242, 255, 0.3); }

        #postModal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 4000; display: none; align-items: center; justify-content: center; }
        .modal-card { background: #0f172a; width: 90%; max-width: 500px; padding: 25px; border-radius: 24px; border: 1px solid var(--primary); }
        textarea { width: 100%; height: 100px; background: transparent; border: none; color: #fff; font-size: 1.1rem; resize: none; margin: 15px 0; }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header><div class="logo">K</div></header>

<div id="commentSheet" onclick="if(event.target==this) this.style.display='none'">
    <div class="sheet-content">
        <div style="width:40px; height:4px; background:var(--glass-border); margin:0 auto 15px; border-radius:10px;"></div>
        <div id="commentList" class="comment-list"></div>
        <div class="comment-input-area">
            <input type="text" id="newCommentInput" placeholder="Sua resposta elite...">
            <button class="send-c-btn" id="sendCommentBtn">OK</button>
        </div>
    </div>
</div>

<div id="postModal">
    <div class="modal-card">
        <textarea id="postContent" placeholder="Transmita sua mensagem..."></textarea>
        <input type="text" id="postImageUrl" placeholder="URL da Foto" style="width:100%; background:var(--glass); border:1px solid var(--glass-border); padding:10px; border-radius:10px; color:#fff; margin-bottom:15px;">
        <button onclick="sendPost()" style="width:100%; background:var(--primary); border:none; padding:15px; border-radius:15px; font-weight:800; font-family:'Orbitron';">POSTAR</button>
        <button onclick="closeModal()" style="width:100%; background:transparent; color:#ff2d55; border:none; margin-top:10px;">Cancelar</button>
    </div>
</div>

<main class="container" id="feed"></main>
<button id="fab" onclick="openModal()">+</button>

<nav class="bottom-nav">
    <a href="index.html" class="nav-link active">
        <img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png">
    </a>
    <a href="buscar.html" class="nav-link">
        <img src="https://cdn-icons-png.flaticon.com/512/149/149852.png">
    </a>
    <a href="notificacoes.html" class="nav-link">
        <img src="https://cdn-icons-png.flaticon.com/512/3602/3602145.png">
        <div id="notifBadge" class="notif-badge"></div>
    </a>
    <a href="perfil.html" class="nav-link">
        <img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png">
    </a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, doc, getDoc, updateDoc, arrayUnion, arrayRemove, addDoc, serverTimestamp, query, where } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", authDomain: "klyon-a97ba.firebaseapp.com", projectId: "klyon-a97ba", storageBucket: "klyon-a97ba.appspot.com" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentEliteUser = null;
    let activePostId = null;

    onAuthStateChanged(auth, async user => {
        if (!user) return window.location.href = "login.html";
        const snap = await getDoc(doc(db, "users", user.uid));
        currentEliteUser = snap.data();
        loadFeed();
        listenNotifs(user.uid);
    });

    function loadFeed() {
        onSnapshot(collection(db, "posts"), snapshot => {
            const feed = document.getElementById('feed'); feed.innerHTML = "";
            let posts = [];
            snapshot.forEach(doc => posts.push({id: doc.id, ...doc.data()}));
            posts.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

            posts.forEach(p => {
                const isLiked = p.likes?.includes(auth.currentUser.uid);
                feed.innerHTML += `
                    <div class="post">
                        <div class="post-head" onclick="location.href='perfil.html?uid=${p.uid}'">
                            <img src="${p.authorPhoto}">
                            <div><b>${p.authorName}</b><br><small style="color:var(--primary)">@${p.authorHandle}</small></div>
                        </div>
                        <div class="post-content">${p.content}</div>
                        ${p.image ? `<img src="${p.image}" class="post-img">` : ''}
                        <div class="post-actions">
                            <button class="action-btn ${isLiked ? 'active' : ''}" onclick="toggleLike('${p.id}', ${isLiked})">🔥 ${p.likes?.length || 0}</button>
                            <button class="action-btn" onclick="openComments('${p.id}')">💬 ${p.comments?.length || 0}</button>
                            <button class="action-btn" onclick="repost('${p.id}')">🔄</button>
                        </div>
                    </div>`;
            });
        });
    }

    function listenNotifs(uid) {
        const q = query(collection(db, "notifications"), where("to", "==", uid), where("read", "==", false));
        onSnapshot(q, s => {
            document.getElementById('notifBadge').style.display = s.empty ? "none" : "block";
        });
    }

    window.openComments = async (postId) => {
        activePostId = postId;
        document.getElementById('commentSheet').style.display = 'flex';
        onSnapshot(doc(db, "posts", postId), (snap) => {
            const data = snap.data();
            const list = document.getElementById('commentList'); list.innerHTML = "";
            data.comments?.forEach(c => {
                list.innerHTML += `<div class="comment-item"><b style="color:var(--primary);">${c.name}</b><p style="margin:5px 0 0 0;">${c.text}</p></div>`;
            });
        });
    };

    document.getElementById('sendCommentBtn').onclick = async () => {
        const input = document.getElementById('newCommentInput');
        if(!input.value.trim()) return;
        await updateDoc(doc(db, "posts", activePostId), {
            comments: arrayUnion({ uid: auth.currentUser.uid, name: currentEliteUser.name, text: input.value, at: new Date().toISOString() })
        });
        input.value = "";
    };

    window.toggleLike = async (postId, isLiked) => {
        await updateDoc(doc(db, "posts", postId), { likes: isLiked ? arrayRemove(auth.currentUser.uid) : arrayUnion(auth.currentUser.uid) });
    };

    window.repost = async (postId) => {
        const snap = await getDoc(doc(db, "posts", postId));
        const p = snap.data();
        await addDoc(collection(db, "posts"), { ...p, authorName: `${currentEliteUser.name} (via ${p.authorName})`, uid: auth.currentUser.uid, createdAt: serverTimestamp(), likes: [], comments: [] });
    };

    window.openModal = () => document.getElementById('postModal').style.display = 'flex';
    window.closeModal = () => document.getElementById('postModal').style.display = 'none';

    window.sendPost = async () => {
        const text = document.getElementById('postContent').value;
        const img = document.getElementById('postImageUrl').value;
        if (!text.trim()) return;
        await addDoc(collection(db, "posts"), {
            uid: auth.currentUser.uid, authorName: currentEliteUser.name, authorPhoto: currentEliteUser.photo,
            authorHandle: currentEliteUser.handle, content: text, image: img || null, createdAt: serverTimestamp(), likes: [], comments: []
        });
        closeModal();
    };
</script>
</body>
</html>
