<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLYON PRO | Elite Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2ff;
            --accent: #7000ff;
            --bg: #030307;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            background: radial-gradient(circle at 50% 0%, #0f172a 0%, #030307 100%);
            min-height: 100vh; overflow-x: hidden;
        }

        /* HEADER PROFISSIONAL */
        header {
            position: fixed; top: 0; width: 100%; z-index: 1001;
            background: rgba(3, 3, 7, 0.8); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border); display: none;
        }
        header.visible { display: block; }
        .header-top { height: 65px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .header-tabs { display: flex; height: 48px; }
        .tab { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 800; color: var(--text-dim); cursor: pointer; transition: 0.3s; }
        .tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); }

        /* SECTIONS */
        .section { display: none; padding: 20px 0 110px 0; animation: slideUp 0.4s ease-out; }
        .section.active { display: block; }
        #feedSection { padding-top: 120px; }
        .container { max-width: 550px; margin: auto; padding: 0 16px; }

        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* POSTS ESTILO PREMIUM */
        .post { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px; padding: 18px; margin-bottom: 16px; position: relative; }
        .post-head { display: flex; gap: 12px; margin-bottom: 14px; align-items: center; cursor: pointer; }
        .post-head img { width: 44px; height: 44px; border-radius: 14px; object-fit: cover; border: 1px solid var(--glass-border); }
        .post-content { font-size: 1rem; line-height: 1.6; color: #f1f5f9; margin-bottom: 12px; }
        .post-img { width: 100%; border-radius: 18px; border: 1px solid var(--glass-border); margin-bottom: 12px; }

        .post-footer { display: flex; gap: 20px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.05); }
        .btn-action { background: none; border: none; color: var(--text-dim); display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-action:hover { color: var(--primary); }
        .btn-action.active-like { color: #ff2d55; }

        /* COMENTÁRIOS */
        .comment-box { display: none; margin-top: 15px; padding: 15px; background: rgba(0,0,0,0.2); border-radius: 15px; }
        .comment-input-area { display: flex; gap: 10px; margin-bottom: 10px; }
        .comment-input-area input { flex: 1; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 10px; color: #fff; padding: 8px 12px; }
        .comment-list { max-height: 200px; overflow-y: auto; font-size: 0.85rem; }
        .comment-item { margin-bottom: 8px; color: #cbd5e1; }

        /* NAV BAR */
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; height: 65px; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); border-radius: 25px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-around; z-index: 1000; }
        .nav-link { opacity: 0.4; cursor: pointer; transition: 0.3s; }
        .nav-link.active { opacity: 1; transform: translateY(-5px); }
        .nav-link img { width: 24px; filter: invert(1); }

        /* BOTÕES E INPUTS */
        .btn-elite { background: var(--primary); color: #000; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 800; cursor: pointer; }
        #fab { position: fixed; bottom: 100px; right: 25px; width: 56px; height: 56px; background: var(--primary); border-radius: 18px; border: none; font-size: 24px; color: #000; cursor: pointer; box-shadow: 0 8px 20px rgba(0, 242, 255, 0.3); z-index: 999; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header id="mainHeader">
    <div class="header-top">
        <span style="font-family:'Orbitron'; color:var(--primary); letter-spacing:3px;">KLYON</span>
        <div style="cursor:pointer;" onclick="toggleNotifPanel()">🔔</div>
    </div>
    <div class="header-tabs">
        <div class="tab active" onclick="switchFeed('all', this)">EXPLORAR</div>
        <div class="tab" onclick="switchFeed('friends', this)">CONEXÕES</div>
    </div>
</header>

<div id="loginSection" style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background: #000;">
    <h1 style="font-family:'Orbitron'; color:var(--primary); font-size:3rem;">KLYON</h1>
    <button class="btn-elite" onclick="login()">ENTRAR COM GOOGLE</button>
</div>

<div id="feedSection" class="section">
    <div class="container" id="feedContainer"></div>
</div>

<div id="searchSection" class="section">
    <div class="container">
        <input type="text" id="searchInput" placeholder="Buscar handle ou nome..." style="width:100%; padding:15px; border-radius:15px; background:var(--glass); border:1px solid var(--glass-border); color:#fff; margin-bottom:20px;">
        <div id="searchResults"></div>
    </div>
</div>

<div id="profileSection" class="section">
    <div style="height:150px; background:linear-gradient(to bottom, var(--accent), var(--bg));"></div>
    <div class="container" style="text-align:center; margin-top:-50px;">
        <img id="p-photo" src="" style="width:100px; height:100px; border-radius:25px; border:4px solid var(--bg); object-fit:cover;">
        <h2 id="p-name" style="margin:10px 0 5px;"></h2>
        <p id="p-handle" style="color:var(--primary); font-weight:700; margin:0;"></p>
        <div style="display:flex; justify-content:center; gap:30px; margin:20px 0;">
            <div><b id="p-posts">0</b><br><small>Posts</small></div>
            <div><b id="p-friends">0</b><br><small>Amigos</small></div>
        </div>
        <button id="p-follow-btn" class="btn-elite hidden" onclick="followUser()">CONECTAR</button>
        <div id="p-feed" style="text-align:left; margin-top:30px;"></div>
    </div>
</div>

<button id="fab" class="hidden" onclick="document.getElementById('postModal').style.display='block'">+</button>

<div id="postModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); z-index:5000; padding:20px;">
    <div class="container">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <button onclick="closePostModal()" style="background:none; border:none; color:var(--text-dim);">Fechar</button>
            <button id="publishBtn" class="btn-elite" onclick="publishPost()">POSTAR</button>
        </div>
        <textarea id="postText" style="width:100%; height:150px; background:none; border:none; color:#fff; font-size:1.2rem; resize:none;" placeholder="No que está pensando?"></textarea>
        <img id="postPreview" style="display:none; width:100%; border-radius:15px; margin-top:10px;">
        <div id="dropZone" onclick="document.getElementById('fileInput').click()" style="margin-top:20px; padding:30px; border:2px dashed var(--glass-border); border-radius:20px; text-align:center; color:var(--text-dim);">
            📸 ADICIONAR FOTO
        </div>
        <input type="file" id="fileInput" class="hidden" accept="image/*" onchange="handleFile(this)">
    </div>
</div>

<nav id="navbar" class="bottom-nav hidden">
    <div class="nav-link active" onclick="navigate('feedSection', this)"><img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png"></div>
    <div class="nav-link" onclick="navigate('searchSection', this)"><img src="https://cdn-icons-png.flaticon.com/512/149/149852.png"></div>
    <div class="nav-link" onclick="navigate('profileSection', this)"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png"></div>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, updateDoc, increment, where, arrayUnion, arrayRemove, getDocs } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-storage.js";

const firebaseConfig = {
    apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334",
    authDomain: "klyon-a97ba.firebaseapp.com",
    projectId: "klyon-a97ba",
    storageBucket: "klyon-a97ba.appspot.com"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);
const provider = new GoogleAuthProvider();

let currentUserData = null;
let selectedFile = null;
let currentViewingProfileId = null;

// --- AUTH ---
window.login = () => signInWithPopup(auth, provider);

onAuthStateChanged(auth, async (user) => {
    if (user) {
        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);
        
        if (!userSnap.exists()) {
            currentUserData = {
                uid: user.uid,
                name: user.displayName,
                photo: user.photoURL,
                handle: user.email.split('@')[0],
                friends: [],
                postsCount: 0,
                friendsCount: 0
            };
            await setDoc(userRef, currentUserData);
        } else {
            currentUserData = userSnap.data();
        }

        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('navbar').classList.remove('hidden');
        document.getElementById('fab').classList.remove('hidden');
        navigate('feedSection', document.querySelector('.nav-link'));
    }
});

// --- NAVEGAÇÃO ---
window.navigate = (sectionId, el) => {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
    
    document.getElementById(sectionId).classList.add('active');
    if(el) el.classList.add('active');
    
    document.getElementById('mainHeader').classList.toggle('visible', sectionId === 'feedSection');
    
    if(sectionId === 'feedSection') loadFeed('all');
    if(sectionId === 'profileSection') openProfile(auth.currentUser.uid);
};

window.switchFeed = (type, el) => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    loadFeed(type);
};

// --- FUNÇÃO DE POSTAGEM ---
window.handleFile = (input) => {
    selectedFile = input.files[0];
    const reader = new FileReader();
    reader.onload = (e) => {
        const prev = document.getElementById('postPreview');
        prev.src = e.target.result;
        prev.style.display = 'block';
        document.getElementById('dropZone').style.display = 'none';
    };
    reader.readAsDataURL(selectedFile);
};

window.publishPost = async () => {
    const text = document.getElementById('postText').value;
    if(!text && !selectedFile) return;

    const btn = document.getElementById('publishBtn');
    btn.disabled = true;
    btn.innerText = "Sincronizando...";

    let imageUrl = "";
    try {
        if(selectedFile) {
            const fileRef = ref(storage, `posts/${Date.now()}_${auth.currentUser.uid}`);
            await uploadBytes(fileRef, selectedFile);
            imageUrl = await getDownloadURL(fileRef);
        }

        await addDoc(collection(db, "posts"), {
            uid: auth.currentUser.uid,
            authorName: currentUserData.name,
            authorHandle: currentUserData.handle,
            authorPhoto: currentUserData.photo,
            content: text,
            image: imageUrl,
            likes: [],
            reposts: 0,
            createdAt: serverTimestamp()
        });

        await updateDoc(doc(db, "users", auth.currentUser.uid), {
            postsCount: increment(1)
        });

        closePostModal();
    } catch (e) {
        alert("Erro no servidor de mídia. Tente novamente.");
    } finally {
        btn.disabled = false;
        btn.innerText = "POSTAR";
    }
};

window.closePostModal = () => {
    document.getElementById('postModal').style.display = 'none';
    document.getElementById('postText').value = "";
    document.getElementById('postPreview').style.display = 'none';
    document.getElementById('dropZone').style.display = 'block';
    selectedFile = null;
};

// --- RENDERIZAR FEED ---
function renderPosts(snapshot, containerId) {
    const container = document.getElementById(containerId);
    container.innerHTML = "";
    
    snapshot.forEach(d => {
        const p = d.data();
        const postDoc = d.id;
        const isLiked = p.likes?.includes(auth.currentUser.uid);

        const card = document.createElement('div');
        card.className = 'post';
        card.innerHTML = `
            <div class="post-head" onclick="openProfile('${p.uid}')">
                <img src="${p.authorPhoto}">
                <div><b>${p.authorName}</b><br><small style="color:var(--primary)">@${p.authorHandle}</small></div>
            </div>
            <div class="post-content">${p.content}</div>
            ${p.image ? `<img src="${p.image}" class="post-img">` : ''}
            <div class="post-footer">
                <button class="btn-action ${isLiked ? 'active-like' : ''}" onclick="likePost('${postDoc}', this)">🔥 <span>${p.likes?.length || 0}</span></button>
                <button class="btn-action" onclick="toggleComments('${postDoc}')">💬 Comentar</button>
                <button class="btn-action" onclick="repost('${postDoc}')">🔁 Reposte</button>
            </div>
            <div id="comments-${postDoc}" class="comment-box">
                <div class="comment-input-area">
                    <input type="text" id="input-${postDoc}" placeholder="Sua resposta...">
                    <button class="btn-elite" style="padding:5px 15px" onclick="sendComment('${postDoc}')">Enviar</button>
                </div>
                <div id="list-${postDoc}" class="comment-list"></div>
            </div>
        `;
        container.appendChild(card);
    });
}

async function loadFeed(type) {
    let q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
    
    if(type === 'friends') {
        const friendsList = currentUserData.friends.length > 0 ? currentUserData.friends : ['none'];
        q = query(collection(db, "posts"), where("uid", "in", friendsList.slice(0, 10)), orderBy("createdAt", "desc"));
    }

    onSnapshot(q, (snap) => renderPosts(snap, 'feedContainer'));
}

// --- INTERAÇÕES ---
window.likePost = async (postId, btn) => {
    const postRef = doc(db, "posts", postId);
    const snap = await getDoc(postRef);
    const likes = snap.data().likes || [];

    if(likes.includes(auth.currentUser.uid)) {
        await updateDoc(postRef, { likes: arrayRemove(auth.currentUser.uid) });
    } else {
        await updateDoc(postRef, { likes: arrayUnion(auth.currentUser.uid) });
    }
};

window.toggleComments = (postId) => {
    const box = document.getElementById(`comments-${postId}`);
    box.style.display = box.style.display === 'block' ? 'none' : 'block';
    
    if(box.style.display === 'block') {
        onSnapshot(query(collection(db, "posts", postId, "comments"), orderBy("createdAt", "asc")), snap => {
            const list = document.getElementById(`list-${postId}`);
            list.innerHTML = "";
            snap.forEach(c => {
                const cm = c.data();
                list.innerHTML += `<div class="comment-item"><b>@${cm.handle}:</b> ${cm.text}</div>`;
            });
        });
    }
};

window.sendComment = async (postId) => {
    const input = document.getElementById(`input-${postId}`);
    if(!input.value) return;

    await addDoc(collection(db, "posts", postId, "comments"), {
        uid: auth.currentUser.uid,
        handle: currentUserData.handle,
        text: input.value,
        createdAt: serverTimestamp()
    });
    input.value = "";
};

window.repost = async (postId) => {
    const snap = await getDoc(doc(db, "posts", postId));
    const p = snap.data();
    
    await addDoc(collection(db, "posts"), {
        uid: auth.currentUser.uid,
        authorName: currentUserData.name,
        authorHandle: currentUserData.handle,
        authorPhoto: currentUserData.photo,
        content: `🔁 Repostado de @${p.authorHandle}:\n\n${p.content}`,
        image: p.image || "",
        likes: [],
        createdAt: serverTimestamp()
    });
    alert("Repostado na Elite!");
};

// --- PERFIL E BUSCA ---
window.openProfile = async (uid) => {
    currentViewingProfileId = uid;
    const snap = await getDoc(doc(db, "users", uid));
    const data = snap.data();

    document.getElementById('p-photo').src = data.photo;
    document.getElementById('p-name').innerText = data.name;
    document.getElementById('p-handle').innerText = "@" + data.handle;
    document.getElementById('p-posts').innerText = data.postsCount || 0;
    document.getElementById('p-friends').innerText = data.friendsCount || 0;

    const isMe = uid === auth.currentUser.uid;
    const btn = document.getElementById('p-follow-btn');
    btn.classList.toggle('hidden', isMe);
    btn.innerText = currentUserData.friends.includes(uid) ? "CONECTADO" : "CONECTAR";

    onSnapshot(query(collection(db, "posts"), where("uid", "==", uid), orderBy("createdAt", "desc")), snap => {
        renderPosts(snap, 'p-feed');
    });

    navigate('profileSection');
};

window.followUser = async () => {
    const userRef = doc(db, "users", auth.currentUser.uid);
    const targetRef = doc(db, "users", currentViewingProfileId);

    if(currentUserData.friends.includes(currentViewingProfileId)) {
        await updateDoc(userRef, { friends: arrayRemove(currentViewingProfileId) });
        await updateDoc(targetRef, { friendsCount: increment(-1) });
    } else {
        await updateDoc(userRef, { friends: arrayUnion(currentViewingProfileId) });
        await updateDoc(targetRef, { friendsCount: increment(1) });
    }
    openProfile(currentViewingProfileId);
};

document.getElementById('searchInput').oninput = async (e) => {
    const val = e.target.value.toLowerCase();
    if(val.length < 2) return;

    const q = query(collection(db, "users"), where("handle", ">=", val), where("handle", "<=", val + "\uf8ff"));
    const snap = await getDocs(q);
    
    const res = document.getElementById('searchResults');
    res.innerHTML = "";
    snap.forEach(d => {
        const u = d.data();
        const div = document.createElement('div');
        div.className = 'post'; div.style.display = 'flex'; div.style.alignItems = 'center'; div.style.gap = '15px';
        div.innerHTML = `<img src="${u.photo}" style="width:50px; height:50px; border-radius:12px;"> <b>${u.name}</b> <small>@${u.handle}</small>`;
        div.onclick = () => openProfile(d.id);
        res.appendChild(div);
    });
};
</script>
</body>
</html>
