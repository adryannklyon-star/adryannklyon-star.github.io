<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLYON | VOID</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --card-bg: #050505;
            --border: #111111;
            --accent: #00f2ff;
            --text-main: #eeeeee;
            --text-dim: #666666;
            --danger: #ff4444;
            --success: #50fa7b;
            --glass: rgba(0, 0, 0, 0.85);
        }

        /* Reset & Base */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { 
            background: var(--bg); color: var(--text-main); 
            font-family: 'Inter', sans-serif; line-height: 1.5;
            padding-bottom: 100px; overflow-x: hidden;
        }

        /* Header com Opção de Chat */
        header { 
            height: 65px; display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; background: var(--glass); 
            backdrop-filter: blur(20px); z-index: 1000;
            border-bottom: 1px solid var(--border); padding: 0 20px;
        }
        
        /* Spacer para centralizar o logo perfeitamente */
        header::before { content: ''; width: 24px; } 

        .logo-k { 
            font-weight: 300; font-size: 18px; letter-spacing: 6px; 
            color: #fff; text-transform: uppercase; opacity: 0.9;
        }

        .chat-link { 
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; color: var(--text-main); transition: 0.3s;
        }
        .chat-link svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 1.5; }
        .chat-link:active { transform: scale(0.9); opacity: 0.7; }

        /* Feed Layout */
        #feed { max-width: 550px; margin: 0 auto; width: 100%; }
        
        .post { padding: 24px 20px; border-bottom: 1px solid var(--border); position: relative; }
        
        .repost-label { 
            font-size: 11px; color: var(--success); margin-bottom: 14px; 
            display: flex; align-items: center; gap: 6px; font-weight: 400; opacity: 0.8;
        }

        .post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
        .neon-avatar-circle {
            width: 44px; height: 44px; border-radius: 50%; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            display: flex; align-items: center; justify-content: center; 
            font-size: 16px; font-weight: 400; color: #fff;
            background: radial-gradient(circle at top left, #1a1a1a, #000);
            text-transform: uppercase;
        }

        .post-info b { font-size: 14px; font-weight: 600; color: #fff; }
        .post-info span { font-size: 12px; color: var(--text-dim); font-weight: 400; }

        .post-content { 
            font-size: 15px; font-weight: 300; color: #ddd; 
            white-space: pre-wrap; word-wrap: break-word; margin-left: 56px;
        }

        .post-actions { display: flex; gap: 35px; margin-top: 20px; padding-top: 15px; margin-left: 56px; }
        .action-item { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-dim); cursor: pointer; }
        .action-item svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.6; }
        
        .action-item.voted { color: #fff; }
        .action-item.shared { color: var(--success); }

        .btn-excluir {
            position: absolute; top: 24px; right: 20px;
            color: var(--danger); font-size: 10px; cursor: pointer;
            opacity: 0.3; text-transform: uppercase; letter-spacing: 1px;
        }

        /* Modais */
        .modal { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); 
            z-index: 5000; display: none; align-items: center; justify-content: center; 
            backdrop-filter: blur(12px); padding: 20px;
        }
        .modal-card { 
            background: #080808; width: 100%; max-width: 450px; 
            padding: 30px; border-radius: 24px; border: 1px solid #1a1a1a;
        }
        .modal-card textarea { 
            width: 100%; height: 160px; background: transparent; 
            border: none; color: #fff; padding: 10px 0; resize: none; 
            font-family: inherit; font-size: 16px; margin-top: 15px;
        }
        .btn-publish { 
            width: 100%; background: #fff; color: #000; border: none; 
            padding: 15px; border-radius: 14px; font-weight: 600; cursor: pointer; margin-top: 20px;
        }

        /* FAB */
        .fab { 
            position: fixed; bottom: 95px; right: 25px; 
            width: 60px; height: 60px; background: #fff; 
            border-radius: 20px; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; z-index: 999;
        }
        .fab svg { width: 26px; stroke: #000; stroke-width: 2.2; fill: none; }

        /* Bottom Nav */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; height: 80px; 
            background: var(--glass); backdrop-filter: blur(20px);
            border-top: 1px solid var(--border); display: flex; 
            align-items: center; justify-content: space-around; padding-bottom: 10px;
        }
        .nav-link svg { width: 24px; stroke: var(--text-dim); fill: none; stroke-width: 1.8; }
        .nav-link.active svg { stroke: #fff; }
    </style>
</head>
<body>

<header>
    <div class="logo-k">KLYON</div>
    <a href="chat.html" class="chat-link">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
    </a>
</header>

<main id="feed"></main>

<div class="fab" id="openPostBtn"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></div>

<div id="postModal" class="modal">
    <div class="modal-card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:10px; letter-spacing:2px; color:var(--text-dim); font-weight:600;">NEW SIGNAL</span>
            <span onclick="closeModal('postModal')" style="cursor:pointer; font-size:12px; color:var(--text-dim)">FECHAR</span>
        </div>
        <textarea id="postText" placeholder="O que o vazio precisa ouvir?"></textarea>
        <button class="btn-publish" id="submitPost">TRANSMITIR</button>
    </div>
</div>

<div id="commentModal" class="modal">
    <div class="modal-card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:10px; letter-spacing:2px; color:var(--text-dim); font-weight:600;">REPLY</span>
            <span onclick="closeModal('commentModal')" style="cursor:pointer; font-size:12px; color:var(--text-dim)">FECHAR</span>
        </div>
        <textarea id="commentText" placeholder="Sua resposta para o sinal..."></textarea>
        <button class="btn-publish" id="submitReply">ENVIAR</button>
    </div>
</div>

<nav class="bottom-nav">
    <a href="index.html" class="nav-link active"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></a>
    <a href="notificacoes.html" class="nav-link"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path></svg></a>
    <a href="perfil.html" class="nav-link"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle></svg></a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, getDoc, updateDoc, increment, arrayUnion, arrayRemove, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", authDomain: "klyon-a97ba.firebaseapp.com", projectId: "klyon-a97ba" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let me = null;
    let postAtivo = null;

    onAuthStateChanged(auth, async user => {
        if (!user) return window.location.href = "login.html";
        const snap = await getDoc(doc(db, "users", user.uid));
        me = { id: user.uid, ...snap.data() };
        loadFeed();
    });

    function loadFeed() {
        const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
        onSnapshot(q, snap => {
            const feed = document.getElementById('feed');
            feed.innerHTML = "";
            snap.forEach(d => {
                const p = d.data();
                const id = d.id;
                const isVoted = p.votesBy?.includes(me.id);
                const isShared = p.sharedBy?.includes(me.id);
                const isMine = p.uid === me.id || (p.isRepost && p.reposterId === me.id);
                
                const postEl = document.createElement('div');
                postEl.className = 'post';
                postEl.innerHTML = `
                    ${p.isRepost ? `<div class="repost-label">↺ republicado por ${p.repostedBy}</div>` : ''}
                    ${isMine ? `<div class="btn-excluir" onclick="deletePost('${id}')">excluir</div>` : ''}
                    
                    <div class="post-header" onclick="location.href='perfil.html?u=${p.authorHandle}'">
                        <div class="neon-avatar-circle">${p.authorName ? p.authorName[0] : '?'}</div>
                        <div class="post-info">
                            <b>${p.authorName}</b>
                            <span>@${p.authorHandle}</span>
                        </div>
                    </div>
                    <div class="post-content">${p.content}</div>
                    <div class="post-actions">
                        <div class="action-item ${isVoted ? 'voted' : ''}" onclick="toggleVote('${id}', '${p.uid}', ${isVoted})">
                            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                            <span>${p.votesCount || 0}</span>
                        </div>
                        <div class="action-item" onclick="openComment('${id}')">
                            <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                            <span>${p.commentsCount || 0}</span>
                        </div>
                        <div class="action-item ${isShared ? 'shared' : ''}" onclick="repost('${id}', ${JSON.stringify(p).replace(/"/g, '&quot;')}, ${isShared})">
                            <svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
                            <span>${p.repostsCount || 0}</span>
                        </div>
                    </div>
                `;
                feed.appendChild(postEl);
            });
        });
    }

    window.deletePost = async (id) => {
        if(confirm("Remover sinal?")) await deleteDoc(doc(db, "posts", id));
    };

    window.toggleVote = async (id, authorUid, voted) => {
        const pRef = doc(db, "posts", id);
        const uRef = doc(db, "users", authorUid);
        await updateDoc(pRef, { votesCount: increment(voted ? -1 : 1), votesBy: voted ? arrayRemove(me.id) : arrayUnion(me.id) });
        await updateDoc(uRef, { votos: increment(voted ? -1 : 1) });
    };

    window.repost = async (id, postData, shared) => {
        if(shared) return;
        await updateDoc(doc(db, "posts", id), { repostsCount: increment(1), sharedBy: arrayUnion(me.id) });
        await addDoc(collection(db, "posts"), {
            ...postData, isRepost: true, repostedBy: me.name, reposterId: me.id,
            createdAt: serverTimestamp(), votesCount: 0, votesBy: [], commentsCount: 0, repostsCount: 0, sharedBy: []
        });
    };

    window.openModal = (m) => document.getElementById(m).style.display = 'flex';
    window.closeModal = (m) => document.getElementById(m).style.display = 'none';
    window.openComment = (id) => { postAtivo = id; openModal('commentModal'); };

    document.getElementById('openPostBtn').onclick = () => openModal('postModal');

    document.getElementById('submitPost').onclick = async () => {
        const txt = document.getElementById('postText').value;
        if(!txt.trim()) return;
        await addDoc(collection(db, "posts"), {
            uid: me.id, authorName: me.name, authorHandle: me.handle,
            content: txt, createdAt: serverTimestamp(),
            votesCount: 0, votesBy: [], commentsCount: 0, repostsCount: 0, sharedBy: [], isRepost: false
        });
        closeModal('postModal');
        document.getElementById('postText').value = "";
    };

    document.getElementById('submitReply').onclick = async () => {
        const txt = document.getElementById('commentText').value;
        if(!txt.trim()) return;
        await updateDoc(doc(db, "posts", postAtivo), { commentsCount: increment(1) });
        closeModal('commentModal');
        document.getElementById('commentText').value = "";
    };
</script>
</body>
</html>
