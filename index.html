<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLYON | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --bg: #030307; --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); --text-dim: #94a3b8; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at 50% 0%, #0f172a 0%, #030307 100%); min-height: 100vh; overflow-x: hidden; }
        
        header { position: fixed; top: 0; width: 100%; height: 65px; background: rgba(3,3,7,0.8); backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 1000; }
        .logo { font-family: 'Orbitron'; color: var(--primary); letter-spacing: 3px; font-size: 1.2rem; }
        
        .container { max-width: 550px; margin: auto; padding: 80px 15px 120px; }
        
        .post { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px; padding: 18px; margin-bottom: 16px; animation: fadeIn 0.4s ease; }
        .post-head { display: flex; gap: 12px; align-items: center; cursor: pointer; margin-bottom: 12px; }
        .post-head img { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--glass-border); }
        .post-content { font-size: 0.95rem; line-height: 1.5; color: #e2e8f0; }
        .post-img { width: 100%; border-radius: 18px; margin-top: 12px; border: 1px solid var(--glass-border); }

        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; height: 65px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px); border-radius: 25px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-around; z-index: 1000; }
        .nav-link { opacity: 0.4; transition: 0.3s; display: flex; align-items: center; justify-content: center; width: 50px; height: 50px; }
        .nav-link.active { opacity: 1; filter: drop-shadow(0 0 8px var(--primary)); }
        .nav-link img { width: 24px; filter: invert(1); }

        #fab { position: fixed; bottom: 100px; right: 25px; width: 60px; height: 60px; background: var(--primary); border-radius: 20px; border: none; font-size: 28px; font-weight: bold; z-index: 999; box-shadow: 0 8px 20px rgba(0, 242, 255, 0.3); cursor: pointer; }
        
        #loginSection { position: fixed; inset: 0; background: #000; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
        .btn-elite { background: var(--primary); border: none; padding: 12px 25px; border-radius: 12px; font-weight: 800; cursor: pointer; font-family: 'Orbitron'; font-size: 0.8rem; }
        .hidden { display: none !important; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="loginSection" class="hidden">
    <h1 class="logo" style="font-size: 3rem;">K</h1>
    <button class="btn-elite" onclick="login()">ACESSAR ELITE</button>
</div>

<header>
    <div class="logo">KLYON</div>
    <div id="bell" onclick="location.href='notificacoes.html'" style="cursor:pointer; position:relative;">🔔<span id="badge" style="display:none; position:absolute; top:-2px; right:-2px; width:8px; height:8px; background:red; border-radius:50%;"></span></div>
</header>

<main class="container" id="feed"></main>

<button id="fab" onclick="window.location.href='postar.html'">+</button>

<nav class="bottom-nav">
    <a href="index.html" class="nav-link active"><img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png"></a>
    <a href="buscar.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/149/149852.png"></a>
    <a href="perfil.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png"></a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, collection, query, orderBy, onSnapshot, limit } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", authDomain: "klyon-a97ba.firebaseapp.com", projectId: "klyon-a97ba", storageBucket: "klyon-a97ba.appspot.com" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    window.login = () => signInWithPopup(auth, provider);

    onAuthStateChanged(auth, user => {
        if (!user) document.getElementById('loginSection').classList.remove('hidden');
        else loadFeed();
    });

    function loadFeed() {
        const q = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(40));
        onSnapshot(q, s => {
            const f = document.getElementById('feed'); f.innerHTML = "";
            s.forEach(d => {
                const p = d.data();
                f.innerHTML += `
                    <div class="post">
                        <div class="post-head" onclick="location.href='perfil.html?uid=${p.uid}'">
                            <img src="${p.authorPhoto}">
                            <div><b>${p.authorName}</b><br><small style="color:var(--primary)">@${p.authorHandle}</small></div>
                        </div>
                        <div class="post-content">${p.content}</div>
                        ${p.image ? `<img src="${p.image}" class="post-img">` : ''}
                    </div>`;
            });
        });
    }
</script>
</body>
</html>
