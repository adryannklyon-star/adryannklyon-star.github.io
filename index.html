<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Klyon Elite | Social Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #ff00e5;
            --bg: #03030b;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-blur: blur(25px);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            margin: 0; background: var(--bg); color: #fff; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            line-height: 1.4;
        }

        /* ESTRUTURA DE SEÇÕES ISOLADAS */
        .section { 
            display: none; 
            width: 100%;
            min-height: calc(100vh - 130px);
            padding-top: 65px; 
            padding-bottom: 80px; 
        }
        .section.active { display: block; animation: slideUp 0.3s ease-out; }

        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* HEADER PREMIUM */
        header {
            position: fixed; top: 0; width: 100%; height: 60px;
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
            z-index: 1001; background: rgba(3, 3, 11, 0.8);
            backdrop-filter: var(--glass-blur); border-bottom: 1px solid var(--glass-border);
        }
        header h1 { font-family: 'Orbitron'; font-size: 1.1rem; color: var(--primary); text-shadow: 0 0 15px var(--primary); margin: 0; }

        .container { max-width: 600px; margin: auto; position: relative; }

        /* PERFIL TWITTER PRO */
        .profile-header { position: relative; width: 100%; }
        .profile-banner { height: 180px; background: #1a1a2e; background-size: cover; background-position: center; }
        .profile-content { padding: 0 15px; margin-top: -45px; }
        .avatar-wrapper { display: flex; justify-content: space-between; align-items: flex-end; }
        .p-avatar { width: 90px; height: 90px; border-radius: 50%; border: 4px solid var(--bg); object-fit: cover; background: #000; }
        
        .btn-action { 
            border: 1px solid var(--primary); background: transparent; color: var(--primary); 
            padding: 8px 18px; border-radius: 20px; font-weight: 700; cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-action:active { transform: scale(0.95); }
        .btn-filled { background: var(--primary); color: #000; }

        .p-info h2 { margin: 15px 0 2px; font-size: 1.3rem; }
        .p-info span { color: #71767b; font-size: 0.9rem; }
        .p-bio { margin: 12px 0; font-size: 0.95rem; white-space: pre-wrap; }
        .p-stats { display: flex; gap: 20px; font-size: 0.9rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px; }
        .p-stats b { color: #fff; }

        /* POSTS ESTILO X */
        .post { display: flex; gap: 12px; padding: 15px; border-bottom: 1px solid var(--glass-border); }
        .post-left img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; cursor: pointer; }
        .post-right { flex: 1; position: relative; }
        .post-header { display: flex; justify-content: space-between; color: #71767b; font-size: 0.9rem; margin-bottom: 5px; }
        .post-header b { color: #fff; font-size: 1rem; cursor: pointer; }
        .post-text { font-size: 0.95rem; margin-bottom: 10px; word-break: break-word; }
        .post-img { width: 100%; border-radius: 15px; margin-top: 10px; border: 1px solid var(--glass-border); }

        .post-footer { display: flex; gap: 40px; margin-top: 10px; color: #71767b; }
        .f-item { display: flex; align-items: center; gap: 6px; cursor: pointer; transition: 0.2s; }
        .f-item:hover { color: var(--primary); }
        .f-item.liked { color: var(--secondary); text-shadow: 0 0 10px var(--secondary); }

        /* MENU INFERIOR FIXADO */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: 65px;
            background: rgba(3, 3, 11, 0.9); backdrop-filter: var(--glass-blur);
            display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid var(--glass-border); z-index: 1000;
        }
        .nav-link { color: #71767b; text-align: center; font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; flex: 1; padding: 10px 0; }
        .nav-link.active { color: var(--primary); }
        .nav-link i { font-size: 1.4rem; display: block; margin-bottom: 3px; font-style: normal; }

        /* FLOATING BUTTON */
        #fab {
            position: fixed; bottom: 85px; right: 20px;
            width: 56px; height: 56px; border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none; color: white; font-size: 28px; font-weight: bold;
            box-shadow: 0 8px 25px rgba(0, 242, 255, 0.3); z-index: 999; cursor: pointer;
        }

        /* MODAIS */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 2000; display: none; padding: 20px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .k-input { width: 100%; background: transparent; border: none; color: #fff; font-size: 1.2rem; resize: none; }

        /* UTILS */
        .glass-btn { background: var(--glass); border: 1px solid var(--glass-border); color: #fff; padding: 10px 20px; border-radius: 12px; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <h1>KLYON ELITE</h1>
    <span id="top-status" style="font-size: 0.7rem; color: var(--primary); opacity: 0.7;">ONLINE</span>
</header>

<div id="loginSection" style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 40px; text-align: center;">
    <h2 style="font-family: 'Orbitron'; font-size: 2rem;">BEM-VINDO AO <br><span style="color:var(--primary)">MULTIVERSO</span></h2>
    <button onclick="login()" class="glass-btn" style="width: 100%; max-width: 300px; font-weight: 800;">Conectar com Google</button>
</div>

<div id="feedSection" class="section container">
    <div id="mainFeed"></div>
</div>

<div id="searchSection" class="section container">
    <div style="padding: 15px;">
        <input type="text" id="userSearch" placeholder="Pesquisar usuários..." style="width:100%; padding:15px; border-radius:30px; background:var(--glass); border:1px solid var(--glass-border); color:#fff;">
    </div>
    <div id="userResults"></div>
</div>

<div id="profileSection" class="section container">
    <div class="profile-header">
        <div class="profile-banner" id="p-banner" onclick="editMedia('banner')"></div>
        <div class="profile-content">
            <div class="avatar-wrapper">
                <img id="p-photo" src="" class="p-avatar" onclick="editMedia('photo')">
                <div id="profile-btns">
                    <button class="btn-action" onclick="toggleEditMode()">Editar Perfil</button>
                </div>
            </div>
            <div class="p-info">
                <h2 id="p-name">Nome</h2>
                <span id="p-handle">@elite_member</span>
                <p id="p-bio" class="p-bio">Carregando bio...</p>
                <div class="p-stats">
                    <span><b id="p-count">0</b> Amigos</span>
                    <span><b id="p-date">2026</b> Elite</span>
                </div>
            </div>
        </div>
    </div>
    <div id="userPosts"></div>
</div>

<div id="composeModal" class="modal">
    <div class="modal-header">
        <button onclick="closeModal()" class="glass-btn">Cancelar</button>
        <button onclick="publishPost()" class="btn-action btn-filled">Publicar</button>
    </div>
    <textarea id="postContent" class="k-input" placeholder="O que está acontecendo?" rows="6"></textarea>
    <input type="text" id="postImageUrl" placeholder="Link de imagem ou GIF (opcional)" style="width:100%; padding:10px; background:var(--glass); border:none; border-radius:10px; color:#fff; margin-top:10px;">
</div>

<button id="fab" onclick="openModal()">+</button>

<nav class="bottom-nav" id="navBar" style="display:none;">
    <div class="nav-link active" onclick="navigate('feedSection', this)"><i>🏠</i>Feed</div>
    <div class="nav-link" onclick="navigate('searchSection', this)"><i>🔍</i>Buscar</div>
    <div class="nav-link" onclick="navigate('profileSection', this)"><i>👤</i>Perfil</div>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, updateDoc, increment, where, deleteDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334",
    authDomain: "klyon-a97ba.firebaseapp.com",
    projectId: "klyon-a97ba"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentUserData = null;
let viewTargetUid = null; // Para ver perfis de outros

// --- NAVEGAÇÃO ---
window.navigate = (sectionId, el) => {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
    document.getElementById(sectionId).classList.add('active');
    el.classList.add('active');
    
    if(sectionId === 'profileSection') {
        viewTargetUid = auth.currentUser.uid;
        renderProfile(viewTargetUid);
    }
};

window.openModal = () => document.getElementById('composeModal').style.display = 'block';
window.closeModal = () => document.getElementById('composeModal').style.display = 'none';

// --- AUTH ---
window.login = () => signInWithPopup(auth, provider);
window.logout = () => signOut(auth);

onAuthStateChanged(auth, async (user) => {
    if (user) {
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("navBar").style.display = "flex";
        document.getElementById("fab").style.display = "block";
        await syncUser(user);
        navigate('feedSection', document.querySelector('.nav-link'));
        listenFeed();
    } else {
        document.getElementById("loginSection").style.display = "flex";
        document.getElementById("navBar").style.display = "none";
        document.getElementById("fab").style.display = "none";
    }
});

async function syncUser(user) {
    const ref = doc(db, "users", user.uid);
    const snap = await getDoc(ref);
    if(!snap.exists()) {
        currentUserData = { name: user.displayName, photo: user.photoURL, bio: "Membro Elite Klyon", friends: 0, banner: "" };
        await setDoc(ref, currentUserData);
    } else {
        currentUserData = snap.data();
    }
}

// --- FEED LOGIC ---
function listenFeed() {
    onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc")), (snap) => {
        const mainFeed = document.getElementById("mainFeed");
        mainFeed.innerHTML = "";
        snap.forEach(docSnap => {
            const p = docSnap.data();
            mainFeed.appendChild(createPostUI(docSnap.id, p));
        });
    });
}

function createPostUI(id, p) {
    const isOwner = auth.currentUser.uid === p.uid;
    const hasLiked = p.likedBy?.includes(auth.currentUser.uid);
    const div = document.createElement('div');
    div.className = 'post';
    div.innerHTML = `
        <div class="post-left"><img src="${p.userPhoto}" onclick="goToProfile('${p.uid}')"></div>
        <div class="post-right">
            <div class="post-header">
                <b onclick="goToProfile('${p.uid}')">${p.userName}</b>
                ${isOwner ? `<span onclick="deletePost('${id}')">✕</span>` : '<span>···</span>'}
            </div>
            <div class="post-text">${p.text}</div>
            ${p.img ? `<img src="${p.img}" class="post-img">` : ''}
            <div class="post-footer">
                <div class="f-item ${hasLiked ? 'liked' : ''}" onclick="likePost('${id}')"><i>🔥</i> ${p.likes || 0}</div>
                <div class="f-item"><i>💬</i> 0</div>
            </div>
        </div>
    `;
    return div;
}

// --- PERFIL LOGIC ---
async function renderProfile(uid) {
    const snap = await getDoc(doc(db, "users", uid));
    const u = snap.data();
    const isMe = uid === auth.currentUser.uid;
    
    document.getElementById("p-name").innerText = u.name;
    document.getElementById("p-photo").src = u.photo;
    document.getElementById("p-bio").innerText = u.bio || "";
    document.getElementById("p-count").innerText = u.friends || 0;
    document.getElementById("p-banner").style.backgroundImage = u.banner ? `url(${u.banner})` : 'linear-gradient(45deg, #1a1a2e, var(--secondary))';
    
    const btns = document.getElementById("profile-btns");
    btns.innerHTML = isMe ? 
        `<button class="btn-action" onclick="editProfilePrompt()">Editar Perfil</button>
         <button class="btn-action" style="border-color:#ff4444; color:#ff4444; margin-left:5px;" onclick="logout()">Sair</button>` : 
        `<button class="btn-action btn-filled" onclick="amigar('${uid}')">Amigar</button>`;

    // Feed do Usuário
    onSnapshot(query(collection(db, "posts"), where("uid", "==", uid), orderBy("createdAt", "desc")), (snap) => {
        const userFeed = document.getElementById("userPosts");
        userFeed.innerHTML = "";
        snap.forEach(d => userFeed.appendChild(createPostUI(d.id, d.data())));
    });
}

window.goToProfile = (uid) => {
    viewTargetUid = uid;
    navigate('profileSection', document.querySelectorAll('.nav-link')[2]);
    renderProfile(uid);
};

window.editProfilePrompt = async () => {
    const newName = prompt("Nome:", currentUserData.name);
    const newBio = prompt("Bio:", currentUserData.bio);
    if(newName) {
        await updateDoc(doc(db, "users", auth.currentUser.uid), { name: newName, bio: newBio });
        location.reload(); // Refresh simples para atualizar tudo
    }
};

window.editMedia = async (type) => {
    if(viewTargetUid !== auth.currentUser.uid) return;
    const url = prompt(`URL da imagem para ${type}:`);
    if(url) {
        await updateDoc(doc(db, "users", auth.currentUser.uid), { [type]: url });
        renderProfile(auth.currentUser.uid);
    }
};

// --- AÇÕES ---
window.publishPost = async () => {
    const text = document.getElementById("postContent").value;
    const img = document.getElementById("postImageUrl").value;
    if(!text.trim()) return;

    await addDoc(collection(db, "posts"), {
        uid: auth.currentUser.uid,
        userName: currentUserData.name,
        userPhoto: currentUserData.photo,
        text,
        img,
        likes: 0,
        likedBy: [],
        createdAt: serverTimestamp()
    });
    
    document.getElementById("postContent").value = "";
    document.getElementById("postImageUrl").value = "";
    closeModal();
};

window.likePost = async (id) => {
    const ref = doc(db, "posts", id);
    const snap = await getDoc(ref);
    const likedBy = snap.data().likedBy || [];
    const myUid = auth.currentUser.uid;
    
    if(likedBy.includes(myUid)) {
        await updateDoc(ref, { likes: increment(-1), likedBy: likedBy.filter(u => u !== myUid) });
    } else {
        await updateDoc(ref, { likes: increment(1), likedBy: [...likedBy, myUid] });
    }
};

window.deletePost = async (id) => {
    if(confirm("Excluir postagem permanentemente?")) await deleteDoc(doc(db, "posts", id));
};

window.amigar = async (uid) => {
    await updateDoc(doc(db, "users", uid), { friends: increment(1) });
    alert("Agora vocês são amigos elite!");
};

</script>
</body>
</html>
