<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLYON | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --bg: #030307; --glass: rgba(255,255,255,0.05); --glass-border: rgba(255,255,255,0.1); --text-dim: #94a3b8; }
        body { 
            margin: 0; background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; padding-bottom: 100px;
            background: radial-gradient(circle at 50% 0%, #0f172a 0%, #030307 100%);
        }
        .header { position: fixed; top: 0; width: 100%; height: 65px; background: rgba(3,3,7,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; box-sizing: border-box; }
        .post { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px; padding: 18px; margin: 15px; animation: fadeIn 0.5s ease; }
        .post-head { display: flex; gap: 12px; align-items: center; cursor: pointer; margin-bottom: 12px; }
        .post-head img { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--primary); }
        .post img.content-img { width: 100%; border-radius: 15px; margin-top: 10px; border: 1px solid var(--glass-border); }
        
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; height: 65px; background: rgba(15,23,42,0.9); backdrop-filter: blur(15px); border-radius: 25px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-around; z-index: 1000; }
        .nav-link { opacity: 0.4; cursor: pointer; }
        .nav-link.active { opacity: 1; filter: drop-shadow(0 0 8px var(--primary)); }
        .nav-link img { width: 24px; filter: invert(1); }

        #notifPanel { display:none; position:fixed; top:70px; right:20px; width:280px; background:rgba(10,10,20,0.95); border:1px solid var(--glass-border); border-radius:20px; z-index:2000; padding:15px; backdrop-filter:blur(20px); }
        .notif-item { font-size: 0.8rem; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .btn-elite { background: var(--primary); border: none; padding: 12px 25px; border-radius: 12px; font-weight: 800; cursor: pointer; font-family: 'Orbitron'; font-size: 0.7rem; }
        #loginSection { position: fixed; inset: 0; background: #000; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
        .hidden { display: none !important; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="loginSection" class="hidden">
    <h1 style="font-family:'Orbitron'; color:var(--primary); font-size: 3rem; letter-spacing: 10px;">KLYON</h1>
    <button class="btn-elite" onclick="login()">ACESSAR SISTEMA</button>
</div>

<header class="header">
    <span style="font-family:'Orbitron'; color:var(--primary); letter-spacing: 2px;">KLYON</span>
    <div onclick="toggleNotifs()" style="cursor:pointer; position: relative;">
        🔔<span id="badge" style="display:none; position:absolute; top:-2px; right:-2px; width:8px; height:8px; background:red; border-radius:50%;"></span>
    </div>
</header>

<div id="notifPanel">
    <div style="font-family:'Orbitron'; font-size:0.6rem; color:var(--primary); margin-bottom:10px;">ALERTAS</div>
    <div id="notifList"></div>
</div>

<main id="feed" style="margin-top: 80px;"></main>

<nav class="bottom-nav">
    <div class="nav-link active" onclick="location.href='index.html'"><img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png"></div>
    <div class="nav-link" onclick="location.href='buscar.html'"><img src="https://cdn-icons-png.flaticon.com/512/149/149852.png"></div>
    <div class="nav-link" onclick="location.href='perfil.html'"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png"></div>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, query, orderBy, onSnapshot, limit, where } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334",
        authDomain: "klyon-a97ba.firebaseapp.com",
        projectId: "klyon-a97ba",
        storageBucket: "klyon-a97ba.appspot.com"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    window.login = () => signInWithPopup(auth, provider);

    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            document.getElementById('loginSection').classList.remove('hidden');
        } else {
            document.getElementById('loginSection').classList.add('hidden');
            await syncUser(user);
            loadFeed();
            listenNotifs(user.uid);
        }
    });

    async function syncUser(user) {
        const ref = doc(db, "users", user.uid);
        const snap = await getDoc(ref);
        if(!snap.exists()) {
            await setDoc(ref, { 
                uid: user.uid, name: user.displayName, photo: user.photoURL, 
                handle: user.email.split('@')[0], following: [], followersCount: 0 
            });
        }
    }

    function loadFeed() {
        const q = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(30));
        onSnapshot(q, (snap) => {
            const container = document.getElementById('feed');
            container.innerHTML = "";
            snap.forEach(d => {
                const p = d.data();
                const postEl = document.createElement('div');
                postEl.className = 'post';
                postEl.innerHTML = `
                    <div class="post-head" onclick="location.href='perfil.html?uid=${p.uid}'">
                        <img src="${p.authorPhoto}">
                        <div><b>${p.authorName}</b><br><small style="color:var(--primary)">@${p.authorHandle}</small></div>
                    </div>
                    <div style="font-size:0.95rem;">${p.content}</div>
                    ${p.image ? `<img src="${p.image}" class="content-img">` : ''}
                `;
                container.appendChild(postEl);
            });
        });
    }

    function listenNotifs(uid) {
        const q = query(collection(db, "notifications"), where("to", "==", uid), orderBy("createdAt", "desc"), limit(5));
        onSnapshot(q, snap => {
            const list = document.getElementById('notifList');
            const badge = document.getElementById('badge');
            list.innerHTML = "";
            if(!snap.empty) badge.style.display = "block";
            snap.forEach(d => {
                list.innerHTML += `<div class="notif-item">${d.data().text}</div>`;
            });
        });
    }

    window.toggleNotifs = () => {
        const p = document.getElementById('notifPanel');
        p.style.display = p.style.display === 'block' ? 'none' : 'block';
        document.getElementById('badge').style.display = "none";
    }
</script>
</body>
</html>
