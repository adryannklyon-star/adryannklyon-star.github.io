<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Klyon Pro | Ultimate Social</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #7000ff;
            --accent: #ff007a;
            --bg: #050510;
            --card-bg: rgba(20, 20, 35, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #e0e0e0;
        }

        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        body {
            margin: 0;
            padding: 80px 0 100px 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top right, #1a0b2e, #050510);
            background-attachment: fixed;
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* HEADER E LOGO */
        header {
            position: fixed;
            top: 0; width: 100%; height: 70px;
            background: rgba(5, 5, 16, 0.8);
            backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: center;
            border-bottom: 1px solid var(--glass-border);
            z-index: 1000;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 4px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(0, 242, 255, 0.3));
        }

        .container { max-width: 600px; margin: auto; padding: 0 20px; }

        /* GLASSMORPHISM */
        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* INPUTS E BOTÕES */
        textarea, input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            color: white;
            padding: 15px;
            font-size: 1rem;
            outline: none;
        }

        textarea:focus, input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); }

        button {
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 15px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        button:hover { transform: translateY(-3px); box-shadow: 0 5px 20px rgba(112, 0, 255, 0.4); }

        /* POSTS */
        .post {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--glass-border);
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
        .post-header img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--primary); }
        .post-header b { font-size: 1.1rem; color: #fff; }

        .post-content { font-size: 1.05rem; line-height: 1.6; margin-bottom: 15px; color: #ccc; }

        .post-actions {
            display: flex;
            gap: 20px;
            border-top: 1px solid var(--glass-border);
            padding-top: 15px;
        }

        .action-btn {
            background: none;
            border: none;
            color: #888;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px;
            font-size: 0.9rem;
        }

        .action-btn:hover { color: var(--primary); }

        /* COMENTÁRIOS */
        .comment-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed var(--glass-border);
        }

        .comment-item {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            background: rgba(255,255,255,0.03);
            padding: 10px;
            border-radius: 12px;
        }

        /* NAV */
        .bottom-nav {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            height: 65px;
            background: rgba(20, 20, 35, 0.9);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            z-index: 1000;
        }

        .nav-item { font-size: 24px; color: #555; cursor: pointer; transition: 0.4s; }
        .nav-item.active { color: var(--primary); filter: drop-shadow(0 0 8px var(--primary)); }

        .section { display: none; }
        .section.active { display: block; }

        #loginSection { text-align: center; margin-top: 100px; }
    </style>
</head>
<body>

<header><h1>KLYON PRO</h1></header>

<div class="container">
    <div id="loginSection" class="glass">
        <h2 style="font-family: 'Orbitron'; margin-bottom: 30px;">Bem-vindo ao Futuro</h2>
        <button id="loginBtn" style="width: 100%; padding: 20px;">Entrar com conta Google</button>
    </div>

    <div id="feedSection" class="section">
        <div class="glass">
            <textarea id="postInput" placeholder="O que você está pensando?" rows="3"></textarea>
            <div style="display: flex; justify-content: flex-end; margin-top: 10px;">
                <button id="postBtn">Publicar</button>
            </div>
        </div>
        <div id="feed"></div>
    </div>

    <div id="searchSection" class="section">
        <div class="glass">
            <input type="text" id="searchInput" placeholder="Encontrar pessoas...">
        </div>
        <div id="userList"></div>
    </div>

    <div id="profileSection" class="section">
        <div class="glass" style="text-align: center;">
            <div style="position: relative; display: inline-block;">
                <img id="displayPic" src="" style="width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--secondary);">
                <button id="editProfileBtn" style="position: absolute; bottom: 0; right: 0; border-radius: 50%; width: 40px; height: 40px; padding: 0;">⚙️</button>
            </div>
            <h2 id="displayName" style="margin: 15px 0 5px;">Usuário</h2>
            <p id="displayBio" style="color: #888; font-style: italic;">Bio</p>
            
            <div id="editForm" style="display: none; margin-top: 20px; border-top: 1px solid #333; padding-top: 20px;">
                <input id="editName" placeholder="Nome Profissional" style="margin-bottom: 10px;">
                <textarea id="editBio" placeholder="Sua biografia..."></textarea>
                <button id="saveProfileBtn" style="width: 100%;">Salvar Perfil</button>
            </div>
            <button id="logoutBtn" style="margin-top: 30px; background: none; border: 1px solid #ff4444; color: #ff4444;">Sair da Conta</button>
        </div>
    </div>
</div>

<nav class="bottom-nav" id="bottomNav" style="display: none;">
    <div class="nav-item active" onclick="showSection('feedSection', this)">🏠</div>
    <div class="nav-item" onclick="showSection('searchSection', this)">🔍</div>
    <div class="nav-item" onclick="showSection('profileSection', this)">👤</div>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, deleteDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334",
    authDomain: "klyon-a97ba.firebaseapp.com",
    projectId: "klyon-a97ba"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

// EXPOR FUNÇÕES PARA O WINDOW (Global scope)
window.likePost = async (id) => { await updateDoc(doc(db, "posts", id), { likes: increment(1) }); };
window.deletePost = async (id) => { if(confirm("Deseja apagar esta memória?")) await deleteDoc(doc(db, "posts", id)); };

window.toggleComments = (id) => {
    const el = document.getElementById(`comments-${id}`);
    el.style.display = el.style.display === 'none' ? 'block' : 'none';
};

window.addComment = async (postId) => {
    const input = document.getElementById(`comment-input-${postId}`);
    if (!input.value.trim()) return;
    
    await addDoc(collection(db, "posts", postId, "comments"), {
        text: input.value,
        userName: auth.currentUser.displayName,
        createdAt: serverTimestamp()
    });
    input.value = "";
};

window.showSection = (id, el) => {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    el.classList.add('active');
};

// LOGICA DE AUTENTICAÇÃO
onAuthStateChanged(auth, async (user) => {
    if (user) {
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("bottomNav").style.display = "flex";
        showSection('feedSection', document.querySelector('.nav-item'));
        syncProfile(user);
        loadFeed();
    } else {
        document.getElementById("loginSection").style.display = "block";
        document.getElementById("bottomNav").style.display = "none";
    }
});

async function syncProfile(user) {
    const snap = await getDoc(doc(db, "users", user.uid));
    const data = snap.exists() ? snap.data() : { name: user.displayName, photo: user.photoURL, bio: "Explorador do Klyon" };
    
    document.getElementById("displayName").innerText = data.name;
    document.getElementById("displayPic").src = data.photo;
    document.getElementById("displayBio").innerText = data.bio;
    
    if(!snap.exists()) await setDoc(doc(db, "users", user.uid), data);
}

// PUBLICAR
document.getElementById("postBtn").onclick = async () => {
    const text = document.getElementById("postInput").value;
    if (!text.trim()) return;

    await addDoc(collection(db, "posts"), {
        uid: auth.currentUser.uid,
        text: text,
        userName: auth.currentUser.displayName,
        userPhoto: auth.currentUser.photoURL,
        likes: 0,
        createdAt: serverTimestamp()
    });
    document.getElementById("postInput").value = "";
};

// RENDERIZAR FEED DINÂMICO
function loadFeed() {
    onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc")), (snap) => {
        const feed = document.getElementById("feed");
        feed.innerHTML = "";
        
        snap.forEach(docSnap => {
            const p = docSnap.data();
            const id = docSnap.id;
            const isMe = auth.currentUser.uid === p.uid;

            const postEl = document.createElement("div");
            postEl.className = "post";
            postEl.innerHTML = `
                <div class="post-header">
                    <img src="${p.userPhoto}">
                    <div>
                        <b>${p.userName}</b><br>
                        <small style="opacity:0.5; font-size: 0.7rem;">Agora mesmo</small>
                    </div>
                    ${isMe ? `<button onclick="deletePost('${id}')" style="margin-left:auto; background:none; color:#ff4444; padding:5px;">✕</button>` : ''}
                </div>
                <div class="post-content">${p.text}</div>
                <div class="post-actions">
                    <button class="action-btn" onclick="likePost('${id}')">🔥 ${p.likes || 0}</button>
                    <button class="action-btn" onclick="toggleComments('${id}')">💬 Comentar</button>
                </div>
                <div id="comments-${id}" class="comment-section" style="display:none">
                    <div id="list-${id}"></div>
                    <div style="display:flex; gap:10px; margin-top:10px;">
                        <input id="comment-input-${id}" placeholder="Escreva algo..." style="padding:8px; font-size:0.8rem;">
                        <button onclick="addComment('${id}')" style="padding:5px 15px;">🚀</button>
                    </div>
                </div>
            `;
            feed.appendChild(postEl);
            loadComments(id);
        });
    });
}

function loadComments(postId) {
    onSnapshot(query(collection(db, "posts", postId, "comments"), orderBy("createdAt", "asc")), (snap) => {
        const list = document.getElementById(`list-${postId}`);
        if(!list) return;
        list.innerHTML = "";
        snap.forEach(cSnap => {
            const c = cSnap.data();
            list.innerHTML += `
                <div class="comment-item">
                    <b>${c.userName}:</b> <span>${c.text}</span>
                </div>
            `;
        });
    });
}

// BOTÕES DE LOGIN/OUT
document.getElementById("loginBtn").onclick = () => signInWithPopup(auth, provider);
document.getElementById("logoutBtn").onclick = () => signOut(auth);
document.getElementById("editProfileBtn").onclick = () => {
    const f = document.getElementById("editForm");
    f.style.display = f.style.display === 'none' ? 'block' : 'none';
};
</script>
</body>
</html>
