<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Klyon Elite | Full Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #ff00e5;
            --bg: #03030b;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-muted: #71767b;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            margin: 0; background: var(--bg); color: #fff; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        /* SEÇÕES */
        .section { display: none; width: 100%; min-height: 100vh; padding-top: 65px; padding-bottom: 90px; }
        .section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        header {
            position: fixed; top: 0; width: 100%; height: 60px;
            display: flex; align-items: center; justify-content: center;
            z-index: 1001; background: rgba(3, 3, 11, 0.8);
            backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border);
        }
        header h1 { font-family: 'Orbitron'; font-size: 1.1rem; color: var(--primary); letter-spacing: 2px; margin: 0; }

        .container { max-width: 600px; margin: auto; }

        /* PERFIL STYLE TWITTER */
        .profile-banner { height: 160px; background: #1a1a2e; background-size: cover; background-position: center; cursor: pointer; }
        .profile-content { padding: 0 15px; margin-top: -45px; position: relative; }
        .p-avatar { width: 90px; height: 90px; border-radius: 50%; border: 4px solid var(--bg); object-fit: cover; background: #000; cursor: pointer; }
        
        .handle-display { color: var(--primary); font-weight: 600; margin-bottom: 10px; display: block; }
        .p-bio { margin: 12px 0; font-size: 0.95rem; color: #e1e1e6; }

        /* EDIÇÃO */
        .edit-box { background: var(--glass); border: 1px solid var(--glass-border); padding: 15px; border-radius: 15px; margin-top: 15px; }
        .k-input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: #fff; padding: 12px; border-radius: 10px; margin-bottom: 10px; font-family: inherit; }
        
        .btn-action { border: 1px solid var(--primary); background: transparent; color: var(--primary); padding: 8px 18px; border-radius: 20px; font-weight: 700; cursor: pointer; }
        .btn-filled { background: var(--primary); color: #000; border: none; }

        /* POSTS */
        .post { display: flex; gap: 12px; padding: 15px; border-bottom: 1px solid var(--glass-border); }
        .post img.avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
        .post-right { flex: 1; }
        .post-header { font-size: 0.9rem; margin-bottom: 5px; }
        .post-header b { color: #fff; font-size: 1rem; margin-right: 5px; }
        .post-header span { color: var(--primary); opacity: 0.8; }
        .post-img { width: 100%; border-radius: 15px; margin-top: 10px; border: 1px solid var(--glass-border); }

        /* NAV COM SEUS ÍCONES */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: 70px;
            background: rgba(3, 3, 11, 0.95); backdrop-filter: blur(25px);
            display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid var(--glass-border); z-index: 1000;
        }
        .nav-link { flex: 1; text-align: center; opacity: 0.4; transition: 0.3s; cursor: pointer; }
        .nav-link img { width: 28px; height: 28px; object-fit: contain; }
        .nav-link.active { opacity: 1; transform: translateY(-3px); }
        .nav-link.active img { filter: drop-shadow(0 0 8px var(--primary)); }

        #fab {
            position: fixed; bottom: 85px; right: 20px; width: 56px; height: 56px; border-radius: 50%;
            background: var(--primary); border: none; color: #000; font-size: 30px; font-weight: bold;
            box-shadow: 0 5px 20px rgba(0, 242, 255, 0.3); z-index: 999; cursor: pointer;
        }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 2000; display: none; padding: 20px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<header><h1>KLYON ELITE</h1></header>

<div id="loginSection" style="height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column;">
    <h2 style="font-family: 'Orbitron'; color: var(--primary); margin-bottom: 30px;">GS ENGINE</h2>
    <button onclick="login()" class="btn-action btn-filled" style="padding: 15px 40px;">Entrar no Multiverso</button>
</div>

<div id="feedSection" class="section container">
    <div id="mainFeed"></div>
</div>

<div id="searchSection" class="section container">
    <div style="padding: 15px;"><input type="text" placeholder="Buscar no Klyon..." class="k-input" style="border-radius: 30px;"></div>
    <div id="userResults"></div>
</div>

<div id="profileSection" class="section container">
    <input type="file" id="bannerFile" class="hidden" accept="image/*" onchange="uploadToStorage(this, 'banner')">
    <input type="file" id="avatarFile" class="hidden" accept="image/*" onchange="uploadToStorage(this, 'photo')">

    <div class="profile-banner" id="p-banner" onclick="document.getElementById('bannerFile').click()"></div>
    <div class="profile-content">
        <div style="display: flex; justify-content: space-between; align-items: flex-end;">
            <img id="p-photo" src="" class="p-avatar" onclick="document.getElementById('avatarFile').click()">
            <button class="btn-action" onclick="toggleEdit(true)">Editar Perfil</button>
        </div>
        
        <div id="view-mode">
            <h2 id="p-name" style="margin: 15px 0 2px;">Nome</h2>
            <span class="handle-display">@<span id="p-handle">handle</span></span>
            <p id="p-bio" class="p-bio">Bio...</p>
        </div>

        <div id="edit-mode" class="edit-box" style="display: none;">
            <input type="text" id="in-name" class="k-input" placeholder="Nome">
            <input type="text" id="in-handle" class="k-input" placeholder="@handle_unico">
            <textarea id="in-bio" class="k-input" placeholder="Sua bio..."></textarea>
            <div style="display: flex; gap: 10px;">
                <button class="btn-action btn-filled" onclick="saveEliteProfile()">Salvar</button>
                <button class="btn-action" onclick="toggleEdit(false)">Cancelar</button>
            </div>
        </div>
    </div>
    <div id="myPosts"></div>
</div>

<div id="postModal" class="modal">
    <input type="file" id="postFile" class="hidden" accept="image/*" onchange="previewPost(this)">
    <div style="display:flex; justify-content: space-between; align-items:center;">
        <button onclick="closeModal()" style="background:none; border:none; color:#fff;">Voltar</button>
        <div style="display:flex; gap:15px; align-items:center;">
            <span onclick="document.getElementById('postFile').click()" style="cursor:pointer; font-size:1.5rem;">🖼️</span>
            <button id="pubBtn" class="btn-action btn-filled" onclick="publishElitePost()">Publicar</button>
        </div>
    </div>
    <textarea id="postText" class="k-input" style="height: 150px; margin-top: 20px; background:none; border:none; font-size: 1.2rem;" placeholder="O que está acontecendo?"></textarea>
    <img id="post-preview" class="post-img" style="display:none; max-height: 250px; object-fit: cover;">
</div>

<button id="fab" onclick="document.getElementById('postModal').style.display='block'" style="display:none;">+</button>

<nav class="bottom-nav" id="navBar" style="display:none;">
    <div class="nav-link active" onclick="navigate('feedSection', this)"><img src="home.png"></div>
    <div class="nav-link" onclick="navigate('searchSection', this)"><img src="buscar.png"></div>
    <div class="nav-link" onclick="navigate('profileSection', this)"><img src="perfil.png"></div>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, updateDoc, increment, where, runTransaction } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-storage.js";

const firebaseConfig = {
    apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334",
    authDomain: "klyon-a97ba.firebaseapp.com",
    projectId: "klyon-a97ba",
    storageBucket: "klyon-a97ba.appspot.com"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);
const provider = new GoogleAuthProvider();

let uData = null;
let postFile = null;

// --- NAVEGAÇÃO ---
window.navigate = (id, el) => {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    el.classList.add('active');
    if(id === 'profileSection') renderProfile(auth.currentUser.uid);
};

window.closeModal = () => {
    document.getElementById('postModal').style.display = 'none';
    document.getElementById('postText').value = "";
    document.getElementById('post-preview').style.display = 'none';
    postFile = null;
};

// --- AUTH & SYNC ---
window.login = () => signInWithPopup(auth, provider);
onAuthStateChanged(auth, async (user) => {
    if (user) {
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("navBar").style.display = "flex";
        document.getElementById("fab").style.display = "block";
        await syncUser(user);
        navigate('feedSection', document.querySelector('.nav-link'));
        loadFeed();
    } else {
        document.getElementById("loginSection").style.display = "flex";
        document.getElementById("navBar").style.display = "none";
    }
});

async function syncUser(user) {
    const snap = await getDoc(doc(db, "users", user.uid));
    if(!snap.exists()) {
        const handle = "elite" + Math.floor(Math.random()*9999);
        uData = { name: user.displayName, photo: user.photoURL, handle, bio: "Membro Klyon", banner: "" };
        await setDoc(doc(db, "users", user.uid), uData);
        await setDoc(doc(db, "handles", handle), { uid: user.uid });
    } else uData = snap.data();
}

// --- PERFIL & STORAGE ---
window.uploadToStorage = async (input, type) => {
    const file = input.files[0];
    if(!file) return;
    const sRef = ref(storage, `users/${auth.currentUser.uid}/${type}`);
    await uploadBytes(sRef, file);
    const url = await getDownloadURL(sRef);
    await updateDoc(doc(db, "users", auth.currentUser.uid), { [type]: url });
    uData[type] = url;
    renderProfile(auth.currentUser.uid);
};

window.toggleEdit = (show) => {
    document.getElementById('view-mode').style.display = show ? 'none' : 'block';
    document.getElementById('edit-mode').style.display = show ? 'block' : 'none';
    if(show) {
        document.getElementById('in-name').value = uData.name;
        document.getElementById('in-handle').value = uData.handle;
        document.getElementById('in-bio').value = uData.bio;
    }
};

window.saveEliteProfile = async () => {
    const newName = document.getElementById('in-name').value;
    const newBio = document.getElementById('in-bio').value;
    const newHandle = document.getElementById('in-handle').value.toLowerCase().trim();
    const oldHandle = uData.handle;

    try {
        await runTransaction(db, async (t) => {
            if(newHandle !== oldHandle) {
                const hSnap = await t.get(doc(db, "handles", newHandle));
                if(hSnap.exists()) throw "Handle ocupado";
                t.set(doc(db, "handles", newHandle), { uid: auth.currentUser.uid });
                t.delete(doc(db, "handles", oldHandle));
            }
            t.update(doc(db, "users", auth.currentUser.uid), { name: newName, bio: newBio, handle: newHandle });
        });
        uData.name = newName; uData.bio = newBio; uData.handle = newHandle;
        toggleEdit(false); renderProfile(auth.currentUser.uid);
    } catch(e) { alert(e); }
};

async function renderProfile(uid) {
    const snap = await getDoc(doc(db, "users", uid));
    const d = snap.data();
    document.getElementById('p-name').innerText = d.name;
    document.getElementById('p-handle').innerText = d.handle;
    document.getElementById('p-bio').innerText = d.bio;
    document.getElementById('p-photo').src = d.photo;
    document.getElementById('p-banner').style.backgroundImage = d.banner ? `url(${d.banner})` : 'linear-gradient(45deg, #1a1a2e, #000)';
    
    onSnapshot(query(collection(db, "posts"), where("uid", "==", uid), orderBy("createdAt", "desc")), s => {
        const div = document.getElementById('myPosts'); div.innerHTML = "";
        s.forEach(doc => div.appendChild(createUI(doc.id, doc.data())));
    });
}

// --- FEED & POST ---
window.previewPost = (input) => {
    postFile = input.files[0];
    const reader = new FileReader();
    reader.onload = e => { 
        document.getElementById('post-preview').src = e.target.result;
        document.getElementById('post-preview').style.display = 'block';
    };
    reader.readAsDataURL(postFile);
};

window.publishElitePost = async () => {
    const txt = document.getElementById('postText').value;
    const btn = document.getElementById('pubBtn');
    btn.disabled = true; btn.innerText = "...";
    
    let imgUrl = "";
    if(postFile) {
        const sRef = ref(storage, `posts/${Date.now()}`);
        await uploadBytes(sRef, postFile);
        imgUrl = await getDownloadURL(sRef);
    }

    await addDoc(collection(db, "posts"), {
        uid: auth.currentUser.uid,
        userName: uData.name,
        userPhoto: uData.photo,
        userHandle: uData.handle,
        text: txt,
        img: imgUrl,
        likes: 0, likedBy: [],
        createdAt: serverTimestamp()
    });
    closeModal(); btn.disabled = false; btn.innerText = "Publicar";
};

function loadFeed() {
    onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc")), s => {
        const feed = document.getElementById('mainFeed'); feed.innerHTML = "";
        s.forEach(doc => feed.appendChild(createUI(doc.id, doc.data())));
    });
}

function createUI(id, p) {
    const div = document.createElement('div');
    div.className = 'post';
    div.innerHTML = `
        <img class="avatar" src="${p.userPhoto}">
        <div class="post-right">
            <div class="post-header"><b>${p.userName}</b> <span>@${p.userHandle}</span></div>
            <div class="post-text">${p.text}</div>
            ${p.img ? `<img src="${p.img}" class="post-img">` : ''}
            <div style="margin-top:10px; cursor:pointer;" onclick="likePost('${id}')">🔥 ${p.likes || 0}</div>
        </div>`;
    return div;
}

window.likePost = async (id) => {
    const ref = doc(db, "posts", id);
    const snap = await getDoc(ref);
    const likedBy = snap.data().likedBy || [];
    const myUid = auth.currentUser.uid;
    if(likedBy.includes(myUid)) {
        await updateDoc(ref, { likes: increment(-1), likedBy: likedBy.filter(u => u !== myUid) });
    } else {
        await updateDoc(ref, { likes: increment(1), likedBy: [...likedBy, myUid] });
    }
};

</script>
</body>
</html>
