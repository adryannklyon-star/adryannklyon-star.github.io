<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Klyon Social Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root { --primary: #ff00cc; --secondary: #3333ff; --accent: #7a00ff; --bg: #0b0b1a; --glass: rgba(255, 255, 255, 0.05); }
  body { margin: 0; padding: 70px 0 80px 0; font-family: 'Inter', sans-serif; background: var(--bg); color: white; }
  
  header { position: fixed; top: 0; width: 100%; height: 60px; background: rgba(11, 11, 26, 0.9); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 100; }
  header h1 { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; background: linear-gradient(90deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  .container { max-width: 500px; margin: auto; padding: 0 15px; }
  .glass { background: var(--glass); padding: 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 15px; }
  
  /* PERFIL STYLES */
  .profile-header { text-align: center; position: relative; }
  .profile-pic-container { position: relative; width: 100px; height: 100px; margin: 0 auto 10px; }
  .profile-pic { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary); }
  .edit-icon { position: absolute; bottom: 0; right: 0; background: var(--accent); padding: 5px; border-radius: 50%; cursor: pointer; font-size: 14px; }
  
  /* POST STYLES */
  .post { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 15px; margin-bottom: 15px; position: relative; }
  .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .post-header img { width: 40px; height: 40px; border-radius: 50%; }
  .post-menu { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; }
  .post-btn { background: none; border: none; color: #aaa; cursor: pointer; font-size: 16px; }

  /* NAV */
  .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: rgba(11, 11, 26, 0.95); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); z-index: 100; }
  .nav-item { font-size: 22px; color: rgba(255,255,255,0.5); cursor: pointer; }
  .nav-item.active { color: var(--primary); }

  .section { display: none; }
  .section.active { display: block; }
  button { width: 100%; padding: 12px; border-radius: 12px; border: none; background: linear-gradient(90deg, var(--primary), var(--accent)); color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
  input, textarea { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white; margin-bottom: 10px; box-sizing: border-box; }
  
  .user-card { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
</style>
</head>
<body>

<header><h1>KLYON ⚡</h1></header>

<div class="container">
  <div id="loginSection" class="glass" style="text-align: center; margin-top: 50px;">
    <h2>Klyon Social</h2>
    <button id="loginBtn">Entrar com Google</button>
  </div>

  <div id="feedSection" class="section">
    <div class="glass">
      <textarea id="postInput" placeholder="O que há de novo?"></textarea>
      <button id="postBtn">Publicar</button>
    </div>
    <div id="feed"></div>
  </div>

  <div id="searchSection" class="section">
    <div class="glass">
      <input type="text" id="searchInput" placeholder="Buscar usuários...">
    </div>
    <div id="userList"></div>
  </div>

  <div id="profileSection" class="section">
    <div class="glass profile-header">
      <div class="profile-pic-container">
        <img id="displayPic" src="https://via.placeholder.com/100" class="profile-pic">
        <div class="edit-icon" id="editProfileBtn">✏️</div>
      </div>
      <h2 id="displayName">Carregando...</h2>
      <p id="displayBio" style="opacity: 0.7;">Bio aqui...</p>
      <div style="margin-top: 10px; font-weight: bold;">
        Amigos: <span id="friendCount">0</span>
      </div>

      <div id="editForm" style="display: none; margin-top: 20px; text-align: left; border-top: 1px solid #333; padding-top: 15px;">
        <input id="editName" placeholder="Nome">
        <input id="editPhoto" placeholder="URL da Foto">
        <textarea id="editBio" placeholder="Bio"></textarea>
        <button id="saveProfileBtn">Salvar</button>
      </div>
      
      <button id="logoutBtn" style="background:none; border:1px solid #444; font-size: 12px; margin-top: 20px;">Sair</button>
    </div>
  </div>
</div>

<nav class="bottom-nav" id="bottomNav" style="display: none;">
  <div class="nav-item active" onclick="showSection('feedSection', this)">🏠</div>
  <div class="nav-item" onclick="showSection('searchSection', this)">🔍</div>
  <div class="nav-item" onclick="showSection('profileSection', this)">👤</div>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, deleteDoc, updateDoc, increment, getDocs, where } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334",
  authDomain: "klyon-a97ba.firebaseapp.com",
  projectId: "klyon-a97ba"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

// NAVEGAÇÃO
window.showSection = (id, el) => {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  el.classList.add('active');
  if(id === 'searchSection') loadUsers();
};

// LOGIN / PROFILE LOGIC
onAuthStateChanged(auth, async (user) => {
  if (user) {
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("bottomNav").style.display = "flex";
    showSection('feedSection', document.querySelector('.nav-item'));
    loadMyProfile(user);
  } else {
    document.getElementById("loginSection").style.display = "block";
    document.getElementById("bottomNav").style.display = "none";
  }
});

async function loadMyProfile(user) {
  const snap = await getDoc(doc(db, "users", user.uid));
  const data = snap.exists() ? snap.data() : { name: user.displayName, bio: "", photo: user.photoURL };
  
  document.getElementById("displayName").innerText = data.name || user.displayName;
  document.getElementById("displayBio").innerText = data.bio || "Sem bio";
  document.getElementById("displayPic").src = data.photo || user.photoURL;
  
  // Preencher inputs de edição
  document.getElementById("editName").value = data.name || user.displayName;
  document.getElementById("editBio").value = data.bio || "";
  document.getElementById("editPhoto").value = data.photo || user.photoURL;

  // Contador de Amigos (Simplificado)
  const friendsSnap = await getDocs(query(collection(db, "friends"), where("user1", "==", user.uid)));
  document.getElementById("friendCount").innerText = friendsSnap.size;
}

// EDITAR PERFIL (LÁPIS)
document.getElementById("editProfileBtn").onclick = () => {
  const form = document.getElementById("editForm");
  form.style.display = form.style.display === "none" ? "block" : "none";
};

document.getElementById("saveProfileBtn").onclick = async () => {
  const user = auth.currentUser;
  await setDoc(doc(db, "users", user.uid), {
    name: document.getElementById("editName").value,
    bio: document.getElementById("editBio").value,
    photo: document.getElementById("editPhoto").value
  }, { merge: true });
  alert("Perfil Salvo!");
  loadMyProfile(user);
  document.getElementById("editForm").style.display = "none";
};

// POSTAR
document.getElementById("postBtn").onclick = async () => {
  const user = auth.currentUser;
  const text = document.getElementById("postInput").value;
  if (!text.trim()) return;

  const userSnap = await getDoc(doc(db, "users", user.uid));
  const userData = userSnap.data();

  await addDoc(collection(db, "posts"), {
    uid: user.uid,
    text: text,
    userName: userData?.name || user.displayName,
    userPhoto: userData?.photo || user.photoURL,
    likes: 0,
    createdAt: serverTimestamp()
  });
  document.getElementById("postInput").value = "";
};

// FEED & AÇÕES (EDITAR/EXCLUIR)
onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc")), (snap) => {
  const feed = document.getElementById("feed");
  feed.innerHTML = "";
  snap.forEach(docSnap => {
    const p = docSnap.data();
    const isMe = auth.currentUser?.uid === p.uid;
    const postEl = document.createElement("div");
    postEl.className = "post";
    postEl.innerHTML = `
      <div class="post-header">
        <img src="${p.userPhoto}">
        <b>${p.userName}</b>
      </div>
      <p id="text-${docSnap.id}">${p.text}</p>
      ${isMe ? `
        <div class="post-menu">
          <button class="post-btn" onclick="editPost('${docSnap.id}', '${p.text}')">✏️</button>
          <button class="post-btn" onclick="deletePost('${docSnap.id}')">🗑️</button>
        </div>` : ''}
      <div style="font-size: 14px; color: var(--primary); cursor: pointer;" onclick="likePost('${docSnap.id}')">❤️ ${p.likes || 0}</div>
    `;
    feed.appendChild(postEl);
  });
});

window.deletePost = async (id) => { if(confirm("Excluir post?")) await deleteDoc(doc(db, "posts", id)); };
window.editPost = async (id, oldText) => {
  const newText = prompt("Edite seu post:", oldText);
  if(newText) await updateDoc(doc(db, "posts", id), { text: newText });
};
window.likePost = async (id) => { await updateDoc(doc(db, "posts", id), { likes: increment(1) }); };

// BUSCA E AMIGOS (FOLLOW)
async function loadUsers() {
  const snap = await getDocs(collection(db, "users"));
  const list = document.getElementById("userList");
  list.innerHTML = "";
  snap.forEach(uDoc => {
    if(uDoc.id === auth.currentUser.uid) return;
    const u = uDoc.data();
    list.innerHTML += `
      <div class="user-card">
        <div style="display:flex; align-items:center; gap:10px">
          <img src="${u.photo}" style="width:30px; border-radius:50%">
          <span>${u.name}</span>
        </div>
        <button style="width:auto; padding:5px 10px; font-size:12px" onclick="followUser('${uDoc.id}')">Seguir</button>
      </div>
    `;
  });
}

window.followUser = async (targetUid) => {
  const myUid = auth.currentUser.uid;
  // Cria uma relação de amizade/seguidor
  await setDoc(doc(db, "friends", myUid + "_" + targetUid), {
    user1: myUid,
    user2: targetUid
  });
  alert("Agora você segue este usuário!");
};

document.getElementById("loginBtn").onclick = () => signInWithPopup(auth, provider);
document.getElementById("logoutBtn").onclick = () => signOut(auth);
</script>
</body>
</html>
