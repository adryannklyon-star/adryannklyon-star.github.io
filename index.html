<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Klyon Pro | Ultimate Social</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #7000ff;
            --accent: #ff007a;
            --bg: #050510;
            --card-bg: rgba(20, 20, 35, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #e0e0e0;
        }

        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        body {
            margin: 0;
            padding: 70px 0 100px 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top right, #1a0b2e, #050510);
            background-attachment: fixed;
            color: var(--text-main);
            overflow-x: hidden;
        }

        header {
            position: fixed;
            top: 0; width: 100%; height: 60px;
            background: rgba(5, 5, 16, 0.8);
            backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: center;
            border-bottom: 1px solid var(--glass-border);
            z-index: 1000;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 4px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container { max-width: 600px; margin: auto; padding: 0 15px; }

        /* POST ESTILO TWITTER */
        .post {
            background: transparent;
            border-bottom: 1px solid var(--glass-border);
            padding: 15px 0;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .post-layout { display: flex; gap: 12px; }
        .post-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 1px solid var(--glass-border); }
        .post-body { flex: 1; }
        .post-header { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .post-header b { color: #fff; font-size: 1rem; }
        .post-content { font-size: 1rem; line-height: 1.5; color: #d1d1d1; margin-bottom: 12px; }

        /* FLOATING ACTION BUTTON (FAB) */
        #fab {
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            color: white;
            box-shadow: 0 8px 25px rgba(0, 242, 255, 0.4);
            cursor: pointer;
            z-index: 999;
            border: none;
        }

        /* MODAL DE POSTAGEM */
        #postModal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 16, 0.95);
            z-index: 2000;
            display: none;
            padding: 20px;
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        #postInput {
            width: 100%;
            height: 200px;
            background: transparent;
            border: none;
            color: white;
            font-size: 1.2rem;
            resize: none;
            outline: none;
        }

        /* ACTIONS */
        .post-actions { display: flex; gap: 30px; margin-top: 10px; }
        .action-btn { background: none; border: none; color: #71767b; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .action-btn:hover { color: var(--primary); }

        /* NAV */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 65px;
            background: rgba(5, 5, 16, 0.95);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--glass-border);
            z-index: 1000;
        }
        .nav-item { font-size: 22px; color: #555; cursor: pointer; }
        .nav-item.active { color: white; border-bottom: 2px solid var(--primary); }

        .section { display: none; }
        .section.active { display: block; }
        
        .comment-section { background: rgba(255,255,255,0.03); border-radius: 15px; padding: 10px; margin-top: 10px; }
        .comment-input-area { display: flex; gap: 10px; margin-top: 10px; }
        .comment-input-area input { flex: 1; padding: 8px; border-radius: 20px; background: #000; border: 1px solid #333; color: white; }
    </style>
</head>
<body>

<header><h1>KLYON PRO</h1></header>

<div id="postModal">
    <div class="modal-header">
        <button onclick="toggleModal()" style="background:none; border:none; color:white; font-size:1.5rem;">✕</button>
        <button id="postBtn" style="border-radius: 20px; padding: 8px 20px;">Publicar</button>
    </div>
    <textarea id="postInput" placeholder="O que está acontecendo?"></textarea>
</div>

<div class="container">
    <div id="loginSection" style="text-align:center; padding-top:100px;">
        <h2 style="font-family:'Orbitron'">KLYON</h2>
        <button id="loginBtn" style="width:100%; margin-top:20px;">Entrar com Google</button>
    </div>

    <div id="feedSection" class="section">
        <div id="feed"></div>
    </div>

    <div id="searchSection" class="section">
        <input type="text" id="searchInput" placeholder="Buscar usuários..." style="margin-bottom:20px">
        <div id="userList"></div>
    </div>

    <div id="profileSection" class="section">
        <div style="text-align: center; background: var(--card-bg); padding: 20px; border-radius: 20px;">
            <img id="displayPic" src="" style="width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--primary);">
            <h2 id="displayName">Usuário</h2>
            <p id="displayBio" style="opacity:0.6">Minha bio no Klyon</p>
            <button id="logoutBtn" style="background:none; color:red; border:1px solid red; margin-top:20px">Sair</button>
        </div>
    </div>
</div>

<button id="fab" onclick="toggleModal()" style="display: none;">+</button>

<nav class="bottom-nav" id="bottomNav" style="display: none;">
    <div class="nav-item active" onclick="showSection('feedSection', this)">🏠</div>
    <div class="nav-item" onclick="showSection('searchSection', this)">🔍</div>
    <div class="nav-item" onclick="showSection('profileSection', this)">👤</div>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, deleteDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334",
    authDomain: "klyon-a97ba.firebaseapp.com",
    projectId: "klyon-a97ba"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

// FUNÇÕES DE INTERFACE
window.toggleModal = () => {
    const m = document.getElementById('postModal');
    m.style.display = m.style.display === 'block' ? 'none' : 'block';
};

window.showSection = (id, el) => {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    el.classList.add('active');
};

// LOGIN / AUTH
onAuthStateChanged(auth, async (user) => {
    if (user) {
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("bottomNav").style.display = "flex";
        document.getElementById("fab").style.display = "flex";
        showSection('feedSection', document.querySelector('.nav-item'));
        loadMyProfile(user);
        loadFeed();
    } else {
        document.getElementById("loginSection").style.display = "block";
        document.getElementById("bottomNav").style.display = "none";
        document.getElementById("fab").style.display = "none";
    }
});

async function loadMyProfile(user) {
    const snap = await getDoc(doc(db, "users", user.uid));
    const data = snap.exists() ? snap.data() : { name: user.displayName, photo: user.photoURL };
    document.getElementById("displayName").innerText = data.name;
    document.getElementById("displayPic").src = data.photo;
}

// POSTAR
document.getElementById("postBtn").onclick = async () => {
    const text = document.getElementById("postInput").value;
    if (!text.trim()) return;

    await addDoc(collection(db, "posts"), {
        uid: auth.currentUser.uid,
        text: text,
        userName: auth.currentUser.displayName,
        userPhoto: auth.currentUser.photoURL,
        likes: 0,
        createdAt: serverTimestamp()
    });
    
    document.getElementById("postInput").value = "";
    toggleModal();
};

// CARREGAR FEED (ESTILO TWITTER)
function loadFeed() {
    onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc")), (snap) => {
        const feed = document.getElementById("feed");
        feed.innerHTML = "";
        snap.forEach(docSnap => {
            const p = docSnap.data();
            const id = docSnap.id;
            const postEl = document.createElement("div");
            postEl.className = "post";
            postEl.innerHTML = `
                <div class="post-layout">
                    <img src="${p.userPhoto}" class="post-avatar">
                    <div class="post-body">
                        <div class="post-header">
                            <b>${p.userName}</b>
                            ${auth.currentUser.uid === p.uid ? `<button onclick="deletePost('${id}')" style="background:none; border:none; color:#555">✕</button>` : ''}
                        </div>
                        <div class="post-content">${p.text}</div>
                        <div class="post-actions">
                            <button class="action-btn" onclick="likePost('${id}')">❤️ ${p.likes || 0}</button>
                            <button class="action-btn" onclick="toggleComments('${id}')">💬</button>
                        </div>
                        <div id="comments-${id}" class="comment-section" style="display:none">
                            <div id="list-${id}"></div>
                            <div class="comment-input-area">
                                <input id="in-${id}" placeholder="Postar sua resposta">
                                <button onclick="sendComment('${id}')" style="padding:5px 15px; border-radius:20px;">Responder</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            feed.appendChild(postEl);
            loadComments(id);
        });
    });
}

// COMENTÁRIOS E CURTIDAS
window.likePost = async (id) => await updateDoc(doc(db, "posts", id), { likes: increment(1) });
window.deletePost = async (id) => confirm("Excluir?") && await deleteDoc(doc(db, "posts", id));
window.toggleComments = (id) => {
    const c = document.getElementById(`comments-${id}`);
    c.style.display = c.style.display === 'none' ? 'block' : 'none';
};

window.sendComment = async (postId) => {
    const val = document.getElementById(`in-${postId}`).value;
    if(!val.trim()) return;
    await addDoc(collection(db, "posts", postId, "comments"), {
        text: val,
        userName: auth.currentUser.displayName,
        createdAt: serverTimestamp()
    });
    document.getElementById(`in-${postId}`).value = "";
};

function loadComments(postId) {
    onSnapshot(query(collection(db, "posts", postId, "comments"), orderBy("createdAt", "asc")), (snap) => {
        const list = document.getElementById(`list-${postId}`);
        if(!list) return;
        list.innerHTML = "";
        snap.forEach(c => {
            list.innerHTML += `<div style="font-size:0.9rem; margin-bottom:5px;"><b>${c.data().userName}:</b> ${c.data().text}</div>`;
        });
    });
}

document.getElementById("loginBtn").onclick = () => signInWithPopup(auth, provider);
document.getElementById("logoutBtn").onclick = () => signOut(auth);
</script>
</body>
</html>
