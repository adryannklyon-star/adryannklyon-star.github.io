<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Klyon Social | Elite Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #ff00e5;
            --bg: #03030b;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-blur: blur(20px);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; scroll-behavior: smooth; }
        
        body { 
            margin: 0; background: var(--bg); color: #fff; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        /* FIX: Isolamento de Seções */
        .section { 
            display: none; 
            min-height: 100vh; 
            padding-bottom: 100px;
            padding-top: 60px;
        }
        .section.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* HEADER GLASS */
        header {
            position: fixed; top: 0; width: 100%; height: 60px;
            display: flex; align-items: center; padding: 0 20px;
            z-index: 1000; background: rgba(3, 3, 11, 0.7);
            backdrop-filter: var(--glass-blur); border-bottom: 1px solid var(--glass-border);
        }
        header h1 { font-family: 'Orbitron'; font-size: 1rem; color: var(--primary); letter-spacing: 2px; margin: 0; }

        .container { max-width: 600px; margin: auto; }

        /* TWITTER PROFILE STYLE */
        .profile-banner { height: 150px; background: linear-gradient(45deg, #1a1a2e, var(--secondary)); width: 100%; }
        .profile-info-container { padding: 0 15px; position: relative; margin-top: -50px; border-bottom: 1px solid var(--glass-border); padding-bottom: 20px; }
        .profile-avatar-big { 
            width: 100px; height: 100px; border-radius: 50%; 
            border: 4px solid var(--bg); background: var(--bg); object-fit: cover;
        }
        .profile-actions-row { display: flex; justify-content: flex-end; padding-top: 55px; }
        .edit-profile-btn { border: 1px solid var(--glass-border); background: transparent; color: white; padding: 8px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; }
        
        .profile-names { margin-top: 15px; }
        .profile-names h2 { margin: 0; font-size: 1.4rem; }
        .profile-names span { color: #8b8b9a; font-size: 0.9rem; }
        
        .profile-stats { display: flex; gap: 20px; margin-top: 15px; font-size: 0.9rem; }
        .profile-stats b { color: #fff; }
        .profile-stats span { color: #8b8b9a; }

        .profile-tabs { display: flex; border-bottom: 1px solid var(--glass-border); margin-top: 10px; }
        .tab { flex: 1; text-align: center; padding: 15px; cursor: pointer; color: #8b8b9a; font-weight: 600; position: relative; }
        .tab.active { color: #fff; }
        .tab.active::after { content: ''; position: absolute; bottom: 0; left: 25%; width: 50%; height: 4px; background: var(--primary); border-radius: 10px; }

        /* POSTS */
        .post { padding: 15px; border-bottom: 1px solid var(--glass-border); display: flex; gap: 12px; }
        .post-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
        .post-main { flex: 1; }
        .post-user-info { display: flex; align-items: center; gap: 5px; margin-bottom: 4px; }
        .post-user-info b { font-size: 1rem; }
        .post-text { color: #e1e1e6; line-height: 1.5; font-size: 0.95rem; margin-bottom: 12px; }
        
        /* FOGO NEON ANIMADO */
        .fire-action { display: flex; align-items: center; gap: 6px; color: #8b8b9a; cursor: pointer; }
        .fire-action.active { color: var(--secondary); text-shadow: 0 0 15px var(--secondary); }
        .fire-action.active i { animation: pulseFire 0.5s ease; }
        
        @keyframes pulseFire {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }

        /* BOTTOM NAV - FIXO E ISOLADO */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: 70px;
            background: rgba(3, 3, 11, 0.85); backdrop-filter: var(--glass-blur);
            display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid var(--glass-border); z-index: 1000;
        }
        .nav-item { color: #8b8b9a; text-align: center; flex: 1; font-size: 0.7rem; cursor: pointer; }
        .nav-item i { font-size: 1.5rem; display: block; margin-bottom: 2px; }
        .nav-item.active { color: var(--primary); }

        /* FAB */
        #fab {
            position: fixed; bottom: 85px; right: 20px;
            width: 56px; height: 56px; border-radius: 50%;
            background: var(--primary); border: none; font-size: 24px;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4); z-index: 900; cursor: pointer;
        }

        /* LOGIN */
        #loginSection { height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-box { background: var(--glass); border: 1px solid var(--glass-border); padding: 40px; border-radius: 30px; text-align: center; width: 100%; }
        .google-btn { background: #fff; color: #000; border: none; padding: 15px; border-radius: 30px; width: 100%; font-weight: 800; cursor: pointer; }

        #postModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 2000; display: none; padding: 15px; }
    </style>
</head>
<body>

<header><h1>KLYON</h1></header>

<div id="loginSection">
    <div class="login-box">
        <h2 style="font-family:'Orbitron'; color: var(--primary);">KLYON ELITE</h2>
        <p style="color:#8b8b9a; margin-bottom: 30px;">A rede social da nova era.</p>
        <button class="google-btn" id="loginBtn">Entrar com Google</button>
    </div>
</div>

<div id="feedSection" class="section container">
    <div id="feed"></div>
</div>

<div id="searchSection" class="section container">
    <div style="padding: 15px;">
        <input type="text" id="searchInput" placeholder="Buscar no Klyon..." 
               style="width:100%; padding:15px; border-radius:25px; background:var(--glass); border:1px solid var(--glass-border); color:#fff; outline:none;">
    </div>
    <div id="userList"></div>
</div>

<div id="profileSection" class="section container">
    <div class="profile-banner"></div>
    <div class="profile-info-container">
        <div class="profile-actions-row">
            <button class="edit-profile-btn" id="logoutBtn">Sair da conta</button>
        </div>
        <img id="displayPic" src="" class="profile-avatar-big">
        <div class="profile-names">
            <h2 id="displayName">Carregando...</h2>
            <span>@elite_member</span>
        </div>
        <p id="displayBio" style="margin-top: 10px; font-size: 0.95rem;">Explorando as fronteiras do Klyon Social.</p>
        <div class="profile-stats">
            <div><b id="friendCount">0</b> <span>Amigos</span></div>
            <div><b>2026</b> <span>Desde</span></div>
        </div>
    </div>
    <div class="profile-tabs">
        <div class="tab active">Posts</div>
        <div class="tab">Curtidas</div>
    </div>
    <div id="myPostsFeed"></div>
</div>

<div id="postModal">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <button onclick="toggleModal()" style="background:none; border:none; color:#fff; font-size:1rem;">Cancelar</button>
        <button id="postBtn" style="background:var(--primary); border:none; padding:8px 20px; border-radius:20px; font-weight:800;">Postar</button>
    </div>
    <textarea id="postInput" placeholder="O que está acontecendo?" 
              style="width:100%; height:200px; background:transparent; border:none; color:#fff; font-size:1.2rem; outline:none; margin-top:20px; resize:none;"></textarea>
</div>

<button id="fab" onclick="toggleModal()" style="display:none;">+</button>

<nav class="bottom-nav" id="bottomNav" style="display:none;">
    <div class="nav-item active" onclick="showSection('feedSection', this)"><i>🏠</i>Home</div>
    <div class="nav-item" onclick="showSection('searchSection', this)"><i>🔍</i>Buscar</div>
    <div class="nav-item" onclick="showSection('profileSection', this)"><i>👤</i>Perfil</div>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, deleteDoc, updateDoc, increment, where } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334",
    authDomain: "klyon-a97ba.firebaseapp.com",
    projectId: "klyon-a97ba"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

// NAVEGAÇÃO E UI
window.toggleModal = () => {
    const m = document.getElementById('postModal');
    m.style.display = m.style.display === 'block' ? 'none' : 'block';
};

window.showSection = (id, el) => {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    el.classList.add('active');
    window.scrollTo(0, 0); // Reseta o scroll para o topo ao trocar de aba
};

onAuthStateChanged(auth, async (user) => {
    if (user) {
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("bottomNav").style.display = "flex";
        document.getElementById("fab").style.display = "block";
        showSection('feedSection', document.querySelector('.nav-item'));
        setupUser(user);
        loadFeed('feed'); // Feed Geral
        loadFeed('myPostsFeed', user.uid); // Feed do Perfil
    } else {
        document.getElementById("loginSection").style.display = "flex";
        document.getElementById("bottomNav").style.display = "none";
        document.getElementById("fab").style.display = "none";
    }
});

async function setupUser(user) {
    const userRef = doc(db, "users", user.uid);
    const snap = await getDoc(userRef);
    if(!snap.exists()) await setDoc(userRef, { name: user.displayName, photo: user.photoURL, friends: 0 });
    
    document.getElementById("displayName").innerText = user.displayName;
    document.getElementById("displayPic").src = user.photoURL;
    updateFriendCount();
}

// FEED DINÂMICO (PROFISSIONAL)
function loadFeed(containerId, filterUid = null) {
    let q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
    if(filterUid) q = query(collection(db, "posts"), where("uid", "==", filterUid), orderBy("createdAt", "desc"));

    onSnapshot(q, (snap) => {
        const container = document.getElementById(containerId);
        container.innerHTML = "";
        snap.forEach(docSnap => {
            const p = docSnap.data();
            const id = docSnap.id;
            const hasLiked = p.likedBy?.includes(auth.currentUser.uid);

            const postEl = document.createElement('div');
            postEl.className = 'post';
            postEl.innerHTML = `
                <img src="${p.userPhoto}" class="post-avatar">
                <div class="post-main">
                    <div class="post-user-info">
                        <b>${p.userName}</b>
                        <span style="color:#8b8b9a; font-size:0.8rem;">· 2026</span>
                    </div>
                    <div class="post-text">${p.text}</div>
                    <div style="display:flex; gap:40px;">
                        <div class="fire-action ${hasLiked ? 'active' : ''}" onclick="likePost('${id}')">
                            <i>🔥</i> <span>${p.likes || 0}</span>
                        </div>
                        <div style="color:#8b8b9a; cursor:pointer;" onclick="toggleComments('${id}')">💬</div>
                    </div>
                    <div id="comments-${id}" style="display:none; margin-top:15px; border-left: 2px solid var(--glass-border); padding-left: 10px;">
                        <div id="list-${id}"></div>
                        <input id="in-${id}" placeholder="Postar resposta" style="background:none; border:none; color:#fff; width:100%; margin-top:10px;">
                        <button onclick="sendComment('${id}')" style="display:none"></button>
                    </div>
                </div>
            `;
            container.appendChild(postEl);
            loadComments(id);
        });
    });
}

// ACOES DE POST
window.likePost = async (id) => {
    const ref = doc(db, "posts", id);
    const snap = await getDoc(ref);
    const likedBy = snap.data().likedBy || [];
    const myUid = auth.currentUser.uid;

    if(likedBy.includes(myUid)) {
        await updateDoc(ref, { likes: increment(-1), likedBy: likedBy.filter(u => u !== myUid) });
    } else {
        await updateDoc(ref, { likes: increment(1), likedBy: [...likedBy, myUid] });
    }
};

document.getElementById("postBtn").onclick = async () => {
    const text = document.getElementById("postInput").value;
    if(!text.trim()) return;
    await addDoc(collection(db, "posts"), {
        uid: auth.currentUser.uid,
        text,
        userName: auth.currentUser.displayName,
        userPhoto: auth.currentUser.photoURL,
        likes: 0,
        likedBy: [],
        createdAt: serverTimestamp()
    });
    document.getElementById("postInput").value = "";
    toggleModal();
};

// SISTEMA DE COMENTÁRIOS
window.toggleComments = (id) => {
    const c = document.getElementById(`comments-${id}`);
    c.style.display = c.style.display === 'none' ? 'block' : 'none';
};

window.sendComment = async (postId) => {
    const input = document.getElementById(`in-${postId}`);
    if(!input.value.trim()) return;
    await addDoc(collection(db, "posts", postId, "comments"), {
        text: input.value,
        userName: auth.currentUser.displayName,
        createdAt: serverTimestamp()
    });
    input.value = "";
};

function loadComments(postId) {
    onSnapshot(query(collection(db, "posts", postId, "comments"), orderBy("createdAt", "asc")), (snap) => {
        const list = document.getElementById(`list-${postId}`);
        if(!list) return;
        list.innerHTML = "";
        snap.forEach(c => {
            list.innerHTML += `<div style="font-size:0.9rem; margin-bottom:5px;"><b style="color:var(--primary)">${c.data().userName}</b> ${c.data().text}</div>`;
        });
    });
}

async function updateFriendCount() {
    const userSnap = await getDoc(doc(db, "users", auth.currentUser.uid));
    if(userSnap.exists()) document.getElementById("friendCount").innerText = userSnap.data().friends || 0;
}

document.getElementById("loginBtn").onclick = () => signInWithPopup(auth, provider);
document.getElementById("logoutBtn").onclick = () => signOut(auth);

</script>
</body>
</html>
