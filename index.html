<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLYON | Elite Social</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --bg: #030307; --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); --text-dim: #94a3b8; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at 50% 0%, #0f172a 0%, #030307 100%); min-height: 100vh; overflow-x: hidden; }
        
        header { position: fixed; top: 0; width: 100%; height: 65px; background: rgba(3,3,7,0.85); backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 1000; }
        .logo { font-family: 'Orbitron'; color: var(--primary); letter-spacing: 3px; font-size: 1.2rem; }
        
        .container { max-width: 550px; margin: auto; padding: 80px 15px 120px; }
        
        /* Posts */
        .post { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px; padding: 18px; margin-bottom: 16px; transition: 0.3s; }
        .post-head { display: flex; gap: 12px; align-items: center; cursor: pointer; margin-bottom: 12px; }
        .post-head img { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--primary); object-fit: cover; }
        .post-content { font-size: 0.95rem; line-height: 1.5; color: #e2e8f0; margin-bottom: 10px; }
        
        .post-footer { display: flex; gap: 20px; border-top: 1px solid var(--glass-border); padding-top: 12px; }
        .btn-action { background: none; border: none; color: var(--text-dim); cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 6px; font-size: 0.85rem; }
        .btn-action.liked { color: #ff2d55; }

        /* Area de Comentários */
        .comment-section { margin-top: 15px; padding-top: 10px; border-top: 1px dotted var(--glass-border); display: none; }
        .comment-item { font-size: 0.85rem; background: rgba(255,255,255,0.03); padding: 8px 12px; border-radius: 12px; margin-bottom: 8px; border-left: 2px solid var(--primary); }
        .comment-input-group { display: flex; gap: 8px; margin-top: 10px; }
        .comment-input { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 10px; color: #fff; padding: 8px; font-size: 0.85rem; }
        
        /* Modal Postagem */
        #postModal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal-card { background: #0f172a; width: 90%; max-width: 500px; padding: 25px; border-radius: 24px; border: 1px solid var(--primary); }
        textarea { width: 100%; height: 120px; background: transparent; border: none; color: #fff; font-size: 1.1rem; resize: none; margin: 15px 0; }

        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; height: 65px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px); border-radius: 25px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-around; z-index: 1000; }
        .nav-link img { width: 24px; filter: invert(1); opacity: 0.4; }
        .nav-link.active img { opacity: 1; filter: drop-shadow(0 0 5px var(--primary)) invert(1); }
        
        #fab { position: fixed; bottom: 100px; right: 25px; width: 60px; height: 60px; background: var(--primary); border-radius: 20px; border: none; font-size: 30px; cursor: pointer; box-shadow: 0 0 20px rgba(0, 242, 255, 0.4); z-index: 999; }
        
        #badge { position: absolute; top: -2px; right: -2px; width: 10px; height: 10px; background: #ff2d55; border-radius: 50%; display: none; border: 2px solid #000; }
    </style>
</head>
<body>

<div id="postModal">
    <div class="modal-card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-family:'Orbitron'; color:var(--primary)">NOVA PUBLICAÇÃO</span>
            <button onclick="closeModal()" style="background:none; border:none; color:#fff; font-size:1.5rem; cursor:pointer;">✕</button>
        </div>
        <textarea id="postContent" placeholder="O que está acontecendo?"></textarea>
        <button onclick="sendPost()" style="width:100%; background:var(--primary); border:none; padding:12px; border-radius:12px; font-weight:800; font-family:'Orbitron'; cursor:pointer;">PUBLICAR</button>
    </div>
</div>

<header>
    <div class="logo">KLYON</div>
    <div onclick="location.href='notificacoes.html'" style="cursor:pointer; position:relative; font-size:1.4rem;">
        🔔<span id="badge"></span>
    </div>
</header>

<main class="container" id="feed"></main>

<button id="fab" onclick="openModal()">+</button>

<nav class="bottom-nav">
    <a href="index.html" class="nav-link active"><img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png"></a>
    <a href="buscar.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/149/149852.png"></a>
    <a href="perfil.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png"></a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, collection, query, onSnapshot, doc, addDoc, updateDoc, arrayUnion, arrayRemove, serverTimestamp, setDoc, where } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", authDomain: "klyon-a97ba.firebaseapp.com", projectId: "klyon-a97ba", storageBucket: "klyon-a97ba.appspot.com" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async user => {
        if (user) {
            await setDoc(doc(db, "users", user.uid), { 
                name: user.displayName, photo: user.photoURL, handle: user.email.split('@')[0] 
            }, { merge: true });
            loadFeed();
            checkNotifs(user.uid);
        } else {
            signInWithPopup(auth, new GoogleAuthProvider());
        }
    });

    function loadFeed() {
        onSnapshot(collection(db, "posts"), s => {
            const f = document.getElementById('feed'); f.innerHTML = "";
            let posts = [];
            s.forEach(d => posts.push({id: d.id, ...d.data()}));
            posts.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

            posts.forEach(p => {
                const isLiked = p.likes?.includes(auth.currentUser.uid);
                const postDiv = document.createElement('div');
                postDiv.className = 'post';
                postDiv.innerHTML = `
                    <div class="post-head" onclick="location.href='perfil.html?uid=${p.uid}'">
                        <img src="${p.authorPhoto}">
                        <div><b>${p.authorName}</b><br><small style="color:var(--primary)">@${p.authorHandle}</small></div>
                    </div>
                    <div class="post-content">${p.content}</div>
                    <div class="post-footer">
                        <button class="btn-action ${isLiked ? 'liked' : ''}" onclick="toggleLike('${p.id}', '${p.uid}', ${isLiked})">🔥 ${p.likes?.length || 0}</button>
                        <button class="btn-action" onclick="toggleComments('${p.id}')">💬 ${p.comments?.length || 0}</button>
                    </div>
                    <div id="comments-${p.id}" class="comment-section">
                        <div id="list-${p.id}">
                            ${(p.comments || []).map(c => `<div class="comment-item"><b>${c.user}:</b> ${c.text}</div>`).join('')}
                        </div>
                        <div class="comment-input-group">
                            <input type="text" id="input-${p.id}" class="comment-input" placeholder="Escreva um comentário...">
                            <button onclick="sendComment('${p.id}', '${p.uid}')" style="background:var(--primary); border:none; border-radius:8px; padding:0 12px; cursor:pointer;">➡</button>
                        </div>
                    </div>`;
                f.appendChild(postDiv);
            });
        });
    }

    // Funções Globais
    window.openModal = () => document.getElementById('postModal').style.display = 'flex';
    window.closeModal = () => document.getElementById('postModal').style.display = 'none';

    window.sendPost = async () => {
        const val = document.getElementById('postContent').value;
        if(!val.trim()) return;
        await addDoc(collection(db, "posts"), {
            uid: auth.currentUser.uid, authorName: auth.currentUser.displayName,
            authorPhoto: auth.currentUser.photoURL, authorHandle: auth.currentUser.email.split('@')[0],
            content: val, createdAt: serverTimestamp(), likes: [], comments: []
        });
        document.getElementById('postContent').value = '';
        closeModal();
    };

    window.toggleLike = async (id, authorId, isLiked) => {
        const ref = doc(db, "posts", id);
        await updateDoc(ref, { likes: isLiked ? arrayRemove(auth.currentUser.uid) : arrayUnion(auth.currentUser.uid) });
        if(!isLiked && auth.currentUser.uid !== authorId) {
            notify(authorId, `@${auth.currentUser.email.split('@')[0]} curtiu seu post!`);
        }
    };

    window.toggleComments = (id) => {
        const el = document.getElementById(`comments-${id}`);
        el.style.display = el.style.display === 'block' ? 'none' : 'block';
    };

    window.sendComment = async (id, authorId) => {
        const input = document.getElementById(`input-${id}`);
        if(!input.value.trim()) return;
        
        await updateDoc(doc(db, "posts", id), {
            comments: arrayUnion({
                user: auth.currentUser.displayName,
                text: input.value,
                createdAt: new Date().toISOString()
            })
        });

        if(auth.currentUser.uid !== authorId) {
            notify(authorId, `@${auth.currentUser.email.split('@')[0]} comentou no seu post!`);
        }
        input.value = "";
    };

    async function notify(to, text) {
        await addDoc(collection(db, "notifications"), {
            to, text, read: false, createdAt: serverTimestamp()
        });
    }

    function checkNotifs(uid) {
        onSnapshot(query(collection(db, "notifications"), where("to", "==", uid), where("read", "==", false)), s => {
            document.getElementById('badge').style.display = s.empty ? "none" : "block";
        });
    }
</script>
</body>
</html>
