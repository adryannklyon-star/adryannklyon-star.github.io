<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Klyon - Void Feed</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        /* CORE VOID MINIMALISTA - Cores das fotos de referência */
        :root { 
            --bg: #000; /* Fundo preto puro */
            --border: #111; /* Divisórias muito sutis */
            --accent: #00f2ff; /* Azul ciano sutil */
            --dim: #555; /* Texto escuro para handle e meta, bem discreto */
            --text: #eee; /* Texto principal do post, não puro branco */
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; background: var(--bg); color: var(--text); 
            font-family: 'Inter', sans-serif; padding-bottom: 80px; 
            letter-spacing: -0.2px; /* Tipografia limpa e condensada */
        }
        
        /* HEADER - Removendo brilho excessivo */
        header { 
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--border); position: sticky; top: 0; 
            background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); z-index: 100; 
        }
        .logo { 
            font-family: 'Orbitron'; color: var(--accent); font-size: 20px; 
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.4); /* Brilho mais fraco */
            position: absolute; left: 50%; transform: translateX(-50%); 
        }
        
        /* Menu hambúrguer sutil */
        .menu-btn { background: transparent; border: none; cursor: pointer; padding: 5px; display: flex; flex-direction: column; gap: 4px; }
        .menu-btn div { width: 18px; height: 1.5px; background: var(--dim); border-radius: 1px; transition: 0.3s; }
        .menu-btn:hover div { background: #fff; }

        /* FEED - Removendo 'backgrounds', apenas linhas sutis */
        #feed { max-width: 550px; margin: auto; }
        .post { padding: 25px 20px; border-bottom: 1px solid var(--border); animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Tipografia de autor e handle discreta */
        .post-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; }
        .post-name { font-weight: 600; color: #fff; }
        .post-handle { color: var(--dim); font-weight: 300; }
        
        /* Conteúdo do post limpo */
        .post-content { font-size: 15px; line-height: 1.6; font-weight: 300; color: var(--text); white-space: pre-wrap; }
        
        /* Ações sutilíssimas em cinza escuro */
        .post-actions { display: flex; gap: 25px; margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.02); padding-top: 12px; }
        .action { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); cursor: pointer; transition: 0.2s; }
        .action svg { width: 16px; stroke: var(--dim); fill: none; stroke-width: 1.5; }
        .action:hover { color: var(--accent); }
        .action:hover svg { stroke: var(--accent); }

        /* FAB - Pílula minimalista preta/branca */
        .fab { position: fixed; bottom: 85px; right: 20px; padding: 12px 20px; background: #fff; color: #000; border-radius: 30px; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; cursor: pointer; z-index: 999; box-shadow: 0 4px 15px rgba(255,255,255,0.15); transition: 0.2s; }
        .fab svg { width: 18px; stroke: #000; stroke-width: 2.5; fill: none; }
        .fab:hover { opacity: 0.9; }

        /* MODAL E TEXTAREA - Removendo visual neon vibrante */
        #actionModal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .modal-card { background: #080808; width: 90%; max-width: 420px; padding: 25px; border-radius: 20px; border: 1px solid #222; }
        textarea { width: 100%; height: 140px; background: #111; border: 1px solid #222; border-radius: 12px; color: #fff; padding: 12px; resize: none; font-family: inherit; margin-top: 15px; outline: none; font-size: 15px; font-weight: 300; }
        textarea:focus { border-color: var(--dim); }
        .btn-send { width: 100%; background: #fff; color: #000; border: none; padding: 14px; border-radius: 30px; font-weight: 600; font-size: 14px; margin-top: 20px; cursor: pointer; transition: 0.2s; }
        .btn-send:hover { opacity: 0.9; }

        /* NAV INFERIOR - Cores escuras e ícones minimalistas */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: rgba(0,0,0,0.95); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-around; z-index: 1000; }
        .nav-link svg { width: 22px; stroke: var(--dim); fill: none; stroke-width: 1.5; transition: 0.3s; }
        .nav-link.active svg { stroke: #fff; }
    </style>
</head>
<body>

<header>
    <div style="width: 30px;"></div>
    <div class="logo">K</div>
    <button class="menu-btn" onclick="location.href='configuracoes.html'">
        <div></div>
        <div></div>
        <div></div>
    </button>
</header>

<main id="feed"></main>

<div class="fab" id="fabBtn">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    Transmitir
</div>

<div id="actionModal">
    <div class="modal-card">
        <h2 style="font-size:11px; letter-spacing:2.5px; color:var(--dim); margin:0; text-transform: uppercase;">A VOID TE OUVE</h2>
        <textarea id="postInput" placeholder="Sua mensagem para o vazio..."></textarea>
        <button class="btn-send" id="sendBtn">ENVIAR</button>
        <button onclick="closeModal()" style="width:100%; background:transparent; color:#555; border:none; margin-top:12px; cursor:pointer; font-size:12px;">DESCARTAR</button>
    </div>
</div>
