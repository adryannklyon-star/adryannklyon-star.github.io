<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLYON | Elite Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #00f2ff; 
            --primary-glow: rgba(0, 242, 255, 0.3);
            --bg: #030307; 
            --glass: rgba(255, 255, 255, 0.03); 
            --glass-border: rgba(255, 255, 255, 0.08); 
            --text-dim: #64748b; 
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: #fff; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: radial-gradient(circle at 50% -20%, #1e293b 0%, #030307 80%);
            min-height: 100vh; padding-bottom: 110px;
            overflow-x: hidden;
        }

        header { 
            position: fixed; top: 0; width: 100%; height: 70px; 
            background: rgba(3,3,7,0.7); backdrop-filter: blur(20px); 
            border-bottom: 1px solid var(--glass-border); 
            display: flex; align-items: center; justify-content: center; z-index: 1000; 
        }
        .logo { font-family: 'Orbitron'; color: var(--primary); letter-spacing: 8px; font-size: 1.2rem; text-shadow: 0 0 15px var(--primary-glow); }

        .container { max-width: 500px; margin: auto; padding-top: 90px; }

        .post { 
            background: var(--glass); border: 1px solid var(--glass-border); 
            border-radius: 28px; padding: 20px; margin: 0 15px 20px 15px; 
            animation: fadeIn 0.4s ease;
        }
        .post-head { display: flex; gap: 14px; align-items: center; margin-bottom: 15px; }
        .post-head img { width: 48px; height: 48px; border-radius: 16px; border: 1.5px solid var(--glass-border); object-fit: cover; }
        .post-head b { font-size: 1rem; color: #f8fafc; }
        .post-head small { color: var(--primary); font-family: 'Orbitron'; font-size: 0.7rem; opacity: 0.8; }

        .post-content { font-size: 0.98rem; line-height: 1.6; color: #cbd5e1; margin-bottom: 15px; white-space: pre-wrap; word-break: break-word; }
        .post-img { width: 100%; border-radius: 20px; border: 1px solid var(--glass-border); margin-bottom: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }

        .post-actions { display: flex; gap: 25px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.05); }
        .action-btn { 
            background: none; border: none; color: var(--text-dim); 
            font-size: 0.85rem; display: flex; align-items: center; gap: 8px; 
            cursor: pointer; font-family: 'Orbitron'; transition: 0.3s;
        }
        .action-btn.active { color: #ff4d00; text-shadow: 0 0 10px rgba(255, 77, 0, 0.4); }

        #fab { 
            position: fixed; bottom: 105px; right: 25px; 
            width: 60px; height: 60px; background: var(--primary); 
            border-radius: 22px; border: none; font-size: 30px; 
            cursor: pointer; z-index: 999; color: #000;
            box-shadow: 0 8px 25px var(--primary-glow); 
        }

        #postModal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 4000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        .modal-card { background: #0f172a; width: 92%; max-width: 450px; padding: 30px; border-radius: 32px; border: 1px solid var(--glass-border); }
        textarea { 
            width: 100%; height: 140px; background: rgba(255,255,255,0.03); 
            border: 1px solid var(--glass-border); border-radius: 20px; 
            color: #fff; font-size: 1.1rem; padding: 18px; resize: none; margin-bottom: 15px;
        }
        #imagePreview { width: 100%; max-height: 150px; object-fit: cover; border-radius: 15px; display: none; margin-bottom: 15px; border: 1px solid var(--primary); }

        .bottom-nav { 
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); 
            width: 90%; max-width: 400px; height: 75px; 
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(25px); 
            border-radius: 35px; border: 1px solid var(--glass-border); 
            display: flex; align-items: center; justify-content: space-around; z-index: 1000;
        }
        .nav-link img { width: 24px; opacity: 0.3; filter: invert(1); transition: 0.4s; }
        .nav-link.active img { opacity: 1; filter: drop-shadow(0 0 8px var(--primary)) invert(1); }
        .notif-badge { position: absolute; top: 12px; right: 12px; width: 8px; height: 8px; background: #ff2d55; border-radius: 50%; display: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header><div class="logo">KLYON</div></header>

<div id="postModal">
    <div class="modal-card">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <span style="font-family:'Orbitron'; color:var(--primary); font-size:0.8rem;">NEW BROADCAST</span>
            <button onclick="closeModal()" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;">&times;</button>
        </div>
        <textarea id="postContent" placeholder="O que está em sua mente?"></textarea>
        <img id="imagePreview">
        <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="previewImage(this)">
        <div style="display:grid; grid-template-columns: 1fr 2fr; gap: 10px;">
            <button onclick="document.getElementById('fileInput').click()" style="background:var(--glass); border:1px solid var(--glass-border); color:white; padding:15px; border-radius:18px; cursor:pointer;">🖼️</button>
            <button id="sendBtn" onclick="sendPost()" style="background:var(--primary); border:none; padding:15px; border-radius:18px; font-weight:800; font-family:'Orbitron'; color:#000; cursor:pointer;">TRANSMITIR</button>
        </div>
    </div>
</div>

<main class="container" id="feed"></main>
<button id="fab" onclick="openModal()">+</button>

<nav class="bottom-nav">
    <a href="index.html" class="nav-link active"><img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png"></a>
    <a href="buscar.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/149/149852.png"></a>
    <a href="notificacoes.html" class="nav-link">
        <img src="https://cdn-icons-png.flaticon.com/512/3602/3602145.png">
        <div id="notifBadge" class="notif-badge"></div>
    </a>
    <a href="perfil.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png"></a>
    <a href="configuracoes.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/2040/2040504.png"></a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, doc, getDoc, updateDoc, arrayUnion, arrayRemove, addDoc, serverTimestamp, query, orderBy, limit, where } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-storage.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", 
        authDomain: "klyon-a97ba.firebaseapp.com", 
        projectId: "klyon-a97ba", 
        storageBucket: "klyon-a97ba.appspot.com" 
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    let currentEliteUser = null;
    let activePostId = null; // Para saber em qual post estamos comentando

    onAuthStateChanged(auth, async user => {
        if (!user) return window.location.href = "login.html";
        const snap = await getDoc(doc(db, "users", user.uid));
        if(snap.exists()) {
            currentEliteUser = snap.data();
            loadFeed();
            listenNotifs(user.uid);
        }
    });

    function loadFeed() {
        const q = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(40));
        onSnapshot(q, snapshot => {
            const feed = document.getElementById('feed');
            feed.innerHTML = "";
            snapshot.forEach(docSnap => {
                const p = {id: docSnap.id, ...docSnap.data()};
                const isLiked = p.likes?.includes(auth.currentUser.uid);
                feed.innerHTML += `
                    <div class="post">
                        <div class="post-head" onclick="location.href='perfil.html?uid=${p.uid}'">
                            <img src="${p.authorPhoto || ''}">
                            <div><b>${p.authorName}</b><br><small>@${p.authorHandle}</small></div>
                        </div>
                        <div class="post-content">${p.content}</div>
                        ${p.image ? `<img src="${p.image}" class="post-img">` : ''}
                        <div class="post-actions">
                            <button class="action-btn ${isLiked ? 'active' : ''}" onclick="toggleLike('${p.id}', ${isLiked})">
                                🔥 ${p.likes?.length || 0}
                            </button>
                            <button class="action-btn" onclick="openCommentModal('${p.id}')">💬 ${p.comments?.length || 0}</button>
                            <button class="action-btn" onclick="repost('${p.id}')">🔄</button>
                        </div>
                    </div>`;
            });
        });
    }

    // --- LOGICA DE POSTAR ---
    window.sendPost = async () => {
        const txt = document.getElementById('postContent').value;
        const file = document.getElementById('fileInput').files[0];
        if (!txt.trim() && !file) return;

        try {
            let url = null;
            if(file) {
                const sRef = ref(storage, `posts/${Date.now()}`);
                await uploadBytes(sRef, file);
                url = await getDownloadURL(sRef);
            }
            await addDoc(collection(db, "posts"), {
                uid: auth.currentUser.uid,
                authorName: currentEliteUser.name,
                authorHandle: currentEliteUser.handle,
                authorPhoto: currentEliteUser.photo,
                content: txt,
                image: url,
                likes: [],
                comments: [],
                createdAt: serverTimestamp()
            });
            closeModal();
        } catch (e) { alert("Erro ao transmitir."); }
    };

    // --- NOVO SISTEMA DE COMENTÁRIOS (BONITO) ---
    window.openCommentModal = (postId) => {
        activePostId = postId;
        const msg = prompt("Sua resposta para a Elite:"); // Temporário até você criar o HTML do modal de comentário, mas com a lógica abaixo ele salva certo.
        if (msg) window.confirmComment(msg);
    };

    window.confirmComment = async (msg) => {
        if (!msg.trim()) return;
        try {
            await updateDoc(doc(db, "posts", activePostId), { 
                comments: arrayUnion({ 
                    name: currentEliteUser.name, 
                    text: msg, 
                    uid: auth.currentUser.uid,
                    handle: currentEliteUser.handle 
                }) 
            });
        } catch (e) { console.error(e); }
    };

    // --- REPOST CORRIGIDO ---
    window.repost = async (id) => {
        if(!confirm("Repassar esta mensagem na sua timeline?")) return;
        try {
            const snap = await getDoc(doc(db, "posts", id));
            if(!snap.exists()) return;
            const data = snap.data();
            
            await addDoc(collection(db, "posts"), {
                uid: auth.currentUser.uid,
                authorName: currentEliteUser.name,
                authorHandle: currentEliteUser.handle,
                authorPhoto: currentEliteUser.photo,
                content: `🔄 Repostado de @${data.authorHandle}:\n${data.content}`,
                image: data.image || null,
                createdAt: serverTimestamp(),
                likes: [],
                comments: []
            });
            alert("Repostado!");
        } catch (e) { 
            console.error(e);
            alert("Erro ao repostar. Verifique se as Regras do Firestore permitem escrita."); 
        }
    };

    window.toggleLike = async (id, isLiked) => {
        const pRef = doc(db, "posts", id);
        await updateDoc(pRef, { likes: isLiked ? arrayRemove(auth.currentUser.uid) : arrayUnion(auth.currentUser.uid) });
    };

    function listenNotifs(uid) {
        onSnapshot(query(collection(db, "notifications"), where("to", "==", uid), where("read", "==", false)), s => {
            document.getElementById('notifBadge').style.display = s.empty ? "none" : "block";
        });
    }

    window.openModal = () => document.getElementById('postModal').style.display = 'flex';
    window.closeModal = () => document.getElementById('postModal').style.display = 'none';
</script>
</body>
</html>
