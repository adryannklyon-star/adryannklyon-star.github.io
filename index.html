<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLYON</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --bg: #030307; --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); --text-dim: #94a3b8; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at 50% 0%, #0f172a 0%, #030307 100%); min-height: 100vh; padding-bottom: 100px; }
        
        header { position: fixed; top: 0; width: 100%; height: 60px; background: rgba(3,3,7,0.8); backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .logo { font-family: 'Orbitron'; color: var(--primary); letter-spacing: 5px; font-size: 1.1rem; text-shadow: 0 0 10px rgba(0, 242, 255, 0.5); }
        
        .container { max-width: 550px; margin: auto; padding-top: 75px; }

        /* Posts Estilo Twitter Glass */
        .post { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px; padding: 18px; margin: 15px; animation: fadeIn 0.4s ease; }
        .post-head { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; cursor: pointer; }
        .post-head img { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--primary); object-fit: cover; }
        .post-content { font-size: 0.95rem; line-height: 1.5; color: #e2e8f0; margin-bottom: 10px; }
        .post-img { width: 100%; border-radius: 15px; border: 1px solid var(--glass-border); margin-bottom: 10px; }

        .post-actions { display: flex; gap: 20px; border-top: 1px solid var(--glass-border); padding-top: 12px; }
        .action-btn { background: none; border: none; color: var(--text-dim); font-size: 0.85rem; display: flex; align-items: center; gap: 6px; cursor: pointer; font-family: 'Orbitron'; }
        .action-btn.active { color: var(--primary); text-shadow: 0 0 8px var(--primary); }

        /* FAB & Modal de Postagem */
        #fab { position: fixed; bottom: 105px; right: 25px; width: 55px; height: 55px; background: var(--primary); border-radius: 18px; border: none; font-size: 28px; cursor: pointer; z-index: 999; box-shadow: 0 5px 15px rgba(0, 242, 255, 0.3); }
        #postModal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 4000; display: none; align-items: center; justify-content: center; }
        .modal-card { background: #0f172a; width: 90%; max-width: 500px; padding: 25px; border-radius: 24px; border: 1px solid var(--primary); }
        textarea { width: 100%; height: 100px; background: transparent; border: none; color: #fff; font-size: 1.1rem; resize: none; margin: 15px 0; }

        /* Menu Inferior Original com o Sino */
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 450px; height: 70px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border-radius: 28px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-around; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .nav-link { position: relative; display: flex; flex-direction: column; align-items: center; text-decoration: none; }
        .nav-link img { width: 26px; filter: invert(1); opacity: 0.4; transition: 0.3s; }
        .nav-link.active img { opacity: 1; filter: drop-shadow(0 0 8px var(--primary)) invert(1); }
        
        /* Badge de Notificação no Sino (Menu Inferior) */
        .notif-badge { position: absolute; top: -2px; right: -2px; width: 10px; height: 10px; background: #ff2d55; border-radius: 50%; border: 2px solid #0f172a; display: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header><div class="logo">KLYON</div></header>

<div id="postModal">
    <div class="modal-card">
        <textarea id="postContent" placeholder="Transmita sua mensagem..."></textarea>
        <input type="file" id="fileInput" accept="image/*" style="display:none;">
        <button onclick="document.getElementById('fileInput').click()" style="background:var(--glass); border:1px solid var(--glass-border); color:white; padding:10px; border-radius:10px; width:100%; margin-bottom:10px; cursor:pointer;">🖼️ Selecionar Foto</button>
        <button id="sendBtn" onclick="sendPost()" style="width:100%; background:var(--primary); border:none; padding:15px; border-radius:15px; font-weight:800; font-family:'Orbitron';">POSTAR</button>
        <button onclick="closeModal()" style="width:100%; background:transparent; color:#ff2d55; border:none; margin-top:10px;">Cancelar</button>
    </div>
</div>

<main class="container" id="feed"></main>
<button id="fab" onclick="openModal()">+</button>

<style>
    .bottom-nav { 
        position: fixed; 
        bottom: 20px; 
        left: 50%; 
        transform: translateX(-50%); 
        width: 94%; 
        max-width: 480px; 
        height: 70px; 
        background: rgba(15, 23, 42, 0.9); 
        backdrop-filter: blur(20px); 
        border-radius: 28px; 
        border: 1px solid var(--glass-border); 
        display: flex; 
        align-items: center; 
        justify-content: space-around; 
        z-index: 1000; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    
    .nav-link { 
        position: relative; 
        display: flex; 
        align-items: center; 
        justify-content: center;
        width: 50px;
        height: 50px;
    }

    .nav-link img { 
        width: 24px; 
        height: 24px;
        filter: invert(1); 
        opacity: 0.4; 
        transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    }

    /* Efeito de brilho no ícone ativo */
    .nav-link.active img { 
        opacity: 1; 
        filter: drop-shadow(0 0 8px var(--primary)) invert(1); 
        transform: scale(1.1);
    }

    /* Badge de Notificação (Sino) */
    .notif-badge { 
        position: absolute; 
        top: 10px; 
        right: 10px; 
        width: 8px; 
        height: 8px; 
        background: #ff2d55; 
        border-radius: 50%; 
        border: 2px solid #0f172a; 
        display: none; 
    }
</style>

<nav class="bottom-nav">
    <a href="index.html" class="nav-link" id="nav-home">
        <img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png" alt="Home">
    </a>

    <a href="buscar.html" class="nav-link" id="nav-search">
        <img src="https://cdn-icons-png.flaticon.com/512/149/149852.png" alt="Buscar">
    </a>

    <a href="notificacoes.html" class="nav-link" id="nav-notif">
        <img src="https://cdn-icons-png.flaticon.com/512/3602/3602145.png" alt="Notificações">
        <div id="notifBadge" class="notif-badge"></div>
    </a>

    <a href="perfil.html" class="nav-link" id="nav-profile">
        <img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png" alt="Perfil">
    </a>

    <a href="configuracoes.html" class="nav-link" id="nav-settings">
        <img src="https://cdn-icons-png.flaticon.com/512/2040/2040504.png" alt="Configurações">
    </a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, doc, getDoc, updateDoc, arrayUnion, arrayRemove, addDoc, serverTimestamp, query, where, orderBy, limit } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-storage.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", 
        authDomain: "klyon-a97ba.firebaseapp.com", 
        projectId: "klyon-a97ba", 
        storageBucket: "klyon-a97ba.appspot.com" 
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    let currentEliteUser = null;

    onAuthStateChanged(auth, async user => {
        if (!user) return window.location.href = "login.html";
        const snap = await getDoc(doc(db, "users", user.uid));
        currentEliteUser = snap.data();
        loadFeed();
        listenNotifs(user.uid);
    });

    function loadFeed() {
        // limit(50) garante que o site seja leve para 55 mil usuários
        const q = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(50));
        onSnapshot(q, snapshot => {
            const feed = document.getElementById('feed'); feed.innerHTML = "";
            snapshot.forEach(docSnap => {
                const p = {id: docSnap.id, ...docSnap.data()};
                const isLiked = p.likes?.includes(auth.currentUser.uid);
                feed.innerHTML += `
                    <div class="post">
                        <div class="post-head" onclick="location.href='perfil.html?uid=${p.uid}'">
                            <img src="${p.authorPhoto || ''}">
                            <div><b>${p.authorName}</b><br><small style="color:var(--primary)">@${p.authorHandle}</small></div>
                        </div>
                        <div class="post-content">${p.content}</div>
                        ${p.image ? `<img src="${p.image}" class="post-img">` : ''}
                        <div class="post-actions">
                            <button class="action-btn ${isLiked ? 'active' : ''}" onclick="toggleLike('${p.id}', ${isLiked})">🔥 ${p.likes?.length || 0}</button>
                            <button class="action-btn" onclick="openComments('${p.id}')">💬 ${p.comments?.length || 0}</button>
                            <button class="action-btn" onclick="repost('${p.id}')">🔄</button>
                        </div>
                    </div>`;
            });
        });
    }

    // Função de postagem com Upload Real de Foto
    // POSTAR COM FOTO (Versão Blindada)
    window.sendPost = async () => {
        const text = document.getElementById('postContent').value;
        const fileInput = document.getElementById('fileInput');
        const file = fileInput.files[0];
        const btn = document.getElementById('sendBtn');

        if (!text.trim() && !file) return;

        btn.disabled = true; 
        btn.innerText = "ENVIANDO...";

        try {
            let imgUrl = null;
            
            // Upload da Imagem se existir
            if(file) {
                const storageRef = ref(storage, `posts/${Date.now()}_${auth.currentUser.uid}`);
                const snapshot = await uploadBytes(storageRef, file);
                imgUrl = await getDownloadURL(snapshot.ref);
            }

            // Criação do documento no Firestore
            await addDoc(collection(db, "posts"), {
                uid: auth.currentUser.uid,
                authorName: currentEliteUser.name,
                authorPhoto: currentEliteUser.photo,
                authorHandle: currentEliteUser.handle,
                content: text,
                image: imgUrl,
                createdAt: serverTimestamp(),
                likes: [],
                comments: []
            });

            // Limpeza e fechamento
            closeModal();
            document.getElementById('postContent').value = "";
            fileInput.value = "";
        } catch (error) {
            console.error("ERRO AO POSTAR:", error);
            alert("Erro ao postar. Verifique se o Storage está ativado no Firebase.");
        } finally {
            btn.disabled = false; 
            btn.innerText = "POSTAR";
        }
    };

    window.toggleLike = async (postId, isLiked) => {
        try {
            await updateDoc(doc(db, "posts", postId), {
                likes: isLiked ? arrayRemove(auth.currentUser.uid) : arrayUnion(auth.currentUser.uid)
            });
        } catch (e) { console.error("Erro no Like:", e); }
    };

    function listenNotifs(uid) {
        const q = query(collection(db, "notifications"), where("to", "==", uid), where("read", "==", false));
        onSnapshot(q, s => {
            const badge = document.getElementById('notifBadge');
            if(badge) badge.style.display = s.empty ? "none" : "block";
        });
    }

    window.openModal = () => {
        document.getElementById('postModal').style.display = 'flex';
        document.body.style.overflow = 'hidden'; // Trava o scroll da página atrás
    };

    window.closeModal = () => {
        document.getElementById('postModal').style.display = 'none';
        document.body.style.overflow = 'auto'; // Destrava o scroll
    };

</script>
</body>
</html>
