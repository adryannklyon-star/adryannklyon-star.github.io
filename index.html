<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLYON ELITE | V3</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2ff;
            --accent: #7000ff;
            --bg: #030307;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh; overflow-x: hidden;
        }

        /* HEADER */
        header {
            position: fixed; top: 0; width: 100%; z-index: 1001;
            background: rgba(3, 3, 7, 0.9); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border); display: none;
        }
        header.visible { display: block; }
        .header-top { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .header-tabs { display: flex; height: 45px; border-top: 1px solid var(--glass-border); }
        .tab { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 800; color: var(--text-dim); cursor: pointer; }
        .tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); }

        /* NOTIFICAÇÕES */
        #notifPanel { display:none; position:fixed; top:65px; right:15px; width:280px; background:rgba(10,10,20,0.98); border:1px solid var(--glass-border); border-radius:20px; z-index:2000; padding:15px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        .notif-item { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.8rem; }

        /* SECTIONS */
        .section { display: none; padding: 20px 0 110px 0; animation: fadeIn 0.3s ease; }
        .section.active { display: block; }
        #feedSection { padding-top: 110px; } 
        .container { max-width: 550px; margin: auto; padding: 0 15px; }

        /* POSTS */
        .post { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px; padding: 18px; margin-bottom: 16px; transition: 0.3s; }
        .post-head { display: flex; gap: 12px; margin-bottom: 12px; align-items: center; cursor: pointer; }
        .post-head img { width: 42px; height: 42px; border-radius: 12px; object-fit: cover; }
        .post-content { font-size: 0.95rem; line-height: 1.5; color: #e2e8f0; margin-bottom: 12px; }
        .post-img { width: 100%; border-radius: 15px; border: 1px solid var(--glass-border); margin-bottom: 10px; }

        .post-footer { display: flex; gap: 15px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; }
        .btn-social { background: none; border: none; color: var(--text-dim); font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .btn-social.liked { color: #ff2d55; }

        /* PERFIL */
        .p-card { text-align: center; padding-top: 40px; }
        .p-avatar { width: 100px; height: 100px; border-radius: 30px; border: 3px solid var(--primary); object-fit: cover; }
        .p-stats { display: flex; justify-content: center; gap: 30px; margin: 20px 0; cursor: pointer; }

        /* UI ELEMENTS */
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; height: 65px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(15px); border-radius: 25px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-around; z-index: 1000; }
        .nav-link img { width: 24px; filter: invert(1); opacity: 0.4; }
        .nav-link.active img { opacity: 1; filter: drop-shadow(0 0 5px var(--primary)); }
        
        .btn-elite { background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 800; cursor: pointer; }
        #fab { position: fixed; bottom: 100px; right: 20px; width: 55px; height: 55px; background: var(--primary); border-radius: 15px; border: none; font-size: 24px; font-weight: bold; z-index: 999; box-shadow: 0 5px 15px rgba(0, 242, 255, 0.4); }

        .hidden { display: none !important; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<header id="mainHeader">
    <div class="header-top">
        <h1 style="font-family:'Orbitron'; font-size:1.1rem; color:var(--primary); margin:0;">KLYON</h1>
        <div style="cursor:pointer; position: relative;" onclick="toggleNotifs()">
            🔔<div id="notifBadge" style="position:absolute; top:-2px; right:-2px; width:8px; height:8px; background:red; border-radius:50%; display:none;"></div>
        </div>
    </div>
    <div class="header-tabs">
        <div class="tab active" onclick="switchFeed('all', this)">EXPLORAR</div>
        <div class="tab" onclick="switchFeed('friends', this)">CONEXÕES</div>
    </div>
</header>

<div id="notifPanel">
    <small style="color:var(--primary); font-weight:800;">ATIVIDADE</small>
    <div id="notifList" style="margin-top:10px;"></div>
</div>

<div id="loginSection" style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;">
    <h1 style="font-family:'Orbitron'; color:var(--primary); font-size:3rem;">K</h1>
    <button onclick="login()" class="btn-elite">ACESSAR ELITE</button>
</div>

<div id="feedSection" class="section">
    <div class="container" id="mainFeed"></div>
</div>

<div id="searchSection" class="section">
    <div class="container">
        <input type="text" id="userSearch" oninput="searchUsers()" placeholder="Pesquisar por handle..." style="width:100%; padding:15px; border-radius:15px; background:var(--glass); border:1px solid var(--glass-border); color:#fff;">
        <div id="searchResults" style="margin-top:20px;"></div>
    </div>
</div>

<div id="profileSection" class="section">
    <div class="container p-card">
        <img id="p-photo" src="" class="p-avatar">
        <h2 id="p-name" style="margin:10px 0 0;"></h2>
        <p style="color:var(--primary); font-weight:800; margin-top:5px;">@<span id="p-handle"></span></p>
        
        <div class="p-stats">
            <div><b id="p-count-posts">0</b><br><small>Posts</small></div>
            <div onclick="showConnections()"><b id="p-count-friends">0</b><br><small>Conexões</small></div>
        </div>

        <button id="p-btn-follow" class="btn-elite hidden" style="width:100%" onclick="toggleFollow()">CONECTAR</button>
        
        <div id="p-posts" style="text-align:left; margin-top:30px;"></div>
    </div>
</div>

<button id="fab" class="hidden" onclick="openPostModal()">+</button>

<div id="postModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); z-index:5000; padding:20px;">
    <div class="container">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <span onclick="closePostModal()" style="cursor:pointer;">Cancelar</span>
            <button id="pubBtn" class="btn-elite" onclick="publishPost()">PUBLICAR</button>
        </div>
        <textarea id="postText" style="width:100%; height:150px; background:none; border:none; color:#fff; font-size:1.2rem;" placeholder="O que há de novo na elite?"></textarea>
        <img id="postPreview" style="display:none; width:100%; border-radius:15px; margin-top:10px;">
        <button class="btn-elite" style="background:var(--glass); color:#fff; margin-top:10px;" onclick="document.getElementById('fileIn').click()">📸 Adicionar Foto</button>
        <input type="file" id="fileIn" class="hidden" accept="image/*" onchange="previewFile(this)">
    </div>
</div>

<nav id="navBar" class="bottom-nav hidden">
    <div class="nav-link active" onclick="navigate('feedSection', this)"><img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png"></div>
    <div class="nav-link" onclick="navigate('searchSection', this)"><img src="https://cdn-icons-png.flaticon.com/512/149/149852.png"></div>
    <div class="nav-link" onclick="navigate('profileSection', this)"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png"></div>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, updateDoc, increment, where, arrayUnion, arrayRemove, getDocs, limit } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-storage.js";

const firebaseConfig = {
    apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334",
    authDomain: "klyon-a97ba.firebaseapp.com",
    projectId: "klyon-a97ba",
    storageBucket: "klyon-a97ba.appspot.com"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);
const provider = new GoogleAuthProvider();

let uData = null;
let activeProfileId = null;
let postFile = null;

// --- AUTH ---
window.login = () => signInWithPopup(auth, provider);

onAuthStateChanged(auth, async (user) => {
    if (user) {
        const r = doc(db, "users", user.uid);
        const s = await getDoc(r);
        if(!s.exists()) {
            uData = { uid: user.uid, name: user.displayName, photo: user.photoURL, handle: user.email.split('@')[0].toLowerCase(), followers: [], following: [], postsCount: 0 };
            await setDoc(r, uData);
        } else { uData = s.data(); }
        
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('navBar').classList.remove('hidden');
        document.getElementById('fab').classList.remove('hidden');
        navigate('feedSection', document.querySelector('.nav-link'));
        listenNotifs();
    }
});

// --- NAVIGATION ---
window.navigate = (id, el) => {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if(el) el.classList.add('active');
    document.getElementById('mainHeader').classList.toggle('visible', id === 'feedSection');
    if(id === 'feedSection') loadFeed('all');
    if(id === 'profileSection') openProfile(auth.currentUser.uid);
};

window.switchFeed = (type, el) => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    loadFeed(type);
};

// --- POSTS ---
function createPostUI(id, p) {
    const isLiked = p.likes?.includes(auth.currentUser.uid);
    const div = document.createElement('div');
    div.className = 'post';
    div.innerHTML = `
        <div class="post-head" onclick="openProfile('${p.uid}')">
            <img src="${p.authorPhoto}">
            <div><b>${p.authorName}</b><br><small>@${p.authorHandle}</small></div>
        </div>
        <div class="post-content">${p.content}</div>
        ${p.image ? `<img src="${p.image}" class="post-img">` : ''}
        <div class="post-footer">
            <button class="btn-social ${isLiked ? 'liked' : ''}" onclick="likePost('${id}', '${p.uid}')">🔥 ${p.likes?.length || 0}</button>
            <button class="btn-social" onclick="repost('${id}')">🔁 Repostar</button>
        </div>
    `;
    return div;
}

async function loadFeed(type) {
    let q = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(40));
    if(type === 'friends') {
        const list = uData.following.length > 0 ? uData.following : ['none'];
        q = query(collection(db, "posts"), where("uid", "in", list), orderBy("createdAt", "desc"));
    }
    onSnapshot(q, s => {
        const container = document.getElementById('mainFeed');
        container.innerHTML = "";
        s.forEach(d => container.appendChild(createPostUI(d.id, d.data())));
    });
}

// --- PROFILE LOGIC ---
window.openProfile = async (uid) => {
    activeProfileId = uid;
    const s = await getDoc(doc(db, "users", uid));
    const data = s.data();
    
    document.getElementById('p-photo').src = data.photo;
    document.getElementById('p-name').innerText = data.name;
    document.getElementById('p-handle').innerText = data.handle;
    document.getElementById('p-count-posts').innerText = data.postsCount || 0;
    document.getElementById('p-count-friends').innerText = data.followers?.length || 0;
    
    const isMe = uid === auth.currentUser.uid;
    const followBtn = document.getElementById('p-btn-follow');
    followBtn.classList.toggle('hidden', isMe);
    followBtn.innerText = data.followers?.includes(auth.currentUser.uid) ? "CONECTADO" : "CONECTAR";

    // Carregar posts individuais desta conta
    onSnapshot(query(collection(db, "posts"), where("uid", "==", uid), orderBy("createdAt", "desc")), snap => {
        const container = document.getElementById('p-posts');
        container.innerHTML = "";
        snap.forEach(d => container.appendChild(createPostUI(d.id, d.data())));
    });

    navigate('profileSection');
};

window.toggleFollow = async () => {
    const myRef = doc(db, "users", auth.currentUser.uid);
    const targetRef = doc(db, "users", activeProfileId);
    const isFollowing = uData.following.includes(activeProfileId);

    if(isFollowing) {
        await updateDoc(myRef, { following: arrayRemove(activeProfileId) });
        await updateDoc(targetRef, { followers: arrayRemove(auth.currentUser.uid) });
        uData.following = uData.following.filter(id => id !== activeProfileId);
    } else {
        await updateDoc(myRef, { following: arrayUnion(activeProfileId) });
        await updateDoc(targetRef, { followers: arrayUnion(auth.currentUser.uid) });
        uData.following.push(activeProfileId);
        sendNotif(activeProfileId, `@${uData.handle} se conectou com você!`);
    }
    openProfile(activeProfileId);
};

// --- NOTIFICAÇÕES ---
async function sendNotif(to, text) {
    if(to === auth.currentUser.uid) return;
    await addDoc(collection(db, "notifications"), { to, text, read: false, createdAt: serverTimestamp() });
}

function listenNotifs() {
    const q = query(collection(db, "notifications"), where("to", "==", auth.currentUser.uid), orderBy("createdAt", "desc"), limit(10));
    onSnapshot(q, s => {
        const list = document.getElementById('notifList');
        const badge = document.getElementById('notifBadge');
        list.innerHTML = "";
        let unread = false;
        s.forEach(d => {
            if(!d.data().read) unread = true;
            list.innerHTML += `<div class="notif-item">${d.data().text}</div>`;
        });
        badge.style.display = unread ? 'block' : 'none';
    });
}

window.toggleNotifs = () => {
    const panel = document.getElementById('notifPanel');
    panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    document.getElementById('notifBadge').style.display = 'none';
};

// --- BUSCA ---
window.searchUsers = async () => {
    const val = document.getElementById('userSearch').value.toLowerCase();
    if(val.length < 2) return;
    const q = query(collection(db, "users"), where("handle", ">=", val), where("handle", "<=", val + "\uf8ff"), limit(5));
    const s = await getDocs(q);
    const res = document.getElementById('searchResults');
    res.innerHTML = "";
    s.forEach(d => {
        const u = d.data();
        const div = document.createElement('div');
        div.className = 'post'; div.style.display = 'flex'; div.style.gap = '15px'; div.style.alignItems = 'center'; div.style.cursor = 'pointer';
        div.innerHTML = `<img src="${u.photo}" style="width:40px; height:40px; border-radius:10px;"> <div><b>${u.name}</b><br><small>@${u.handle}</small></div>`;
        div.onclick = () => openProfile(d.id);
        res.appendChild(div);
    });
};

// --- POSTING ---
window.openPostModal = () => document.getElementById('postModal').style.display = 'block';
window.closePostModal = () => {
    document.getElementById('postModal').style.display = 'none';
    document.getElementById('postPreview').style.display = 'none';
    document.getElementById('postText').value = "";
    postFile = null;
};

window.previewFile = (input) => {
    postFile = input.files[0];
    const reader = new FileReader();
    reader.onload = e => {
        const img = document.getElementById('postPreview');
        img.src = e.target.result; img.style.display = 'block';
    };
    reader.readAsDataURL(postFile);
};

window.publishPost = async () => {
    const txt = document.getElementById('postText').value;
    const btn = document.getElementById('pubBtn');
    if(!txt && !postFile) return;
    btn.disabled = true;

    let url = "";
    if(postFile) {
        const r = ref(storage, `posts/${Date.now()}`);
        await uploadBytes(r, postFile);
        url = await getDownloadURL(r);
    }

    await addDoc(collection(db, "posts"), {
        uid: auth.currentUser.uid,
        authorName: uData.name,
        authorHandle: uData.handle,
        authorPhoto: uData.photo,
        content: txt,
        image: url,
        likes: [],
        createdAt: serverTimestamp()
    });

    await updateDoc(doc(db, "users", auth.currentUser.uid), { postsCount: increment(1) });
    closePostModal();
    btn.disabled = false;
};

window.likePost = async (id, targetUid) => {
    const r = doc(db, "posts", id);
    const s = await getDoc(r);
    const likes = s.data().likes || [];
    if(likes.includes(auth.currentUser.uid)) {
        await updateDoc(r, { likes: arrayRemove(auth.currentUser.uid) });
    } else {
        await updateDoc(r, { likes: arrayUnion(auth.currentUser.uid) });
        sendNotif(targetUid, `@${uData.handle} curtiu sua publicação!`);
    }
};

window.repost = async (id) => {
    const s = await getDoc(doc(db, "posts", id));
    const p = s.data();
    await addDoc(collection(db, "posts"), {
        uid: auth.currentUser.uid,
        authorName: uData.name, authorHandle: uData.handle, authorPhoto: uData.photo,
        content: `🔁 REPOST de @${p.authorHandle}:\n\n${p.content}`,
        image: p.image || "", likes: [], createdAt: serverTimestamp()
    });
    alert("Repostado!");
};
</script>
</body>
</html>
