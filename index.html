<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Klyon Elite | v4.0 Final</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --bg: #03030b; --glass: rgba(255, 255, 255, 0.08); --glass-border: rgba(255, 255, 255, 0.15); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; }

        header { position: fixed; top: 0; width: 100%; height: 60px; display: flex; align-items: center; justify-content: center; z-index: 1001; background: rgba(3, 3, 11, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); }
        header h1 { font-family: 'Orbitron'; font-size: 1rem; color: var(--primary); letter-spacing: 2px; }

        .section { display: none; width: 100%; min-height: 100vh; padding: 75px 0 120px 0; }
        .section.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .container { max-width: 600px; margin: auto; padding: 0 15px; }

        /* PERFIL */
        .profile-banner { height: 160px; background: #1a1a2e; background-size: cover; background-position: center; border-radius: 0 0 20px 20px; cursor: pointer; border: 1px solid var(--glass-border); }
        .p-avatar { width: 95px; height: 95px; border-radius: 50%; border: 4px solid var(--bg); object-fit: cover; background: #000; margin-top: -50px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        
        /* NOTIFICAÇÕES */
        .notif-card { background: var(--glass); padding: 15px; border-radius: 15px; margin-bottom: 10px; border: 1px solid var(--glass-border); display: flex; align-items: center; gap: 10px; }
        .notif-dot { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; }

        /* UI ELEMENTS */
        .btn-action { border: 1px solid var(--primary); background: transparent; color: var(--primary); padding: 8px 20px; border-radius: 20px; font-weight: 700; cursor: pointer; }
        .btn-filled { background: var(--primary); color: #000; border: none; }
        .post { display: flex; gap: 12px; padding: 18px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .post img.avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
        
        /* NAV GLASS */
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px; height: 70px; background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(15px); border: 1px solid var(--glass-border); border-radius: 25px; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-link { flex: 1; text-align: center; cursor: pointer; }
        .nav-link img { width: 28px; height: 28px; opacity: 0.5; transition: 0.3s; }
        .nav-link.active img { opacity: 1; filter: drop-shadow(0 0 8px var(--primary)); transform: scale(1.1); }

        #fab { position: fixed; bottom: 105px; right: 25px; width: 56px; height: 56px; border-radius: 50%; background: var(--primary); border: none; color: #000; font-size: 30px; z-index: 999; cursor: pointer; box-shadow: 0 5px 15px rgba(0,242,255,0.3); }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 2000; display: none; padding: 25px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<header><h1>KLYON ELITE</h1></header>

<div id="loginSection" style="height: 100vh; display: flex; align-items: center; justify-content: center;">
    <button onclick="login()" class="btn-action btn-filled">Entrar na Elite</button>
</div>

<div id="feedSection" class="section">
    <div class="container" id="mainFeed"></div>
</div>

<div id="notifSection" class="section">
    <div class="container">
        <h2 style="font-family: 'Orbitron'; font-size: 1.2rem; margin-bottom: 20px;">NOTIFICAÇÕES</h2>
        <div id="notifList"></div>
    </div>
</div>

<div id="profileSection" class="section">
    <input type="file" id="bannerFile" class="hidden" accept="image/*" onchange="uploadToStorage(this, 'banner')">
    <input type="file" id="avatarFile" class="hidden" accept="image/*" onchange="uploadToStorage(this, 'photo')">

    <div class="profile-banner" id="p-banner" onclick="document.getElementById('bannerFile').click()"></div>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: flex-end;">
            <img id="p-photo" src="" class="p-avatar" onclick="document.getElementById('avatarFile').click()">
            <div id="profileActions">
                <button id="btn-edit" class="btn-action" onclick="toggleEdit(true)">Editar</button>
                <button id="btn-follow" class="btn-action btn-filled hidden" onclick="handleFollow()">Seguir</button>
            </div>
        </div>
        
        <div id="view-mode" style="margin-top: 15px;">
            <h2 id="p-name" style="margin: 0;"></h2>
            <span style="color:var(--primary)">@<span id="p-handle"></span></span>
            <p id="p-bio" style="color:#ccc; margin: 10px 0;"></p>
            <div style="display: flex; gap: 15px; font-size: 0.9rem; color: #777;">
                <span><b id="count-following" style="color:#fff">0</b> Seguindo</span>
                <span><b id="count-followers" style="color:#fff">0</b> Seguidores</span>
            </div>
        </div>

        <div id="edit-mode" class="edit-box hidden" style="margin-top:20px; background: var(--glass); padding: 15px; border-radius: 15px;">
            <input type="text" id="in-name" class="k-input" style="width:100%; padding:10px; margin-bottom:10px; background:#111; border:1px solid #333; color:#fff" placeholder="Nome">
            <input type="text" id="in-handle" class="k-input" style="width:100%; padding:10px; margin-bottom:10px; background:#111; border:1px solid #333; color:#fff" placeholder="handle">
            <textarea id="in-bio" class="k-input" style="width:100%; padding:10px; margin-bottom:10px; background:#111; border:1px solid #333; color:#fff" placeholder="Bio"></textarea>
            <button class="btn-action btn-filled" onclick="saveEliteProfile()">Salvar</button>
            <button class="btn-action" onclick="toggleEdit(false)">Cancelar</button>
        </div>
        
        <div id="myPosts" style="margin-top: 30px;"></div>
    </div>
</div>

<div id="postModal" class="modal">
    <div style="display:flex; justify-content: space-between;">
        <button onclick="closeModal()" style="background:none; border:none; color:#fff;">Fechar</button>
        <button id="pubBtn" class="btn-action btn-filled" onclick="publishElitePost()">Publicar</button>
    </div>
    <textarea id="postText" style="width:100%; height:150px; background:none; border:none; color:#fff; font-size:1.2rem; margin-top:20px;" placeholder="O que há de novo?"></textarea>
    <input type="file" id="postFile" class="hidden" onchange="previewPost(this)">
    <div onclick="document.getElementById('postFile').click()" style="padding:15px; background:var(--glass); border-radius:10px; cursor:pointer; text-align:center;">🖼️ Adicionar Foto</div>
    <img id="post-preview" style="width:100%; margin-top:15px; border-radius:10px; display:none;">
</div>

<button id="fab" onclick="document.getElementById('postModal').style.display='block'" style="display:none;">+</button>

<nav class="bottom-nav" id="navBar" style="display:none;">
    <div class="nav-link active" onclick="navigate('feedSection', this)"><img src="home.png"></div>
    <div class="nav-link" onclick="navigate('notifSection', this)"><img src="buscar.png"></div> <div class="nav-link" onclick="navigate('profileSection', this)"><img src="perfil.png"></div>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, updateDoc, increment, where, runTransaction, deleteDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-storage.js";

const firebaseConfig = {
    apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334",
    authDomain: "klyon-a97ba.firebaseapp.com",
    projectId: "klyon-a97ba",
    storageBucket: "klyon-a97ba.appspot.com"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);
const provider = new GoogleAuthProvider();

let uData = null;
let postFileObj = null;
let currentProfileId = null;

// --- NAVEGAÇÃO ---
window.navigate = (id, el) => {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    el.classList.add('active');
    if(id === 'profileSection') renderProfile(auth.currentUser.uid);
    if(id === 'notifSection') loadNotifications();
};

window.closeModal = () => {
    document.getElementById('postModal').style.display = 'none';
    document.getElementById('postText').value = "";
    document.getElementById('post-preview').style.display = 'none';
    postFileObj = null;
};

// --- AUTH & SYNC ---
window.login = () => signInWithPopup(auth, provider);
onAuthStateChanged(auth, async (user) => {
    if (user) {
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("navBar").style.display = "flex";
        document.getElementById("fab").style.display = "block";
        await syncUser(user);
        navigate('feedSection', document.querySelector('.nav-link'));
        loadFeed();
    }
});

async function syncUser(user) {
    const snap = await getDoc(doc(db, "users", user.uid));
    if(!snap.exists()) {
        const handle = "user_" + user.uid.substring(0,4);
        uData = { name: user.displayName, photo: user.photoURL, handle, bio: "Klyon Elite", banner: "", followers: 0, following: 0 };
        await setDoc(doc(db, "users", user.uid), uData);
        await setDoc(doc(db, "handles", handle), { uid: user.uid });
    } else uData = snap.data();
}

// --- FOTOS (CORRIGIDO) ---
window.uploadToStorage = async (input, type) => {
    const file = input.files[0];
    if(!file) return;
    const sRef = ref(storage, `users/${auth.currentUser.uid}/${type}`);
    await uploadBytes(sRef, file);
    const url = await getDownloadURL(sRef);
    
    // Adiciona timestamp para forçar o navegador a recarregar a imagem
    const finalUrl = url + "?t=" + Date.now();
    
    await updateDoc(doc(db, "users", auth.currentUser.uid), { [type]: finalUrl });
    uData[type] = finalUrl;
    
    // Atualiza a UI imediatamente
    if(type === 'photo') document.getElementById('p-photo').src = finalUrl;
    if(type === 'banner') document.getElementById('p-banner').style.backgroundImage = `url(${finalUrl})`;
    alert("Foto atualizada!");
};

// --- SISTEMA DE SEGUIR/AMIGOS ---
window.handleFollow = async () => {
    const myUid = auth.currentUser.uid;
    const followId = currentProfileId;
    const followRef = doc(db, "following", `${myUid}_${followId}`);
    const snap = await getDoc(followRef);

    if(snap.exists()) {
        // Unfollow
        await deleteDoc(followRef);
        await updateDoc(doc(db, "users", myUid), { following: increment(-1) });
        await updateDoc(doc(db, "users", followId), { followers: increment(-1) });
    } else {
        // Follow
        await setDoc(followRef, { follower: myUid, following: followId, createdAt: serverTimestamp() });
        await updateDoc(doc(db, "users", myUid), { following: increment(1) });
        await updateDoc(doc(db, "users", followId), { followers: increment(1) });
        
        // Criar Notificação
        await addDoc(collection(db, "notifications"), {
            to: followId,
            fromName: uData.name,
            fromHandle: uData.handle,
            type: "follow",
            createdAt: serverTimestamp()
        });
    }
    renderProfile(followId);
};

// --- NOTIFICAÇÕES ---
function loadNotifications() {
    const q = query(collection(db, "notifications"), where("to", "==", auth.currentUser.uid), orderBy("createdAt", "desc"));
    onSnapshot(q, s => {
        const list = document.getElementById('notifList'); list.innerHTML = "";
        s.forEach(d => {
            const n = d.data();
            list.innerHTML += `<div class="notif-card"><div class="notif-dot"></div> <b>@${n.fromHandle}</b> começou a seguir você!</div>`;
        });
    });
}

// --- FEED & POSTS ---
function loadFeed() {
    onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc")), s => {
        const feed = document.getElementById('mainFeed'); feed.innerHTML = "";
        s.forEach(doc => feed.appendChild(createUI(doc.id, doc.data())));
    });
}

function createUI(id, p) {
    const div = document.createElement('div');
    div.className = 'post';
    div.innerHTML = `
        <img class="avatar" src="${p.userPhoto}" onclick="renderProfile('${p.uid}')">
        <div class="post-right">
            <div style="font-size:0.9rem"><b>${p.userName}</b> <span style="color:var(--primary)">@${p.userHandle}</span></div>
            <div style="margin-top:5px">${p.text}</div>
            ${p.img ? `<img src="${p.img}" style="width:100%; border-radius:15px; margin-top:10px; border:1px solid #222">` : ''}
        </div>`;
    return div;
}

// --- RENDER PERFIL ---
async function renderProfile(uid) {
    currentProfileId = uid;
    const snap = await getDoc(doc(db, "users", uid));
    const d = snap.data();
    
    document.getElementById('p-name').innerText = d.name;
    document.getElementById('p-handle').innerText = d.handle;
    document.getElementById('p-bio').innerText = d.bio || "";
    document.getElementById('p-photo').src = d.photo;
    document.getElementById('p-banner').style.backgroundImage = d.banner ? `url(${d.banner})` : 'none';
    document.getElementById('count-followers').innerText = d.followers || 0;
    document.getElementById('count-following').innerText = d.following || 0;

    // Ajustar botões se for meu perfil ou de outro
    const isMe = uid === auth.currentUser.uid;
    document.getElementById('btn-edit').classList.toggle('hidden', !isMe);
    document.getElementById('btn-follow').classList.toggle('hidden', isMe);
    
    if(!isMe) {
        const fSnap = await getDoc(doc(db, "following", `${auth.currentUser.uid}_${uid}`));
        document.getElementById('btn-follow').innerText = fSnap.exists() ? "Seguindo" : "Seguir";
    }

    onSnapshot(query(collection(db, "posts"), where("uid", "==", uid), orderBy("createdAt", "desc")), s => {
        const div = document.getElementById('myPosts'); div.innerHTML = "";
        s.forEach(doc => div.appendChild(createUI(doc.id, doc.data())));
    });
    
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById('profileSection').classList.add('active');
}

// --- EDIÇÃO & POST (Básico) ---
window.toggleEdit = (s) => {
    document.getElementById('view-mode').classList.toggle('hidden', s);
    document.getElementById('edit-mode').classList.toggle('hidden', !s);
    if(s) {
        document.getElementById('in-name').value = uData.name;
        document.getElementById('in-handle').value = uData.handle;
        document.getElementById('in-bio').value = uData.bio;
    }
};

window.saveEliteProfile = async () => {
    const n = document.getElementById('in-name').value;
    const h = document.getElementById('in-handle').value.toLowerCase().trim();
    const b = document.getElementById('in-bio').value;
    await updateDoc(doc(db, "users", auth.currentUser.uid), { name: n, handle: h, bio: b });
    uData.name = n; uData.handle = h; uData.bio = b;
    toggleEdit(false); renderProfile(auth.currentUser.uid);
};

window.previewPost = (i) => {
    postFileObj = i.files[0];
    const r = new FileReader();
    r.onload = e => { document.getElementById('post-preview').src = e.target.result; document.getElementById('post-preview').style.display='block'; };
    r.readAsDataURL(postFileObj);
};

window.publishElitePost = async () => {
    const txt = document.getElementById('postText').value;
    let url = "";
    if(postFileObj) {
        const sRef = ref(storage, `posts/${Date.now()}`);
        await uploadBytes(sRef, postFileObj);
        url = await getDownloadURL(sRef);
    }
    await addDoc(collection(db, "posts"), { uid: auth.currentUser.uid, userName: uData.name, userPhoto: uData.photo, userHandle: uData.handle, text: txt, img: url, createdAt: serverTimestamp() });
    closeModal();
};

</script>
</body>
</html>
