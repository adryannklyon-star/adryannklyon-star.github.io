<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLYON VOID</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --card-bg: rgba(10, 10, 10, 0.7);
            --border: #1a1a1a;
            --accent: #00f2ff;
            --text: #ffffff;
            --dim: #666666;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            margin: 0; background: var(--bg); color: var(--text); 
            font-family: 'Inter', sans-serif; padding-bottom: 90px;
            background-image: radial-gradient(circle at top right, #00151a, transparent);
        }

        /* HEADER GLASS */
        header { 
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); z-index: 1000;
            border-bottom: 1px solid var(--border);
        }
        .logo-area { display: flex; flex-direction: column; align-items: center; width: 100%; }
        .logo-k { font-family: 'Orbitron'; font-size: 18px; letter-spacing: 5px; color: #fff; text-shadow: 0 0 10px var(--accent); }
        .logo-void { font-size: 8px; letter-spacing: 8px; color: var(--accent); margin-top: -2px; }

        /* FEED EM CARDS NEON */
        #feed { max-width: 500px; margin: 10px auto; padding: 0 15px; }
        
        .post-card { 
            background: var(--card-bg); border: 1px solid var(--border); 
            border-radius: 20px; padding: 20px; margin-bottom: 15px;
            backdrop-filter: blur(10px);
            position: relative;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        
        .repost-label { font-size: 10px; color: #50fa7b; margin-bottom: 10px; display: flex; align-items: center; gap: 5px; opacity: 0.8; }

        .post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .user-info { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        
        /* AVATAR ORIGINAL RECUPERADO */
        .avatar { 
            width: 40px; height: 40px; border-radius: 50%; 
            background: #111; border: 1px solid #333;
            display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 14px; color: var(--accent);
        }
        .post-name { font-weight: 600; font-size: 14px; }
        .time { font-size: 11px; color: var(--dim); }

        .post-content { font-size: 15px; line-height: 1.5; color: #ddd; margin-bottom: 20px; }

        /* AÇÕES */
        .post-actions { 
            display: flex; justify-content: space-between; 
            padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.05);
        }
        .action-item { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 13px; cursor: pointer; }
        .action-item svg { width: 18px; stroke: var(--dim); fill: none; stroke-width: 2; }
        
        .action-item.voted { color: var(--accent); }
        .action-item.voted svg { stroke: var(--accent); fill: rgba(0, 242, 255, 0.1); }
        .action-item.shared { color: #50fa7b; }
        .action-item.shared svg { stroke: #50fa7b; }

        .delete-btn { font-size: 10px; color: #ff4444; cursor: pointer; opacity: 0.5; }
        .delete-btn:hover { opacity: 1; }

        /* FAB NEON */
        .fab { 
            position: fixed; bottom: 100px; right: 20px; 
            width: 55px; height: 55px; background: #000;
            border: 1px solid var(--accent); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3); z-index: 999;
        }
        .fab svg { width: 24px; stroke: #fff; }

        /* MODAIS GLASS */
        .modal { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); 
            z-index: 2000; display: none; align-items: center; justify-content: center;
            backdrop-filter: blur(10px);
        }
        .modal-content { 
            background: rgba(15, 15, 15, 0.95); width: 90%; max-width: 400px; 
            padding: 25px; border-radius: 25px; border: 1px solid var(--accent);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.15);
        }
        textarea { 
            width: 100%; height: 120px; background: transparent; border: none; 
            color: #fff; font-size: 16px; resize: none; margin-top: 15px;
        }
        .btn-publish { 
            width: 100%; background: #fff; color: #000; border: none; 
            padding: 12px; border-radius: 30px; font-weight: 600; cursor: pointer;
        }

        /* NAV INFERIOR */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; height: 75px; 
            background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); border-top: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-around;
        }
        .nav-item svg { width: 22px; stroke: var(--dim); fill: none; stroke-width: 2; }
        .nav-item.active svg { stroke: var(--accent); filter: drop-shadow(0 0 5px var(--accent)); }
    </style>
</head>
<body>

<header>
    <div class="logo-area">
        <div class="logo-k">K</div>
        <div class="logo-void">VOID</div>
    </div>
</header>

<main id="feed"></main>

<div class="fab" id="openPost"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></div>

<div id="postModal" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:10px; letter-spacing:2px; color:var(--dim); font-family:'Orbitron';">NOVA TRANSMISSÃO</span>
            <span onclick="closeModal('postModal')" style="cursor:pointer; color:var(--accent);">X</span>
        </div>
        <textarea id="postText" placeholder="O que o vazio precisa ouvir?"></textarea>
        <button class="btn-publish" id="sendPost">TRANSMITIR</button>
    </div>
</div>

<div id="commentModal" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:10px; letter-spacing:2px; color:var(--dim); font-family:'Orbitron';">RESPONDER</span>
            <span onclick="closeModal('commentModal')" style="cursor:pointer; color:var(--accent);">X</span>
        </div>
        <textarea id="commentText" placeholder="Sua resposta ao sinal..."></textarea>
        <button class="btn-publish" id="sendReply">ENVIAR</button>
    </div>
</div>

<nav class="bottom-nav">
    <a href="index.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></a>
    <a href="buscar.html" class="nav-item"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></a>
    <a href="notificacoes.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path></svg></a>
    <a href="perfil.html" class="nav-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle></svg></a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, getDoc, updateDoc, increment, arrayUnion, arrayRemove, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", authDomain: "klyon-a97ba.firebaseapp.com", projectId: "klyon-a97ba" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let me = null;
    let currentPostId = null;

    onAuthStateChanged(auth, async user => {
        if (!user) return window.location.href = "login.html";
        const snap = await getDoc(doc(db, "users", user.uid));
        me = { id: user.uid, ...snap.data() };
        loadFeed();
    });

    function loadFeed() {
        const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
        onSnapshot(q, snap => {
            const feed = document.getElementById('feed');
            feed.innerHTML = "";
            snap.forEach(d => {
                const p = d.data();
                const postId = d.id;
                const isVoted = p.votesBy?.includes(me.id);
                const isShared = p.sharedBy?.includes(me.id);
                const isMine = p.uid === me.id || (p.isRepost && p.reposterId === me.id);
                
                feed.innerHTML += `
                    <div class="post-card">
                        ${p.isRepost ? `<div class="repost-label">↺ republicado por ${p.repostedBy}</div>` : ''}
                        <div class="post-header">
                            <div class="user-info" onclick="location.href='perfil.html?u=${p.authorHandle}'">
                                <div class="avatar">${p.authorName[0]}</div>
                                <div>
                                    <div class="post-name">${p.authorName}</div>
                                    <div class="time">@${p.authorHandle}</div>
                                </div>
                            </div>
                            ${isMine ? `<div class="delete-btn" onclick="deletePost('${postId}')">excluir</div>` : ''}
                        </div>
                        <div class="post-content">${p.content}</div>
                        <div class="post-actions">
                            <div class="action-item ${isVoted ? 'voted' : ''}" onclick="toggleVote('${postId}', '${p.uid}', ${isVoted})">
                                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path></svg>
                                <span>${p.votesCount || 0}</span>
                            </div>
                            <div class="action-item" onclick="openCommentModal('${postId}')">
                                <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                                <span>${p.commentsCount || 0}</span>
                            </div>
                            <div class="action-item ${isShared ? 'shared' : ''}" onclick="handleRepost('${postId}', ${JSON.stringify(p).replace(/"/g, '&quot;')}, ${isShared})">
                                <svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
                                <span>${p.repostsCount || 0}</span>
                            </div>
                        </div>
                    </div>`;
            });
        });
    }

    window.deletePost = async (id) => {
        if(confirm("Deseja apagar este sinal?")) await deleteDoc(doc(db, "posts", id));
    };

    window.toggleVote = async (id, authorUid, voted) => {
        const pRef = doc(db, "posts", id);
        const uRef = doc(db, "users", authorUid);
        await updateDoc(pRef, { votesCount: increment(voted ? -1 : 1), votesBy: voted ? arrayRemove(me.id) : arrayUnion(me.id) });
        await updateDoc(uRef, { votos: increment(voted ? -1 : 1) });
    };

    window.handleRepost = async (id, originalPost, shared) => {
        if(shared) return;
        await updateDoc(doc(db, "posts", id), { repostsCount: increment(1), sharedBy: arrayUnion(me.id) });
        await addDoc(collection(db, "posts"), {
            ...originalPost, isRepost: true, repostedBy: me.name, reposterId: me.id,
            createdAt: serverTimestamp(), votesCount: 0, votesBy: [], commentsCount: 0, repostsCount: 0, sharedBy: []
        });
    };

    window.openCommentModal = (id) => { currentPostId = id; document.getElementById('commentModal').style.display='flex'; };
    window.closeModal = (m) => document.getElementById(m).style.display = 'none';

    document.getElementById('openPost').onclick = () => document.getElementById('postModal').style.display='flex';

    document.getElementById('sendPost').onclick = async () => {
        const val = document.getElementById('postText').value;
        if(!val.trim()) return;
        await addDoc(collection(db, "posts"), {
            uid: me.id, authorName: me.name, authorHandle: me.handle,
            content: val, createdAt: serverTimestamp(),
            votesCount: 0, votesBy: [], commentsCount: 0, repostsCount: 0, sharedBy: [], isRepost: false
        });
        closeModal('postModal');
        document.getElementById('postText').value = "";
    };

    document.getElementById('sendReply').onclick = async () => {
        const val = document.getElementById('commentText').value;
        if(!val.trim()) return;
        await updateDoc(doc(db, "posts", currentPostId), { commentsCount: increment(1) });
        closeModal('commentModal');
        document.getElementById('commentText').value = "";
    };
</script>
</body>
</html>
