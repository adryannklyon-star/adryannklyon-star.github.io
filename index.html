<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLYON | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --bg: #030307; --glass: rgba(255,255,255,0.05); --glass-border: rgba(255,255,255,0.1); --text-dim: #94a3b8; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at 50% 0%, #0f172a 0%, #030307 100%); min-height: 100vh; }
        header { position: fixed; top: 0; width: 100%; height: 60px; background: rgba(3,3,7,0.9); backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; box-sizing: border-box; }
        .post { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px; padding: 18px; margin: 15px; }
        .post-head { display: flex; gap: 12px; align-items: center; cursor: pointer; }
        .post-head img { width: 40px; height: 40px; border-radius: 12px; }
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; height: 65px; background: rgba(15,23,42,0.9); border-radius: 25px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-around; z-index: 1000; }
        .nav-link { opacity: 0.4; }
        .nav-link.active { opacity: 1; filter: drop-shadow(0 0 5px var(--primary)); }
        .nav-link img { width: 24px; filter: invert(1); }
        .btn-elite { background: var(--primary); border: none; padding: 10px 20px; border-radius: 12px; font-weight: 800; cursor: pointer; }
        #loginSection { position: fixed; inset: 0; background: #000; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #fab { position: fixed; bottom: 100px; right: 25px; width: 60px; height: 60px; background: var(--primary); border-radius: 20px; border: none; font-size: 28px; z-index: 999; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="loginSection" class="hidden">
    <h1 style="font-family:'Orbitron'; color:var(--primary);">KLYON</h1>
    <button class="btn-elite" onclick="login()">ACESSAR ELITE</button>
</div>

<header>
    <span style="font-family:'Orbitron'; color:var(--primary); letter-spacing: 2px;">KLYON</span>
    <div onclick="toggleNotifs()">🔔</div>
</header>

<main id="feed" style="margin-top: 70px; padding-bottom: 100px;"></main>

<button id="fab" onclick="document.getElementById('postModal').style.display='block'">+</button>

<div id="postModal" style="display:none; position:fixed; inset:0; background:var(--bg); z-index:5000; padding:20px;">
    <button onclick="this.parentElement.style.display='none'">Fechar</button>
    <textarea id="postText" style="width:100%; height:200px; background:none; color:#fff;" placeholder="No que pensa?"></textarea>
    <button class="btn-elite" onclick="publishPost()">POSTAR</button>
</div>

<nav class="bottom-nav">
    <a href="index.html" class="nav-link active"><img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png"></a>
    <a href="buscar.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/149/149852.png"></a>
    <a href="perfil.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png"></a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, collection, query, orderBy, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", authDomain: "klyon-a97ba.firebaseapp.com", projectId: "klyon-a97ba", storageBucket: "klyon-a97ba.appspot.com" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    window.login = () => signInWithPopup(auth, provider);

    onAuthStateChanged(auth, user => {
        if (!user) document.getElementById('loginSection').classList.remove('hidden');
        else loadFeed();
    });

    function loadFeed() {
        onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc")), s => {
            const f = document.getElementById('feed'); f.innerHTML = "";
            s.forEach(d => {
                const p = d.data();
                f.innerHTML += `
                    <div class="post">
                        <div class="post-head" onclick="location.href='perfil.html?uid=${p.uid}'">
                            <img src="${p.authorPhoto}">
                            <b>${p.authorName}</b>
                        </div>
                        <p>${p.content}</p>
                    </div>`;
            });
        });
    }

    window.publishPost = async () => {
        const text = document.getElementById('postText').value;
        if(!text) return;
        await addDoc(collection(db, "posts"), {
            uid: auth.currentUser.uid, authorName: auth.currentUser.displayName, authorPhoto: auth.currentUser.photoURL,
            content: text, createdAt: serverTimestamp(), authorHandle: auth.currentUser.email.split('@')[0]
        });
        document.getElementById('postModal').style.display='none';
    };
</script>
</body>
</html>
