<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLYON | Elite Social</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --bg: #030307; --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); --text-dim: #94a3b8; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at 50% 0%, #0f172a 0%, #030307 100%); min-height: 100vh; padding-bottom: 100px; overflow-x: hidden; }
        
        header { position: fixed; top: 0; width: 100%; height: 65px; background: rgba(3,3,7,0.85); backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 1000; }
        .logo { font-family: 'Orbitron'; color: var(--primary); letter-spacing: 3px; font-size: 1.2rem; }
        
        .container { max-width: 550px; margin: auto; padding-top: 80px; }
        
        /* Notificações Badge */
        #notifBtn { position: relative; font-size: 1.4rem; cursor: pointer; }
        #badge { position: absolute; top: -2px; right: -2px; width: 10px; height: 10px; background: #ff2d55; border-radius: 50%; display: none; border: 2px solid #000; }

        /* Posts */
        .post { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px; padding: 18px; margin: 15px; animation: fadeIn 0.5s ease; }
        .post-head { display: flex; gap: 12px; align-items: center; cursor: pointer; margin-bottom: 12px; }
        .post-head img { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--primary); object-fit: cover; }
        .post-content { font-size: 0.95rem; line-height: 1.5; color: #e2e8f0; }
        .post-img { width: 100%; border-radius: 15px; margin-top: 10px; border: 1px solid var(--glass-border); }

        /* Botão de Postagem (FAB) */
        #fab { position: fixed; bottom: 100px; right: 25px; width: 60px; height: 60px; background: var(--primary); border-radius: 20px; border: none; font-size: 30px; cursor: pointer; box-shadow: 0 0 20px rgba(0, 242, 255, 0.4); z-index: 999; }
        
        /* Modal de Postagem */
        #postModal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal-card { background: #0f172a; width: 90%; max-width: 500px; padding: 25px; border-radius: 24px; border: 1px solid var(--primary); }
        textarea { width: 100%; height: 120px; background: transparent; border: none; color: #fff; font-size: 1.1rem; resize: none; margin: 15px 0; }
        .modal-input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); padding: 12px; border-radius: 12px; color: #fff; margin-bottom: 15px; }

        /* Navegação */
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; height: 65px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px); border-radius: 25px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-around; z-index: 1000; }
        .nav-link img { width: 24px; filter: invert(1); opacity: 0.4; }
        .nav-link.active img { opacity: 1; filter: drop-shadow(0 0 8px var(--primary)) invert(1); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
    </style>
</head>
<body>

<header>
    <div class="logo">KLYON</div>
    <div id="notifBtn" onclick="location.href='notificacoes.html'">
        🔔<span id="badge"></span>
    </div>
</header>

<div id="postModal">
    <div class="modal-card">
        <h2 style="font-family:'Orbitron'; font-size:1rem; color:var(--primary); margin:0;">NOVA TRANSMISSÃO</h2>
        <textarea id="postContent" placeholder="O que está acontecendo no mundo elite?"></textarea>
        <input type="text" id="postImageUrl" class="modal-input" placeholder="URL da Foto (Opcional)">
        <button onclick="sendPost()" style="width:100%; background:var(--primary); border:none; padding:15px; border-radius:15px; font-weight:800; font-family:'Orbitron'; cursor:pointer; color:#000;">PUBLICAR</button>
        <button onclick="closeModal()" style="width:100%; background:transparent; color:#ff2d55; border:none; margin-top:10px; cursor:pointer;">Cancelar</button>
    </div>
</div>

<main class="container" id="feed"></main>

<button id="fab" onclick="openModal()">+</button>

<nav class="bottom-nav">
    <a href="index.html" class="nav-link active"><img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png"></a>
    <a href="buscar.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/149/149852.png"></a>
    <a href="perfil.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png"></a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, query, where, addDoc, doc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", authDomain: "klyon-a97ba.firebaseapp.com", projectId: "klyon-a97ba", storageBucket: "klyon-a97ba.appspot.com" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentEliteUser = null;

    onAuthStateChanged(auth, async user => {
        if (!user) {
            window.location.href = "login.html";
        } else {
            // Busca os dados atualizados do usuário no banco (importante para a foto de perfil não sumir)
            const userSnap = await getDoc(doc(db, "users", user.uid));
            if(userSnap.exists()) {
                currentEliteUser = userSnap.data();
            }
            loadFeed();
            checkNotifications(user.uid);
        }
    });

    function loadFeed() {
        onSnapshot(collection(db, "posts"), snapshot => {
            const feed = document.getElementById('feed');
            feed.innerHTML = "";
            let posts = [];
            snapshot.forEach(doc => posts.push({id: doc.id, ...doc.data()}));
            
            // Ordena por data (mais recentes primeiro)
            posts.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

            posts.forEach(p => {
                feed.innerHTML += `
                    <div class="post">
                        <div class="post-head" onclick="location.href='perfil.html?uid=${p.uid}'">
                            <img src="${p.authorPhoto || 'https://via.placeholder.com/44'}">
                            <div>
                                <b>${p.authorName}</b><br>
                                <small style="color:var(--primary)">@${p.authorHandle}</small>
                            </div>
                        </div>
                        <div class="post-content">${p.content}</div>
                        ${p.image ? `<img src="${p.image}" class="post-img">` : ''}
                    </div>
                `;
            });
        });
    }

    function checkNotifications(uid) {
        const q = query(collection(db, "notifications"), where("to", "==", uid), where("read", "==", false));
        onSnapshot(q, s => {
            document.getElementById('badge').style.display = s.empty ? "none" : "block";
        });
    }

    // Funções Globais para o Modal
    window.openModal = () => document.getElementById('postModal').style.display = 'flex';
    window.closeModal = () => {
        document.getElementById('postModal').style.display = 'none';
        document.getElementById('postContent').value = '';
        document.getElementById('postImageUrl').value = '';
    };

    window.sendPost = async () => {
        const text = document.getElementById('postContent').value;
        const img = document.getElementById('postImageUrl').value;

        if (!text.trim()) return alert("Escreva algo antes de transmitir!");

        try {
            await addDoc(collection(db, "posts"), {
                uid: auth.currentUser.uid,
                authorName: currentEliteUser.name,
                authorPhoto: currentEliteUser.photo,
                authorHandle: currentEliteUser.handle,
                content: text,
                image: img || null,
                createdAt: serverTimestamp(),
                likes: [],
                comments: []
            });
            closeModal();
        } catch (e) {
            console.error(e);
            alert("Erro ao publicar.");
        }
    };
</script>
</body>
</html>
