<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLYON | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --bg: #030307; --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); --text-dim: #94a3b8; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at 50% 0%, #0f172a 0%, #030307 100%); min-height: 100vh; padding-bottom: 100px; }
        header { position: fixed; top: 0; width: 100%; height: 65px; background: rgba(3,3,7,0.8); backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 1000; }
        .logo { font-family: 'Orbitron'; color: var(--primary); letter-spacing: 3px; font-size: 1.2rem; }
        .container { max-width: 550px; margin: auto; padding-top: 80px; }
        .post { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px; padding: 18px; margin: 15px; }
        .post-head { display: flex; gap: 12px; align-items: center; cursor: pointer; margin-bottom: 12px; }
        .post-head img { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--primary); object-fit: cover; }
        .post-img { width: 100%; border-radius: 15px; margin-top: 10px; border: 1px solid var(--glass-border); }
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; height: 65px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px); border-radius: 25px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-around; z-index: 1000; }
        .nav-link img { width: 24px; filter: invert(1); opacity: 0.4; }
        .nav-link.active img { opacity: 1; filter: drop-shadow(0 0 8px var(--primary)) invert(1); }
        #postModal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal-card { background: #0f172a; width: 90%; max-width: 500px; padding: 25px; border-radius: 24px; border: 1px solid var(--primary); }
        textarea { width: 100%; height: 100px; background: transparent; border: none; color: #fff; font-size: 1.1rem; resize: none; }
        #fab { position: fixed; bottom: 100px; right: 25px; width: 60px; height: 60px; background: var(--primary); border-radius: 20px; border: none; font-size: 30px; cursor: pointer; z-index: 999; }
    </style>
</head>
<body>

<div id="postModal">
    <div class="modal-card">
        <textarea id="postContent" placeholder="O que está acontecendo?"></textarea>
        <input type="text" id="postImageUrl" placeholder="URL da Foto (Opcional)" style="width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--glass-border); padding:10px; border-radius:10px; color:#fff; margin-bottom:15px;">
        <button onclick="sendPost()" style="width:100%; background:var(--primary); border:none; padding:12px; border-radius:12px; font-weight:800; font-family:'Orbitron';">POSTAR</button>
        <button onclick="closeModal()" style="width:100%; background:transparent; color:#ff2d55; border:none; margin-top:10px;">Cancelar</button>
    </div>
</div>

<header><div class="logo">KLYON</div></header>
<main class="container" id="feed"></main>
<button id="fab" onclick="openModal()">+</button>

<nav class="bottom-nav">
    <a href="index.html" class="nav-link active"><img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png"></a>
    <a href="perfil.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png"></a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, doc, getDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", authDomain: "klyon-a97ba.firebaseapp.com", projectId: "klyon-a97ba", storageBucket: "klyon-a97ba.appspot.com" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let userData = null;

    onAuthStateChanged(auth, async user => {
        if(!user) return window.location.href = "login.html";
        const snap = await getDoc(doc(db, "users", user.uid));
        userData = snap.data();
        loadFeed();
    });

    function loadFeed() {
        onSnapshot(collection(db, "posts"), s => {
            const f = document.getElementById('feed'); f.innerHTML = "";
            let posts = [];
            s.forEach(d => posts.push({id: d.id, ...d.data()}));
            posts.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            posts.forEach(p => {
                f.innerHTML += `
                    <div class="post">
                        <div class="post-head" onclick="location.href='perfil.html?uid=${p.uid}'">
                            <img src="${p.authorPhoto}">
                            <div><b>${p.authorName}</b><br><small>@${p.authorHandle}</small></div>
                        </div>
                        <div class="post-content">${p.content}</div>
                        ${p.image ? `<img src="${p.image}" class="post-img">` : ''}
                    </div>`;
            });
        });
    }

    window.openModal = () => document.getElementById('postModal').style.display = 'flex';
    window.closeModal = () => document.getElementById('postModal').style.display = 'none';

    window.sendPost = async () => {
        const txt = document.getElementById('postContent').value;
        const img = document.getElementById('postImageUrl').value;
        if(!txt.trim()) return;
        await addDoc(collection(db, "posts"), {
            uid: auth.currentUser.uid,
            authorName: userData.name, 
            authorPhoto: userData.photo, // USA A FOTO DO BANCO, NÃO DO GOOGLE
            authorHandle: userData.handle,
            content: txt,
            image: img || null,
            createdAt: serverTimestamp()
        });
        closeModal();
    };
</script>
</body>
</html>
