<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLYON | VOID</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --card-bg: #050505;
            --border: #111111;
            --accent: #00f2ff;
            --text-main: #eeeeee;
            --text-dim: #666666;
            --danger: #ff4444;
            --success: #50fa7b;
            --glass: rgba(0, 0, 0, 0.85);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { 
            background: var(--bg); color: var(--text-main); 
            font-family: 'Inter', sans-serif; line-height: 1.5;
            padding-bottom: 100px; overflow-x: hidden;
        }

        /* Header Ajustado */
        header { 
            height: 70px; display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; background: var(--glass); 
            backdrop-filter: blur(20px); z-index: 1000;
            border-bottom: 1px solid var(--border); padding: 0 20px;
        }

        .logo-container { text-align: center; flex-grow: 1; margin-right: -24px; /* Compensar o ícone do chat para centralizar */ }
        .logo-main { font-size: 16px; letter-spacing: 8px; font-weight: 400; color: #fff; display: block; }
        .logo-sub { font-size: 8px; letter-spacing: 4px; color: var(--accent); margin-top: -2px; text-transform: uppercase; }

        .chat-link { 
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; color: var(--text-main); transition: 0.3s;
            width: 24px;
        }
        .chat-link svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 1.5; }

        /* Feed */
        #feed { max-width: 550px; margin: 0 auto; width: 100%; }
        .post { padding: 24px 20px; border-bottom: 1px solid var(--border); position: relative; }
        .post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
        .neon-avatar-circle {
            width: 44px; height: 44px; border-radius: 50%; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            display: flex; align-items: center; justify-content: center; 
            font-size: 16px; color: #fff; background: radial-gradient(circle at top left, #1a1a1a, #000);
            text-transform: uppercase;
        }

        .post-info b { font-size: 14px; color: #fff; }
        .post-info span { font-size: 12px; color: var(--text-dim); }
        .post-content { font-size: 15px; font-weight: 300; color: #ddd; margin-left: 56px; white-space: pre-wrap; }

        .post-actions { display: flex; gap: 35px; margin-top: 20px; margin-left: 56px; }
        .action-item { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-dim); cursor: pointer; }
        .action-item svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.6; }
        .action-item.voted { color: #fff; }

        /* Modais */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 5000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(12px); padding: 20px; }
        .modal-card { background: #080808; width: 100%; max-width: 450px; padding: 30px; border-radius: 24px; border: 1px solid #1a1a1a; }
        .modal-card textarea { width: 100%; height: 160px; background: transparent; border: none; color: #fff; padding: 10px 0; resize: none; font-family: inherit; font-size: 16px; }
        .btn-publish { width: 100%; background: #fff; color: #000; border: none; padding: 15px; border-radius: 14px; font-weight: 600; cursor: pointer; margin-top: 20px; }

        /* FAB */
        .fab { position: fixed; bottom: 95px; right: 25px; width: 60px; height: 60px; background: #fff; border-radius: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 999; }
        .fab svg { width: 26px; stroke: #000; stroke-width: 2.2; fill: none; }

        /* Bottom Nav Completo */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; height: 80px; 
            background: var(--glass); backdrop-filter: blur(20px);
            border-top: 1px solid var(--border); display: flex; 
            align-items: center; justify-content: space-around; padding-bottom: 10px;
        }
        .nav-link { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--text-dim); }
        .nav-link svg { width: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; }
        .nav-link.active { color: #fff; }
    </style>
</head>
<body>

<header>
    <div style="width: 24px;"></div> <div class="logo-container">
        <span class="logo-main">K L Y O N</span>
        <span class="logo-sub">VOID</span>
    </div>
    <a href="chat.html" class="chat-link">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
    </a>
</header>

<main id="feed"></main>

<div class="fab" id="openPostBtn"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></div>

<div id="postModal" class="modal">
    <div class="modal-card">
        <textarea id="postText" placeholder="O que o vazio precisa ouvir?"></textarea>
        <button class="btn-publish" id="submitPost">TRANSMITIR</button>
        <p onclick="closeModal('postModal')" style="text-align:center; color:var(--text-dim); margin-top:15px; font-size:12px; cursor:pointer;">FECHAR</p>
    </div>
</div>

<div id="commentModal" class="modal">
    <div class="modal-card">
        <textarea id="commentText" placeholder="Sua resposta para o sinal..."></textarea>
        <button class="btn-publish" id="submitReply">ENVIAR RESPOSTA</button>
        <p onclick="closeModal('commentModal')" style="text-align:center; color:var(--text-dim); margin-top:15px; font-size:12px; cursor:pointer;">FECHAR</p>
    </div>
</div>

<nav class="bottom-nav">
    <a href="index.html" class="nav-link active"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></a>
    <a href="explorar.html" class="nav-link"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></a>
    <a href="notificacoes.html" class="nav-link"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path></svg></a>
    <a href="perfil.html" class="nav-link"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle></svg></a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, getDoc, updateDoc, increment, arrayUnion, arrayRemove, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", authDomain: "klyon-a97ba.firebaseapp.com", projectId: "klyon-a97ba" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let me = null;
    let postAtivo = null;

    onAuthStateChanged(auth, async user => {
        if (!user) return window.location.href = "login.html";
        const snap = await getDoc(doc(db, "users", user.uid));
        me = { id: user.uid, ...snap.data() };
        loadFeed();
    });

    function loadFeed() {
        const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
        onSnapshot(q, snap => {
            const feed = document.getElementById('feed');
            feed.innerHTML = "";
            snap.forEach(d => {
                const p = d.data();
                const id = d.id;
                const isVoted = p.votesBy?.includes(me.id);
                
                const postEl = document.createElement('div');
                postEl.className = 'post';
                postEl.innerHTML = `
                    <div class="post-header" onclick="location.href='perfil.html?u=${p.authorHandle}'">
                        <div class="neon-avatar-circle">${p.authorName ? p.authorName[0] : '?'}</div>
                        <div class="post-info">
                            <b>${p.authorName}</b>
                            <span>@${p.authorHandle}</span>
                        </div>
                    </div>
                    <div class="post-content">${p.content}</div>
                    <div class="post-actions">
                        <div class="action-item ${isVoted ? 'voted' : ''}" onclick="toggleVote('${id}', '${p.uid}', ${isVoted})">
                            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                            <span>${p.votesCount || 0}</span>
                        </div>
                        <div class="action-item" onclick="openComment('${id}')">
                            <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                            <span>${p.commentsCount || 0}</span>
                        </div>
                    </div>
                `;
                feed.appendChild(postEl);
            });
        });
    }

    window.toggleVote = async (id, authorUid, voted) => {
        await updateDoc(doc(db, "posts", id), { votesCount: increment(voted ? -1 : 1), votesBy: voted ? arrayRemove(me.id) : arrayUnion(me.id) });
        await updateDoc(doc(db, "users", authorUid), { votos: increment(voted ? -1 : 1) });
    };

    window.openModal = (m) => document.getElementById(m).style.display = 'flex';
    window.closeModal = (m) => document.getElementById(m).style.display = 'none';
    window.openComment = (id) => { postAtivo = id; openModal('commentModal'); };

    document.getElementById('openPostBtn').onclick = () => openModal('postModal');

    document.getElementById('submitPost').onclick = async () => {
        const txt = document.getElementById('postText').value;
        if(!txt.trim()) return;
        await addDoc(collection(db, "posts"), {
            uid: me.id, authorName: me.name, authorHandle: me.handle,
            content: txt, createdAt: serverTimestamp(),
            votesCount: 0, votesBy: [], commentsCount: 0
        });
        closeModal('postModal');
        document.getElementById('postText').value = "";
    };

    document.getElementById('submitReply').onclick = async () => {
        const txt = document.getElementById('commentText').value;
        if(!txt.trim()) return;
        await updateDoc(doc(db, "posts", postAtivo), { commentsCount: increment(1) });
        closeModal('commentModal');
        document.getElementById('commentText').value = "";
    };
</script>
</body>
</html>
