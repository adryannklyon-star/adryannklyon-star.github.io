<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLYON | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --bg: #030307; --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); --text-dim: #94a3b8; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at 50% 0%, #0f172a 0%, #030307 100%); min-height: 100vh; overflow-x: hidden; }
        
        /* Layout */
        header { position: fixed; top: 0; width: 100%; height: 65px; background: rgba(3,3,7,0.85); backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 1000; }
        .logo { font-family: 'Orbitron'; color: var(--primary); letter-spacing: 3px; font-size: 1.2rem; }
        .container { max-width: 550px; margin: auto; padding: 80px 15px 120px; }
        
        /* Posts */
        .post { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px; padding: 18px; margin-bottom: 16px; animation: fadeIn 0.4s ease; }
        .post-head { display: flex; gap: 12px; align-items: center; cursor: pointer; margin-bottom: 12px; }
        .post-head img { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--primary); object-fit: cover; }
        .post-content { font-size: 0.95rem; line-height: 1.5; color: #e2e8f0; white-space: pre-wrap; }
        .post-footer { display: flex; gap: 20px; margin-top: 15px; border-top: 1px solid var(--glass-border); padding-top: 12px; }
        .btn-action { background: none; border: none; color: var(--text-dim); cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        .btn-action:active { transform: scale(0.9); }
        .btn-action.liked { color: #ff2d55; text-shadow: 0 0 10px rgba(255, 45, 85, 0.3); }

        /* Modal Twitter-Style */
        #postModal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 2000; display: none; align-items: flex-start; justify-content: center; padding-top: 50px; }
        .modal-content { background: #0f172a; width: 95%; max-width: 500px; border-radius: 24px; border: 1px solid var(--glass-border); padding: 20px; position: relative; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-modal { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
        textarea { width: 100%; height: 150px; background: transparent; border: none; color: #fff; font-family: inherit; font-size: 1.1rem; resize: none; margin-bottom: 20px; }
        .btn-publish { background: var(--primary); color: #000; border: none; padding: 10px 24px; border-radius: 50px; font-weight: 800; font-family: 'Orbitron'; cursor: pointer; float: right; }

        /* Nav */
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; height: 65px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px); border-radius: 25px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-around; z-index: 1000; }
        .nav-link { opacity: 0.4; }
        .nav-link.active { opacity: 1; filter: drop-shadow(0 0 8px var(--primary)); }
        .nav-link img { width: 24px; filter: invert(1); }
        #fab { position: fixed; bottom: 100px; right: 25px; width: 60px; height: 60px; background: var(--primary); border-radius: 20px; border: none; font-size: 28px; z-index: 999; cursor: pointer; box-shadow: 0 8px 20px rgba(0, 242, 255, 0.3); }

        #loginSection { position: fixed; inset: 0; background: #000; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
        .hidden { display: none !important; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="postModal">
    <div class="modal-content">
        <div class="modal-header">
            <button class="close-modal" onclick="closePostModal()">✕</button>
            <button class="btn-publish" onclick="submitPost()">POSTAR</button>
        </div>
        <textarea id="postText" placeholder="O que está acontecendo no KLYON?"></textarea>
    </div>
</div>

<div id="loginSection" class="hidden">
    <h1 class="logo" style="font-size: 3rem;">K</h1>
    <button style="background:var(--primary); border:none; padding:15px 40px; border-radius:15px; font-weight:800; cursor:pointer; font-family:'Orbitron';" onclick="login()">ACESSAR ELITE</button>
</div>

<header>
    <div class="logo">KLYON</div>
    <div onclick="location.href='notificacoes.html'" style="cursor:pointer; position:relative;">🔔<span id="badge" style="display:none; position:absolute; top:-2px; right:-2px; width:10px; height:10px; background:red; border-radius:50%; border:2px solid #000;"></span></div>
</header>

<main class="container" id="feed">
    <div style="text-align:center; padding:50px; color:var(--text-dim);">Conectando à Elite...</div>
</main>

<button id="fab" onclick="openPostModal()">+</button>

<nav class="bottom-nav">
    <a href="index.html" class="nav-link active"><img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png"></a>
    <a href="buscar.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/149/149852.png"></a>
    <a href="perfil.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png"></a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, doc, setDoc, addDoc, serverTimestamp, updateDoc, arrayUnion, arrayRemove, query, where } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", authDomain: "klyon-a97ba.firebaseapp.com", projectId: "klyon-a97ba", storageBucket: "klyon-a97ba.appspot.com" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.login = () => signInWithPopup(auth, new GoogleAuthProvider());

    // Abre/Fecha Modal
    window.openPostModal = () => { document.getElementById('postModal').style.display = 'flex'; document.getElementById('postText').focus(); };
    window.closePostModal = () => { document.getElementById('postModal').style.display = 'none'; document.getElementById('postText').value = ''; };

    onAuthStateChanged(auth, async user => {
        if (!user) {
            document.getElementById('loginSection').classList.remove('hidden');
        } else {
            document.getElementById('loginSection').classList.add('hidden');
            await setDoc(doc(db, "users", user.uid), {
                name: user.displayName, photo: user.photoURL, handle: user.email.split('@')[0].toLowerCase()
            }, { merge: true });
            loadFeed();
            listenToNotifs(user.uid);
        }
    });

    function loadFeed() {
        onSnapshot(collection(db, "posts"), s => {
            const f = document.getElementById('feed'); f.innerHTML = "";
            let posts = [];
            s.forEach(d => posts.push({id: d.id, ...d.data()}));
            posts.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

            posts.forEach(p => {
                const isLiked = p.likes?.includes(auth.currentUser.uid);
                f.innerHTML += `
                    <div class="post">
                        <div class="post-head" onclick="location.href='perfil.html?uid=${p.uid}'">
                            <img src="${p.authorPhoto}">
                            <div><b>${p.authorName}</b><br><small style="color:var(--primary)">@${p.authorHandle}</small></div>
                        </div>
                        <div class="post-content">${p.content}</div>
                        <div class="post-footer">
                            <button class="btn-action ${isLiked ? 'liked' : ''}" onclick="likePost('${p.id}', '${p.uid}', ${isLiked})">
                                ${isLiked ? '🔥' : '👊'} ${p.likes?.length || 0}
                            </button>
                            <button class="btn-action" onclick="alert('Comentários em breve!')">💬 0</button>
                            <button class="btn-action" onclick="repost('${p.id}')">🔁</button>
                        </div>
                    </div>`;
            });
        });
    }

    window.submitPost = async () => {
        const txt = document.getElementById('postText').value;
        if(!txt.trim()) return;
        
        await addDoc(collection(db, "posts"), {
            uid: auth.currentUser.uid, authorName: auth.currentUser.displayName, 
            authorPhoto: auth.currentUser.photoURL, authorHandle: auth.currentUser.email.split('@')[0],
            content: txt, createdAt: serverTimestamp(), likes: []
        });
        closePostModal();
    };

    window.likePost = async (postId, authorId, isLiked) => {
        const ref = doc(db, "posts", postId);
        await updateDoc(ref, { likes: isLiked ? arrayRemove(auth.currentUser.uid) : arrayUnion(auth.currentUser.uid) });
        
        if (!isLiked && auth.currentUser.uid !== authorId) {
            await addDoc(collection(db, "notifications"), {
                to: authorId, text: `@${auth.currentUser.email.split('@')[0]} curtiu seu post!`, 
                read: false, createdAt: serverTimestamp()
            });
        }
    };

    window.repost = async (id) => {
        alert("Copiado para sua timeline!");
        // Lógica de repost simplificada...
    };

    function listenToNotifs(uid) {
        onSnapshot(query(collection(db, "notifications"), where("to", "==", uid), where("read", "==", false)), s => {
            document.getElementById('badge').style.display = s.empty ? "none" : "block";
        });
    }
</script>
</body>
</html>
