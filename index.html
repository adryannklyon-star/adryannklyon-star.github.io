<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Klyon</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --bg: #030307; --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); --text-dim: #94a3b8; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at 50% 0%, #0f172a 0%, #030307 100%); min-height: 100vh; padding-bottom: 120px; scroll-behavior: smooth; }
        
        header { position: fixed; top: 0; width: 100%; height: 60px; background: rgba(3,3,7,0.8); backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .logo { font-family: 'Orbitron'; color: var(--primary); letter-spacing: 5px; font-size: 1.1rem; text-shadow: 0 0 10px var(--primary); }
        
        .container { max-width: 500px; margin: auto; padding-top: 75px; }
        .neon-avatar { width: 44px; height: 44px; background: rgba(0, 0, 0, 0.5); border: 2px solid var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron'; color: var(--primary); font-size: 1.2rem; text-shadow: 0 0 10px var(--primary); box-shadow: inset 0 0 10px var(--primary); flex-shrink: 0; }

        .post { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px; padding: 18px; margin: 0 15px 15px 15px; transition: 0.3s; position: relative; }
        .post-head { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
        .post-content { font-size: 1.05rem; line-height: 1.6; color: #e2e8f0; white-space: pre-wrap; word-break: break-word; }
        
        .mention { color: var(--primary); text-decoration: none; font-weight: 600; }
        .repost-link { color: var(--primary); font-size: 0.65rem; font-family: 'Orbitron'; display: block; margin-top: 10px; cursor: pointer; text-decoration: underline; }

        .post-actions { display: flex; justify-content: space-between; border-top: 1px solid var(--glass-border); padding-top: 12px; margin-top: 12px; }
        .action-info { color: var(--text-dim); font-size: 0.75rem; display: flex; align-items: center; gap: 8px; font-family: 'Orbitron'; cursor: pointer; transition: 0.3s; }
        .action-info svg { width: 20px; height: 20px; stroke: var(--text-dim); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: 0.3s; }
        .action-info:hover { color: var(--primary); text-shadow: 0 0 8px var(--primary); }
        .action-info:hover svg { stroke: var(--primary); filter: drop-shadow(0 0 5px var(--primary)); }
        .action-info.active { color: var(--primary); }
        .action-info.active svg { stroke: var(--primary); fill: rgba(0, 242, 255, 0.1); }

        .comment-box { margin-top: 15px; padding-left: 15px; border-left: 2px solid var(--glass-border); }
        .comment { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 12px; margin-bottom: 8px; font-size: 0.85rem; }
        .comment b { color: var(--primary); font-size: 0.75rem; font-family: 'Orbitron'; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 4000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .modal-card { background: #0f172a; width: 90%; max-width: 450px; padding: 25px; border-radius: 24px; border: 1px solid var(--primary); }
        textarea { width: 100%; height: 150px; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 15px; color: #fff; padding: 15px; resize: none; margin: 15px 0; font-family: inherit; }
        .btn-main { width: 100%; background: var(--primary); border: none; padding: 15px; border-radius: 15px; font-weight: 800; font-family: 'Orbitron'; cursor: pointer; color: #000; }
        #fab { position: fixed; bottom: 105px; right: 25px; width: 60px; height: 60px; background: var(--primary); border-radius: 20px; border: none; font-size: 32px; cursor: pointer; z-index: 999; box-shadow: 0 0 15px var(--primary); }

        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 94%; max-width: 480px; height: 70px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border-radius: 28px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-around; z-index: 1000; }
        .nav-link img { width: 22px; filter: invert(1); opacity: 0.4; }
        .nav-link.active img { opacity: 1; filter: drop-shadow(0 0 8px var(--primary)) invert(1); }
        .has-new-notif img { filter: drop-shadow(0 0 10px var(--primary)) invert(1); opacity: 1; }
    </style>
    
    <meta charset="UTF-8">
    <title>KLYON</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    
    <link rel="manifest" href="manifest.json">
    
    <meta name="theme-color" content="#030307">
    <meta name="apple-mobile-web-app-capable" content="yes">

</head>
<body>

<header><div class="logo">KLYON</div></header>

<div id="actionModal" class="modal">
    <div class="modal-card">
        <h2 id="modalTitle" style="font-family:'Orbitron'; font-size: 0.9rem; color: var(--primary);">TRANSMISSÃO</h2>
        <textarea id="modalInput" placeholder="Digite sua mensagem..."></textarea>
        <button id="modalSubmit" class="btn-main">ENVIAR</button>
        <button onclick="window.closeModal('actionModal')" style="width:100%; background:transparent; color:#ff2d55; border:none; margin-top:15px; cursor:pointer; font-family:'Orbitron'; font-size: 0.7rem;">ABORTAR</button>
    </div>
</div>

<main class="container" id="feed"></main>
<button id="fab" onclick="window.openPostModal()">+</button>

<nav class="bottom-nav">
    <a href="index.html" class="nav-link active"><img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png"></a>
    <a href="buscar.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/149/149852.png"></a>
    <a href="notificacoes.html" id="nav-notif" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/3602/3602145.png"></a>
    <a href="perfil.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png"></a>
    <a href="configuracoes.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/2040/2040504.png"></a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, doc, getDoc, updateDoc, arrayUnion, arrayRemove, addDoc, serverTimestamp, query, orderBy, where } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", authDomain: "klyon-a97ba.firebaseapp.com", projectId: "klyon-a97ba" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let me = null;

    onAuthStateChanged(auth, async user => {
        if (!user) { window.location.href = "login.html"; return; }
        const snap = await getDoc(doc(db, "users", user.uid));
        if(snap.exists()) me = snap.data();
        
        onSnapshot(query(collection(db, "notifications"), where("to", "==", user.uid), where("read", "==", false)), s => {
            document.getElementById('nav-notif').classList.toggle('has-new-notif', !s.empty);
        });
        loadFeed();
    });

    async function enviarSinalNotificacao(paraId, texto, tipo, postId = null) {
        if (!paraId || paraId === auth.currentUser.uid) return;
        await addDoc(collection(db, "notifications"), {
            to: paraId, fromId: auth.currentUser.uid, fromHandle: me.handle,
            text: texto, type: tipo, postId: postId, read: false, createdAt: serverTimestamp()
        });
    }

    window.closeModal = (id) => document.getElementById(id).style.display = 'none';

    window.parseText = (text) => {
        if(!text) return "";
        return text.replace(/@(\w+)/g, '<a href="perfil.html?u=$1" class="mention">@$1</a>')
                   .replace(/#ref_(\w+)/g, '<span class="repost-link" onclick="window.goTo(\'$1\')">↗ VER ORIGINAL</span>');
    };

    window.goTo = (id) => {
        const el = document.getElementById(id);
        if(el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };

    function loadFeed() {
        onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc")), snap => {
            const feed = document.getElementById('feed');
            feed.innerHTML = "";
            snap.forEach(docSnap => {
                const p = docSnap.data();
                const pid = docSnap.id;
                const likes = Array.isArray(p.likes) ? p.likes : [];
                const isLiked = auth.currentUser ? likes.includes(auth.currentUser.uid) : false;

                const postDiv = document.createElement('div');
                postDiv.className = 'post';
                postDiv.id = pid;
                postDiv.innerHTML = `
                    <div class="post-head">
                        <div class="neon-avatar">${(p.authorName||"U").charAt(0).toUpperCase()}</div>
                        <div>
                            <b onclick="window.location.href='perfil.html?u=${p.authorHandle}'" style="cursor:pointer">${p.authorName}</b><br>
                            <small style="color:var(--primary); font-size:0.6rem;">@${p.authorHandle}</small>
                        </div>
                    </div>
                    <div class="post-content">${window.parseText(p.content)}</div>
                    <div class="post-actions">
                        <div class="action-info" onclick="window.prepComment('${pid}')">
                            <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 1 1-7.6-11.7 8.38 8.38 0 0 1 3.8.9L21 3z"></path></svg>
                            <span>${p.commentsCount || 0}</span>
                        </div>
                        <div class="action-info" onclick="window.repost('${pid}')">
                            <svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
                            <span>${p.repostsCount || 0}</span>
                        </div>
                        <div class="action-info ${isLiked ? 'active' : ''}" onclick="window.toggleLike('${pid}', ${isLiked})">
                            <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
                            <span>${likes.length}</span>
                        </div>
                    </div>
                    <div class="comment-box" id="comments-${pid}"></div>
                `;
                feed.appendChild(postDiv);
                loadComments(pid);
            });
        });
    }

    function loadComments(postId) {
        onSnapshot(query(collection(db, `posts/${postId}/comments`), orderBy("createdAt", "asc")), snap => {
            const box = document.getElementById(`comments-${postId}`);
            if(box) {
                box.innerHTML = "";
                snap.forEach(cDoc => {
                    const c = cDoc.data();
                    box.innerHTML += `<div class="comment"><b>@${c.handle}</b>: ${window.parseText(c.text)}</div>`;
                });
            }
        });
    }

    window.openPostModal = () => {
        document.getElementById('actionModal').style.display = 'flex';
        document.getElementById('modalTitle').innerText = "NOVA TRANSMISSÃO";
        document.getElementById('modalInput').value = "";
        document.getElementById('modalSubmit').onclick = async () => {
            const txt = document.getElementById('modalInput').value;
            if(!txt.trim() || !me) return;
            await addDoc(collection(db, "posts"), {
                uid: auth.currentUser.uid, authorName: me.name, authorHandle: me.handle,
                content: txt, likes: [], commentsCount: 0, repostsCount: 0, createdAt: serverTimestamp()
            });
            window.closeModal('actionModal');
        };
    };

    window.prepComment = (postId) => {
        document.getElementById('actionModal').style.display = 'flex';
        document.getElementById('modalTitle').innerText = "DECODIFICAR RESPOSTA";
        document.getElementById('modalInput').value = "";
        document.getElementById('modalSubmit').onclick = async () => {
            const txt = document.getElementById('modalInput').value;
            if(!txt.trim() || !me) return;
            const postRef = doc(db, "posts", postId);
            const postSnap = await getDoc(postRef);
            await addDoc(collection(db, `posts/${postId}/comments`), {
                uid: auth.currentUser.uid, handle: me.handle, text: txt, createdAt: serverTimestamp()
            });
            await updateDoc(postRef, { commentsCount: (postSnap.data().commentsCount || 0) + 1 });
            enviarSinalNotificacao(postSnap.data().uid, "respondeu à sua transmissão", "comment", postId);
            window.closeModal('actionModal');
        };
    };

    window.toggleLike = async (id, isLiked) => {
        const postRef = doc(db, "posts", id);
        const postSnap = await getDoc(postRef);
        await updateDoc(postRef, { likes: isLiked ? arrayRemove(auth.currentUser.uid) : arrayUnion(auth.currentUser.uid) });
        if(!isLiked) enviarSinalNotificacao(postSnap.data().uid, "curtiu sua transmissão", "like", id);
    };

   window.repost = async (id) => {
    const s = await getDoc(doc(db, "posts", id));
    if (!s.exists()) return;
    
    const p = s.data();
    
    // 1. Cria o novo post (a republicação)
    await addDoc(collection(db, "posts"), {
        uid: auth.currentUser.uid, 
        authorName: me.name, 
        authorHandle: me.handle,
        content: `🔄 Republicado de @${p.authorHandle}:\n"${p.content}"\n#ref_${id}`,
        likes: [], 
        commentsCount: 0, 
        repostsCount: 0, 
        createdAt: serverTimestamp()
    });

    // 2. Atualiza o contador no post ORIGINAL (Correção aqui)
    const atual = p.repostsCount || 0; // Se for undefined, vira 0
    await updateDoc(doc(db, "posts", id), { 
        repostsCount: atual + 1 
    });

    // 3. Envia a notificação
    enviarSinalNotificacao(p.uid, "republicou sua transmissão", "repost", id);
};
</script>
</body>
</html>
