<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLYON VOID</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --card-bg: #0a0a0a;
            --border: #111;
            --accent: #00f2ff;
            --text: #eee;
            --dim: #555;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            margin: 0; background: var(--bg); color: var(--text); 
            font-family: 'Inter', sans-serif; padding-bottom: 90px; 
            letter-spacing: -0.2px;
        }

        header { 
            padding: 15px 20px; display: flex; justify-content: center; align-items: center; 
            position: sticky; top: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); z-index: 1000;
            border-bottom: 1px solid var(--border);
        }
        .logo-k { font-weight: 300; font-size: 20px; letter-spacing: 5px; color: #fff; text-transform: uppercase; }

        #feed { max-width: 550px; margin: auto; }
        .post { padding: 25px 20px; border-bottom: 1px solid var(--border); position: relative; }
        
        .repost-label { font-size: 11px; color: #50fa7b; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; font-weight: 300; }

        .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer; }
        .avatar-circle {
            width: 40px; height: 40px; border-radius: 50%; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            display: flex; align-items: center; justify-content: center; 
            font-size: 18px; font-weight: 300; color: #fff;
            background: radial-gradient(circle, #111 0%, #000 100%);
            text-transform: uppercase;
        }

        .post-info b { display: block; font-size: 14px; font-weight: 600; color: #fff; }
        .post-info span { font-size: 12px; color: var(--dim); font-weight: 300; }

        .post-content { font-size: 15px; line-height: 1.6; font-weight: 300; color: #eee; white-space: pre-wrap; word-wrap: break-word; }

        .post-actions { display: flex; gap: 30px; margin-top: 20px; padding-top: 12px; }
        .action-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); cursor: pointer; transition: 0.2s; }
        .action-item svg { width: 18px; stroke: var(--dim); fill: none; stroke-width: 1.5; }
        
        .action-item.voted { color: #fff; }
        .action-item.voted svg { stroke: #fff; fill: rgba(255, 255, 255, 0.1); }
        .action-item.shared { color: #50fa7b; }
        .action-item.shared svg { stroke: #50fa7b; }

        .delete-btn {
            position: absolute; top: 25px; right: 20px;
            color: #ff4444; font-size: 10px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px; opacity: 0.4;
        }
        .delete-btn:hover { opacity: 1; }

        /* MODAIS */
        .modal { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); 
            z-index: 5000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px);
        }
        .modal-card { background: #080808; width: 90%; max-width: 420px; padding: 25px; border-radius: 20px; border: 1px solid #222; }
        textarea { width: 100%; height: 140px; background: #111; border: 1px solid #222; border-radius: 12px; color: #fff; padding: 12px; resize: none; font-family: inherit; margin-top: 15px; outline: none; font-size: 15px; font-weight: 300; }
        .btn-publish { width: 100%; background: #fff; color: #000; border: none; padding: 14px; border-radius: 30px; font-weight: 600; cursor: pointer; margin-top: 20px; }

        .fab { position: fixed; bottom: 90px; right: 20px; width: 56px; height: 56px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 999; }
        .fab svg { width: 24px; stroke: #000; stroke-width: 2.5; fill: none; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 75px; background: rgba(0,0,0,0.9); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-around; }
        .nav-link svg { width: 24px; stroke: var(--dim); fill: none; stroke-width: 1.5; }
        .nav-link.active svg { stroke: #fff; }
    </style>
</head>
<body>

<header><div class="logo-k">K</div></header>

<main id="feed"></main>

<div class="fab" id="openPostModal"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></div>

<div id="postModal" class="modal">
    <div class="modal-card">
        <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--dim);">NOVA TRANSMISSÃO<span onclick="closeModal('postModal')" style="cursor:pointer;">X</span></div>
        <textarea id="postText" placeholder="O que o vazio precisa ouvir?"></textarea>
        <button class="btn-publish" id="sendPost">TRANSMITIR</button>
    </div>
</div>

<div id="commentModal" class="modal">
    <div class="modal-card">
        <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--dim);">RESPONDER SINAL<span onclick="closeModal('commentModal')" style="cursor:pointer;">X</span></div>
        <textarea id="commentText" placeholder="Sua resposta para o vazio..."></textarea>
        <button class="btn-publish" id="btnReply">ENVIAR</button>
    </div>
</div>

<nav class="bottom-nav">
    <a href="index.html" class="nav-link active"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></a>
    <a href="notificacoes.html" class="nav-link"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path></svg></a>
    <a href="perfil.html" class="nav-link"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle></svg></a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, getDoc, updateDoc, increment, arrayUnion, arrayRemove, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", authDomain: "klyon-a97ba.firebaseapp.com", projectId: "klyon-a97ba" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let me = null;
    let currentPostId = null;

    onAuthStateChanged(auth, async user => {
        if (!user) return window.location.href = "login.html";
        const snap = await getDoc(doc(db, "users", user.uid));
        me = { id: user.uid, ...snap.data() };
        loadFeed();
    });

    function loadFeed() {
        const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
        onSnapshot(q, snap => {
            const feed = document.getElementById('feed');
            feed.innerHTML = "";
            snap.forEach(d => {
                const p = d.data();
                const postId = d.id;
                const isVoted = p.votesBy?.includes(me.id);
                const isShared = p.sharedBy?.includes(me.id);
                const isMine = p.uid === me.id || (p.isRepost && p.reposterId === me.id);
                
                const card = document.createElement('div');
                card.className = 'post';
                card.innerHTML = `
                    ${p.isRepost ? `<div class="repost-label">↺ republicado por ${p.repostedBy}</div>` : ''}
                    ${isMine ? `<div class="delete-btn" onclick="deletePost('${postId}')">excluir</div>` : ''}
                    
                    <div class="post-header" onclick="location.href='perfil.html?u=${p.authorHandle}'">
                        <div class="avatar-circle">${p.authorName[0]}</div>
                        <div class="post-info">
                            <b>${p.authorName}</b>
                            <span>@${p.authorHandle}</span>
                        </div>
                    </div>
                    <div class="post-content">${p.content}</div>
                    <div class="post-actions">
                        <div class="action-item ${isVoted ? 'voted' : ''}" onclick="toggleVote('${postId}', '${p.uid}', ${isVoted})">
                            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                            ${p.votesCount || 0}
                        </div>
                        <div class="action-item" onclick="openCommentModal('${postId}')">
                            <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                            ${p.commentsCount || 0}
                        </div>
                        <div class="action-item ${isShared ? 'shared' : ''}" onclick="handleRepost('${postId}', ${JSON.stringify(p).replace(/"/g, '&quot;')}, ${isShared})">
                            <svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
                            ${p.repostsCount || 0}
                        </div>
                    </div>
                `;
                feed.appendChild(card);
            });
        });
    }

    window.deletePost = async (id) => {
        if(confirm("Remover permanentemente?")) await deleteDoc(doc(db, "posts", id));
    };

    window.toggleVote = async (id, authorUid, voted) => {
        const pRef = doc(db, "posts", id);
        const uRef = doc(db, "users", authorUid);
        await updateDoc(pRef, { votesCount: increment(voted ? -1 : 1), votesBy: voted ? arrayRemove(me.id) : arrayUnion(me.id) });
        await updateDoc(uRef, { votos: increment(voted ? -1 : 1) });
    };

    window.handleRepost = async (id, originalPost, shared) => {
        if(shared) return;
        await updateDoc(doc(db, "posts", id), { repostsCount: increment(1), sharedBy: arrayUnion(me.id) });
        await addDoc(collection(db, "posts"), {
            ...originalPost, isRepost: true, repostedBy: me.name, reposterId: me.id,
            createdAt: serverTimestamp(), votesCount: 0, votesBy: [], commentsCount: 0, repostsCount: 0, sharedBy: []
        });
    };

    window.openCommentModal = (id) => { currentPostId = id; openModal('commentModal'); };
    document.getElementById('btnReply').onclick = async () => {
        const text = document.getElementById('commentText').value;
        if(!text.trim()) return;
        await updateDoc(doc(db, "posts", currentPostId), { commentsCount: increment(1) });
        closeModal('commentModal');
        document.getElementById('commentText').value = "";
    };

    window.openModal = (m) => document.getElementById(m).style.display = 'flex';
    window.closeModal = (m) => document.getElementById(m).style.display = 'none';
    document.getElementById('openPostModal').onclick = () => openModal('postModal');

    document.getElementById('sendPost').onclick = async () => {
        const content = document.getElementById('postText').value;
        if(!content.trim()) return;
        await addDoc(collection(db, "posts"), {
            uid: me.id, authorName: me.name, authorHandle: me.handle,
            content, createdAt: serverTimestamp(),
            votesCount: 0, votesBy: [], commentsCount: 0, repostsCount: 0, sharedBy: [], isRepost: false
        });
        closeModal('postModal');
        document.getElementById('postText').value = "";
    };
</script>
</body>
</html>
