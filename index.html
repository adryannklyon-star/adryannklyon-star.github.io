<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Klyon - Void</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000000; --card: #080808; --border: #1a1a1a; --text: #ffffff; --dim: #777; --accent: #00f2ff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding-bottom: 90px; }
        
        /* HEADER */
        header { 
            position: fixed; top: 0; width: 100%; height: 60px; 
            background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 0 20px; z-index: 1000; border-bottom: 1px solid var(--border);
        }
        .header-logo { letter-spacing: 8px; font-size: 14px; font-weight: 400; flex-grow: 1; text-align: center; margin-left: 40px; }
        .header-logo span { display: block; font-size: 8px; letter-spacing: 4px; color: var(--dim); margin-top: -2px; }

        /* POSTS */
        .container { max-width: 500px; margin: auto; padding-top: 80px; }
        .post { 
            background: var(--card); border: 1px solid var(--border); 
            border-radius: 20px; padding: 20px; margin: 0 15px 15px; 
        }
        .post-head { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; position: relative; }
        .avatar { 
            width: 40px; height: 40px; border-radius: 50%; border: 1px solid #333;
            display: flex; align-items: center; justify-content: center; font-size: 14px;
            background: radial-gradient(circle, #222 0%, #000 100%);
        }
        .post-time { font-size: 12px; color: var(--dim); position: absolute; left: 60px; top: 2px; }
        
        .post-content { font-size: 16px; line-height: 1.5; font-weight: 300; color: #eee; margin: 10px 0 20px; }

        .post-actions { display: flex; gap: 25px; color: var(--dim); border-top: 1px solid #111; padding-top: 15px; }
        .action { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
        .action svg { width: 18px; stroke: var(--dim); fill: none; stroke-width: 1.5; }
        .action:hover { color: #fff; }
        .action.active svg { stroke: var(--accent); }

        /* BOTÃO FLUTUANTE (FAB) */
        #fab { 
            position: fixed; bottom: 100px; right: 20px; 
            width: 56px; height: 56px; background: transparent; 
            border: 1px solid var(--accent); border-radius: 50%; 
            color: white; font-size: 30px; display: flex; align-items: center; 
            justify-content: center; cursor: pointer; box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
        }

        /* NAVBAR INFERIOR */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; height: 70px; 
            background: rgba(0,0,0,0.9); border-top: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-around; 
        }
        .nav-link svg { width: 24px; stroke: var(--dim); fill: none; stroke-width: 1.5; }
        .nav-link.active svg { stroke: var(--text); }
        .nav-link.active::after { content: ''; position: absolute; bottom: -10px; width: 4px; height: 4px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 5px var(--accent); }
        .nav-link { position: relative; display: flex; flex-direction: column; align-items: center; }

    </style>
</head>
<body>

<header>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    <div class="header-logo">K L Y O N <span>V O I D</span></div>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" style="filter: drop-shadow(0 0 3px #00f2ff);"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
</header>

<main class="container" id="feed">
    <div class="post">
        <div class="post-head">
            <div class="avatar">A</div>
            <span class="post-time">2m</span>
        </div>
        <div class="post-content">Acordei sem vontade de existir hoje.</div>
        <div class="post-actions">
            <div class="action"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg> 12</div>
            <div class="action"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 1 1-7.6-11.7 8.38 8.38 0 0 1 3.8.9L21 3z"></path></svg> 3</div>
            <div class="action"><svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg> 1</div>
        </div>
    </div>
</main>

<button id="fab">+</button>

<nav class="bottom-nav">
    <a href="index.html" class="nav-link active">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
    </a>
    <a href="#" class="nav-link">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    </a>
    <a href="#" class="nav-link">
        <svg viewBox="0 0 24 24" style="stroke: var(--accent);"><circle cx="12" cy="12" r="10"></circle></svg>
    </a>
    <a href="#" class="nav-link">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path></svg>
    </a>
    <a href="perfil.html" class="nav-link">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v8"></path></svg>
    </a>
</nav>

</body>
</html>
