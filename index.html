<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Klyon Social</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #ff00cc;
    --secondary: #3333ff;
    --accent: #7a00ff;
    --bg: #0b0b1a;
    --glass: rgba(255, 255, 255, 0.05);
  }

  body {
    margin: 0;
    padding-bottom: 80px; /* Espaço para a barra inferior */
    padding-top: 70px;    /* Espaço para o header */
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: white;
    overflow-x: hidden;
  }

  /* HEADER FIXO */
  header {
    position: fixed;
    top: 0; width: 100%;
    height: 60px;
    background: rgba(11, 11, 26, 0.8);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    z-index: 100;
  }

  header h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.2rem;
    margin: 0;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .container { max-width: 500px; margin: auto; padding: 15px; }

  /* COMPONENTES DE UI */
  .glass {
    background: var(--glass);
    padding: 15px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 15px;
  }

  button {
    width: 100%; padding: 12px; border-radius: 12px; border: none;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    color: white; font-weight: bold; cursor: pointer; transition: 0.2s;
  }

  input, textarea {
    width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.3); color: white; margin-bottom: 10px; box-sizing: border-box;
  }

  /* BARRA INFERIOR (ESTILO INSTAGRAM/THREADS) */
  .bottom-nav {
    position: fixed;
    bottom: 0; width: 100%;
    height: 65px;
    background: rgba(11, 11, 26, 0.95);
    backdrop-filter: blur(15px);
    display: flex;
    justify-content: space-around;
    align-items: center;
    border-top: 1px solid rgba(255,255,255,0.1);
    z-index: 100;
  }

  .nav-item {
    font-size: 24px;
    color: rgba(255,255,255,0.5);
    cursor: pointer;
    transition: 0.3s;
  }

  .nav-item.active { color: var(--primary); }

  /* FEED & POSTS */
  .post {
    background: rgba(255,255,255,0.03);
    padding: 15px; border-radius: 15px; margin-bottom: 15px;
    position: relative;
  }

  .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .post-header img { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--primary); }
  
  .btn-delete {
    position: absolute; top: 15px; right: 15px;
    background: none; border: none; color: #ff4444; font-size: 18px; width: auto;
  }

  .actions { display: flex; gap: 20px; margin-top: 15px; font-size: 0.9rem; }
  .action-btn { cursor: pointer; display: flex; align-items: center; gap: 5px; }

  /* SEÇÕES */
  .section { display: none; }
  .section.active { display: block; }

</style>
</head>
<body>

<header>
  <h1>KLYON ⚡</h1>
</header>

<div class="container">
  
  <div id="loginSection" class="glass" style="text-align: center; margin-top: 50px;">
    <h2>Bem-vindo ao Futuro</h2>
    <p>Conecte-se para explorar o que está acontecendo.</p>
    <button id="loginBtn">Entrar com Google</button>
  </div>

  <div id="feedSection" class="section">
    <div class="glass">
      <textarea id="postInput" placeholder="No que você está pensando?"></textarea>
      <button id="postBtn">Publicar</button>
    </div>
    <div id="feed"></div>
  </div>

  <div id="profileSection" class="section">
    <div class="glass">
      <h3>Editar Perfil</h3>
      <input id="nameInput" placeholder="Nome de exibição">
      <textarea id="bioInput" placeholder="Sua biografia..."></textarea>
      <button id="saveProfileBtn">Salvar Alterações</button>
      <button id="logoutBtn" style="background: none; border: 1px solid #333; margin-top: 20px;">Sair da Conta</button>
    </div>
  </div>

</div>

<nav class="bottom-nav" id="bottomNav" style="display: none;">
  <div class="nav-item active" onclick="showSection('feedSection', this)">🏠</div>
  <div class="nav-item" onclick="showSection('profileSection', this)">👤</div>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, deleteDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334",
  authDomain: "klyon-a97ba.firebaseapp.com",
  projectId: "klyon-a97ba"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

// NAVEGAÇÃO DE TABS
window.showSection = (id, el) => {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  el.classList.add('active');
};

// LOGIN / AUTH
document.getElementById("loginBtn").onclick = () => signInWithPopup(auth, provider);
document.getElementById("logoutBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, async (user) => {
  const loginSec = document.getElementById("loginSection");
  const nav = document.getElementById("bottomNav");
  
  if (user) {
    loginSec.style.display = "none";
    nav.style.display = "flex";
    showSection('feedSection', document.querySelector('.nav-item'));
    
    // Carregar dados perfil
    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists()) {
      document.getElementById("nameInput").value = snap.data().name || "";
      document.getElementById("bioInput").value = snap.data().bio || "";
    }
  } else {
    loginSec.style.display = "block";
    nav.style.display = "none";
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  }
});

// SALVAR PERFIL
document.getElementById("saveProfileBtn").onclick = async () => {
  const user = auth.currentUser;
  await setDoc(doc(db, "users", user.uid), {
    name: document.getElementById("nameInput").value,
    bio: document.getElementById("bioInput").value
  }, { merge: true });
  alert("Perfil atualizado!");
};

// POSTAR
document.getElementById("postBtn").onclick = async () => {
  const user = auth.currentUser;
  const text = document.getElementById("postInput").value;
  if (!text.trim()) return;

  await addDoc(collection(db, "posts"), {
    uid: user.uid,
    text: text,
    userName: document.getElementById("nameInput").value || user.displayName,
    userPhoto: user.photoURL,
    likes: 0,
    createdAt: serverTimestamp()
  });
  document.getElementById("postInput").value = "";
};

// FEED EM TEMPO REAL
const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
onSnapshot(q, (snapshot) => {
  const feed = document.getElementById("feed");
  feed.innerHTML = "";
  
  snapshot.forEach((postDoc) => {
    const post = postDoc.data();
    const isOwner = auth.currentUser && auth.currentUser.uid === post.uid;
    
    const postEl = document.createElement("div");
    postEl.className = "post";
    postEl.innerHTML = `
      <div class="post-header">
        <img src="${post.userPhoto}">
        <b>${post.userName}</b>
      </div>
      ${isOwner ? `<button class="btn-delete" onclick="deletePost('${postDoc.id}')">🗑️</button>` : ''}
      <p>${post.text}</p>
      <div class="actions">
        <div class="action-btn" onclick="likePost('${postDoc.id}')">❤️ <span>${post.likes || 0}</span></div>
        <div class="action-btn">💬 Comentar</div>
      </div>
    `;
    feed.appendChild(postEl);
  });
});

// FUNÇÕES DE AÇÃO (LIKES E DELETE)
window.likePost = async (id) => {
  const postRef = doc(db, "posts", id);
  await updateDoc(postRef, { likes: increment(1) });
};

window.deletePost = async (id) => {
  if (confirm("Deseja excluir este post?")) {
    await deleteDoc(doc(db, "posts", id));
  }
};

</script>
</body>
</html>
