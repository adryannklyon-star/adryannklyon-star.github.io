<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLYON | Buscar</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Reutilize os estilos do index ou use um arquivo CSS */
        body { background: #030307; color: white; padding: 20px; font-family: sans-serif; }
        .search-box { width: 100%; padding: 15px; border-radius: 12px; background: #111; border: 1px solid #333; color: white; }
        .user-card { display: flex; align-items: center; gap: 15px; padding: 15px; background: #111; border-radius: 15px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <input type="text" id="search" class="search-box" placeholder="Buscar handle ou nome...">
    <div id="results"></div>

    <nav class="bottom-nav"> </nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { /* SEU CONFIG */ };
    const db = getFirestore(initializeApp(firebaseConfig));

    document.getElementById('search').oninput = async (e) => {
        const val = e.target.value.toLowerCase();
        if(val.length < 2) return;

        const q = query(collection(db, "users"), where("handle", ">=", val), where("handle", "<=", val + "\uf8ff"));
        const snap = await getDocs(q);
        const res = document.getElementById('results');
        res.innerHTML = "";
        snap.forEach(d => {
            const u = d.data();
            res.innerHTML += `
                <div class="user-card" onclick="location.href='perfil.html?uid=${d.id}'">
                    <img src="${u.photo}" style="width:50px; height:50px; border-radius:15px;">
                    <div><b>${u.name}</b><br><small>@${u.handle}</small></div>
                </div>`;
        });
    };
</script>
</body>
</html>
