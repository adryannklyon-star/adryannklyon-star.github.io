<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLYON | Buscar</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --bg: #030307; --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at 50% 0%, #0f172a 0%, #030307 100%); min-height: 100vh; }
        .container { max-width: 550px; margin: auto; padding: 30px 15px 120px; }
        .search-box { width: 100%; padding: 18px; border-radius: 20px; background: var(--glass); border: 1px solid var(--glass-border); color: #fff; font-size: 1rem; outline: none; margin-bottom: 25px; }
        .user-card { display: flex; align-items: center; gap: 15px; padding: 15px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 20px; margin-bottom: 12px; cursor: pointer; }
        .user-card img { width: 50px; height: 50px; border-radius: 15px; border: 1px solid var(--primary); object-fit: cover; }
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; height: 65px; background: rgba(15, 23, 42, 0.9); border-radius: 25px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-around; z-index: 1000; }
        .nav-link { opacity: 0.4; }
        .nav-link.active { opacity: 1; filter: drop-shadow(0 0 8px var(--primary)); }
        .nav-link img { width: 24px; filter: invert(1); }
    </style>
</head>
<body>
<div class="container">
    <input type="text" id="searchIn" class="search-box" placeholder="Pesquisar @handle...">
    <div id="results"></div>
</div>
<style>
    .bottom-nav { 
        position: fixed; 
        bottom: 20px; 
        left: 50%; 
        transform: translateX(-50%); 
        width: 94%; 
        max-width: 480px; 
        height: 70px; 
        background: rgba(15, 23, 42, 0.9); 
        backdrop-filter: blur(20px); 
        border-radius: 28px; 
        border: 1px solid var(--glass-border); 
        display: flex; 
        align-items: center; 
        justify-content: space-around; 
        z-index: 1000; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    
    .nav-link { 
        position: relative; 
        display: flex; 
        align-items: center; 
        justify-content: center;
        width: 50px;
        height: 50px;
    }

    .nav-link img { 
        width: 24px; 
        height: 24px;
        filter: invert(1); 
        opacity: 0.4; 
        transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    }

    /* Efeito de brilho no ícone ativo */
    .nav-link.active img { 
        opacity: 1; 
        filter: drop-shadow(0 0 8px var(--primary)) invert(1); 
        transform: scale(1.1);
    }

    /* Badge de Notificação (Sino) */
    .notif-badge { 
        position: absolute; 
        top: 10px; 
        right: 10px; 
        width: 8px; 
        height: 8px; 
        background: #ff2d55; 
        border-radius: 50%; 
        border: 2px solid #0f172a; 
        display: none; 
    }
</style>

<nav class="bottom-nav">
    <a href="index.html" class="nav-link" id="nav-home">
        <img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png" alt="Home">
    </a>

    <a href="buscar.html" class="nav-link" id="nav-search">
        <img src="https://cdn-icons-png.flaticon.com/512/149/149852.png" alt="Buscar">
    </a>

    <a href="notificacoes.html" class="nav-link" id="nav-notif">
        <img src="https://cdn-icons-png.flaticon.com/512/3602/3602145.png" alt="Notificações">
        <div id="notifBadge" class="notif-badge"></div>
    </a>

    <a href="perfil.html" class="nav-link" id="nav-profile">
        <img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png" alt="Perfil">
    </a>

    <a href="configuracoes.html" class="nav-link" id="nav-settings">
        <img src="https://cdn-icons-png.flaticon.com/512/2040/2040504.png" alt="Configurações">
    </a>
</nav>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, limit } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";
    const firebaseConfig = { apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", authDomain: "klyon-a97ba.firebaseapp.com", projectId: "klyon-a97ba", storageBucket: "klyon-a97ba.appspot.com" };
    const db = getFirestore(initializeApp(firebaseConfig));
    document.getElementById('searchIn').oninput = async (e) => {
        const v = e.target.value.toLowerCase();
        if(v.length < 2) return;
        const q = query(collection(db, "users"), where("handle", ">=", v), where("handle", "<=", v + "\uf8ff"), limit(8));
        const s = await getDocs(q);
        const r = document.getElementById('results'); r.innerHTML = "";
        s.forEach(d => {
            const u = d.data();
            r.innerHTML += `<div class="user-card" onclick="location.href='perfil.html?uid=${d.id}'"><img src="${u.photo}"><div><b>${u.name}</b><br><small style="color:var(--primary)">@${u.handle}</small></div></div>`;
        });
    };
</script>
</body>
</html>
