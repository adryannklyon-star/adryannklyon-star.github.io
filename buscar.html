<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Klyon - Buscar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #000; 
            --card: #0a0a0a; 
            --border: #1a1a1a; 
            --accent: #00f2ff; 
            --text-dim: #666;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; background: var(--bg); color: #fff; 
            font-family: 'Inter', sans-serif; padding-bottom: 90px; 
        }

        /* HEADER PADRÃO */
        header { 
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(20px); z-index: 1000;
            border-bottom: 1px solid var(--border);
        }
        .logo-area { display: flex; flex-direction: column; align-items: center; position: absolute; left: 50%; transform: translateX(-50%); }
        .logo-k { font-family: 'Orbitron'; font-size: 16px; letter-spacing: 4px; color: #fff; }
        .logo-void { font-size: 7px; letter-spacing: 6px; color: var(--accent); margin-top: -2px; }

        .container { max-width: 500px; margin: auto; padding: 20px 15px; }

        /* BARRA DE PESQUISA MINIMALISTA */
        .search-box { 
            width: 100%; padding: 16px 20px; border-radius: 30px; 
            background: var(--card); border: 1px solid var(--border); 
            color: #fff; font-size: 15px; outline: none; margin-bottom: 25px;
            transition: 0.3s;
        }
        .search-box:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(0, 242, 255, 0.1); }

        /* CARD DE USUÁRIO ENCONTRADO */
        .user-card { 
            display: flex; align-items: center; gap: 15px; padding: 15px; 
            background: var(--card); border: 1px solid var(--border); 
            border-radius: 20px; margin-bottom: 12px; cursor: pointer;
            transition: 0.2s;
        }
        .user-card:active { transform: scale(0.98); background: #111; }

        /* AVATAR COM INICIAL */
        .user-avatar { 
            width: 45px; height: 45px; border-radius: 50%; 
            background: #000; border: 1px solid #333;
            display: flex; align-items: center; justify-content: center;
            font-weight: 500; font-size: 16px; color: #fff; flex-shrink: 0;
            text-transform: uppercase;
        }

        .user-info b { display: block; font-size: 14px; font-weight: 600; margin-bottom: 2px; }
        .user-info small { color: var(--accent); font-size: 12px; opacity: 0.8; }

        /* NAV INFERIOR PADRONIZADA */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; height: 75px; 
            background: #000; border-top: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-around;
            z-index: 1000;
        }
        .nav-link svg { width: 24px; stroke: var(--text-dim); fill: none; stroke-width: 1.5; }
        .nav-link.active svg { stroke: var(--accent); }
    </style>
</head>
<body>

<header>
    <div onclick="history.back()" style="cursor:pointer;"><svg width="24" height="24" viewBox="0 0 24 24" stroke="#fff" stroke-width="2" fill="none"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></div>
    <div class="logo-area">
        <div class="logo-k">K L Y O N</div>
        <div class="logo-void">V O I D</div>
    </div>
    <div style="width:24px"></div>
</header>

<div class="container">
    <input type="text" id="searchIn" class="search-box" placeholder="Procurar no vazio...">
    <div id="results"></div>
</div>

<nav class="bottom-nav">
    <a href="index.html" class="nav-link"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></a>
    <a href="buscar.html" class="nav-link active"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></a>
    <a href="notificacoes.html" class="nav-link"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path></svg></a>
    <a href="perfil.html" class="nav-link"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle></svg></a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, limit } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", 
        authDomain: "klyon-a97ba.firebaseapp.com", 
        projectId: "klyon-a97ba" 
    };
    
    const db = getFirestore(initializeApp(firebaseConfig));

    document.getElementById('searchIn').oninput = async (e) => {
        const v = e.target.value.toLowerCase().trim();
        const r = document.getElementById('results');
        
        if(v.length < 2) {
            r.innerHTML = "";
            return;
        }

        // Busca por handle que comece com o texto digitado
        const q = query(
            collection(db, "users"), 
            where("handle", ">=", v), 
            where("handle", "<=", v + "\uf8ff"), 
            limit(10)
        );

        const s = await getDocs(q);
        r.innerHTML = "";

        if(s.empty) {
            r.innerHTML = "<p style='text-align:center; opacity:0.3; font-size:13px; margin-top:20px;'>Ninguém encontrado.</p>";
            return;
        }

        s.forEach(d => {
            const u = d.data();
            const initial = u.name ? u.name[0].toUpperCase() : "?";
            
            r.innerHTML += `
                <div class="user-card" onclick="location.href='perfil.html?id=${d.id}'">
                    <div class="user-avatar">${initial}</div>
                    <div class="user-info">
                        <b>${u.name}</b>
                        <small>@${u.handle}</small>
                    </div>
                </div>`;
        });
    };
</script>
</body>
</html>
