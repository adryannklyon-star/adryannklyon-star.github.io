<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Klyon - Sistema</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #000; 
            --card: #0a0a0a; 
            --border: #1a1a1a; 
            --accent: #00f2ff; 
            --danger: #ff2d55;
            --text-dim: #666;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            margin: 0; background: var(--bg); color: #fff; 
            font-family: 'Inter', sans-serif; padding-bottom: 100px; 
            background-image: radial-gradient(circle at 50% -20%, #111 0%, #000 100%);
        }

        /* HEADER SISTEMA */
        header { 
            padding: 20px; display: flex; align-items: center; 
            position: sticky; top: 0; background: rgba(0,0,0,0.8); 
            backdrop-filter: blur(20px); z-index: 1000; border-bottom: 1px solid var(--border);
        }
        .header-title { flex-grow: 1; text-align: center; font-family: 'Orbitron'; font-size: 12px; letter-spacing: 4px; color: var(--accent); }

        .container { max-width: 500px; margin: auto; padding: 20px; }

        /* SEÇÕES DE CONFIGURAÇÃO */
        .config-group { margin-bottom: 30px; }
        .group-label { 
            font-size: 10px; font-family: 'Orbitron'; color: var(--text-dim); 
            margin-bottom: 12px; margin-left: 10px; letter-spacing: 2px;
        }

        .glass-card { 
            background: var(--card); border: 1px solid var(--border); 
            border-radius: 24px; overflow: hidden;
        }

        .input-row { 
            padding: 20px; border-bottom: 1px solid var(--border); 
            display: flex; flex-direction: column; gap: 8px;
        }
        .input-row:last-child { border-bottom: none; }
        
        .input-row label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        
        .input-row input, .input-row textarea { 
            background: transparent; border: none; color: #fff; 
            font-family: 'Inter', sans-serif; font-size: 15px; width: 100%;
            padding: 5px 0;
        }
        .input-row input::placeholder { color: #333; }

        /* BOTÕES */
        .btn-action { 
            width: 100%; padding: 18px; border-radius: 20px; border: none;
            font-family: 'Orbitron'; font-size: 11px; font-weight: 700; 
            cursor: pointer; transition: 0.3s; margin-top: 15px; letter-spacing: 2px;
        }
        .btn-save { background: #fff; color: #000; box-shadow: 0 0 20px rgba(255,255,255,0.1); }
        .btn-save:active { transform: scale(0.98); background: var(--accent); }

        .list-item { 
            padding: 18px 20px; display: flex; align-items: center; 
            justify-content: space-between; cursor: pointer; transition: 0.2s;
        }
        .list-item:active { background: #111; }
        .list-item span { font-size: 14px; font-weight: 400; color: #eee; }
        .list-item.danger span { color: var(--danger); }

        .version-info { 
            text-align: center; margin-top: 40px; font-size: 9px; 
            font-family: 'Orbitron'; color: #222; letter-spacing: 5px;
        }

        /* NAV INFERIOR PADRÃO */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; height: 75px; 
            background: #000; border-top: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-around; z-index: 1000;
        }
        .nav-link svg { width: 24px; stroke: var(--text-dim); fill: none; stroke-width: 1.5; }
        .nav-link.active svg { stroke: var(--accent); }
    </style>
</head>
<body>

<header>
    <div onclick="history.back()" style="cursor:pointer;"><svg width="24" height="24" viewBox="0 0 24 24" stroke="#fff" stroke-width="2" fill="none"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></div>
    <div class="header-title">AJUSTES DE NÚCLEO</div>
    <div style="width:24px"></div>
</header>

<main class="container">
    
    <div class="config-group">
        <div class="group-label">IDENTIDADE</div>
        <div class="glass-card">
            <div class="input-row">
                <label>Nome Visível</label>
                <input type="text" id="confName" placeholder="Como você é chamado?">
            </div>
            <div class="input-row">
                <label>Frequência (@handle)</label>
                <input type="text" id="confHandle" placeholder="seu_nome">
            </div>
            <div class="input-row">
                <label>Manifesto (Bio)</label>
                <textarea id="confBio" rows="3" placeholder="O que ecoa de você?"></textarea>
            </div>
        </div>
        <button class="btn-action btn-save" id="btnSave" onclick="updateAccount()">SINCRONIZAR PERFIL</button>
    </div>

    <div class="config-group">
        <div class="group-label">SISTEMA</div>
        <div class="glass-card">
            <div class="list-item" onclick="logout()">
                <span>Desconectar Transmissão</span>
                <svg width="18" height="18" viewBox="0 0 24 24" stroke="#444" fill="none" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
            </div>
            <div class="list-item danger" onclick="deleteAccount()">
                <span>Apagar Existência</span>
                <svg width="18" height="18" viewBox="0 0 24 24" stroke="var(--danger)" fill="none" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </div>
        </div>
    </div>

    <div class="version-info">KLYON VOID CORE v3.0.0</div>
</main>

<nav class="bottom-nav">
    <a href="index.html" class="nav-link"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></a>
    <a href="buscar.html" class="nav-link"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></a>
    <a href="notificacoes.html" class="nav-link"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path></svg></a>
    <a href="perfil.html" class="nav-link active"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle></svg></a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut, deleteUser } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc, collection, query, where, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", 
        authDomain: "klyon-a97ba.firebaseapp.com", 
        projectId: "klyon-a97ba" 
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let userData = null;

    onAuthStateChanged(auth, async user => {
        if (!user) return window.location.href = "login.html";
        const snap = await getDoc(doc(db, "users", user.uid));
        if (snap.exists()) {
            userData = snap.data();
            document.getElementById('confName').value = userData.name || "";
            document.getElementById('confHandle').value = userData.handle || "";
            document.getElementById('confBio').value = userData.bio || "";
        }
    });

    window.updateAccount = async () => {
        const btn = document.getElementById('btnSave');
        const newName = document.getElementById('confName').value.trim();
        const newHandle = document.getElementById('confHandle').value.toLowerCase().replace(/\s/g, '');
        const newBio = document.getElementById('confBio').value;
        
        if(!newName || !newHandle) return alert("Identidade incompleta.");

        btn.disabled = true; 
        btn.innerText = "SINCRONIZANDO...";

        try {
            if(newHandle !== userData.handle) {
                const q = query(collection(db, "users"), where("handle", "==", newHandle));
                const check = await getDocs(q);
                if(!check.empty) {
                    alert("Esta frequência (@handle) já está ocupada.");
                    btn.disabled = false; btn.innerText = "SINCRONIZAR PERFIL";
                    return;
                }
            }

            await updateDoc(doc(db, "users", auth.currentUser.uid), {
                name: newName, handle: newHandle, bio: newBio
            });

            alert("Núcleo atualizado!");
            window.location.href = "perfil.html";

        } catch (e) {
            btn.disabled = false; btn.innerText = "SINCRONIZAR PERFIL";
            alert("Falha na sincronização.");
        }
    };

    window.logout = () => signOut(auth).then(() => window.location.href = "login.html");

    window.deleteAccount = async () => {
        const confirmar = confirm("Isso apagará sua existência no vazio permanentemente. Confirmar?");
        if(!confirmar) return;

        const uid = auth.currentUser.uid;
        const batch = writeBatch(db);

        try {
            const qPosts = query(collection(db, "posts"), where("uid", "==", uid));
            const postsSnap = await getDocs(qPosts);
            postsSnap.forEach(d => batch.delete(d.ref));
            batch.delete(doc(db, "users", uid));
            await batch.commit();
            await deleteUser(auth.currentUser);
            window.location.href = "login.html";
        } catch (e) {
            alert("Ação sensível. Por favor, faça login novamente e tente deletar.");
        }
    };
</script>
</body>
</html>
