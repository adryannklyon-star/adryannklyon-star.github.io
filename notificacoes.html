<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLYON | Alertas</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --bg: #030307; --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at 50% 0%, #0f172a 0%, #030307 100%); min-height: 100vh; }
        .container { max-width: 550px; margin: auto; padding: 40px 15px 120px; }
        .header-back { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; cursor: pointer; color: var(--primary); font-family: 'Orbitron'; font-size: 0.8rem; }
        .notif-card { background: var(--glass); border: 1px solid var(--glass-border); padding: 15px; border-radius: 18px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; border-left: 4px solid var(--primary); animation: slideIn 0.3s ease; }
        .notif-card.read { border-left-color: transparent; opacity: 0.6; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>
<div class="container">
    <div class="header-back" onclick="location.href='index.html'">⬅ VOLTAR AO FEED</div>
    <h2 style="font-family:'Orbitron'; font-size: 1.2rem; margin-bottom: 20px;">NOTIFICAÇÕES</h2>
    <div id="notifList">Carregando alertas...</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", authDomain: "klyon-a97ba.firebaseapp.com", projectId: "klyon-a97ba", storageBucket: "klyon-a97ba.appspot.com" };
    const db = getFirestore(initializeApp(firebaseConfig));
    const auth = getAuth();

    onAuthStateChanged(auth, user => {
        if (!user) return;
        // Busca notificações sem orderBy para evitar erro de índice
        onSnapshot(query(collection(db, "notifications"), where("to", "==", user.uid)), s => {
            const list = document.getElementById('notifList');
            list.innerHTML = s.empty ? "Nenhuma novidade por aqui." : "";
            
            let all = [];
            s.forEach(d => all.push({id: d.id, ...d.data()}));
            all.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

            all.forEach(async n => {
                list.innerHTML += `<div class="notif-card ${n.read ? 'read' : ''}"><div>${n.text}</div></div>`;
                if(!n.read) await updateDoc(doc(db, "notifications", n.id), { read: true });
            });
        });
    });
</script>
</body>
</html>
