<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificações | KLYON</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --bg: #030307; --glass: rgba(255, 255, 255, 0.05); }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans'; padding-bottom: 100px; }
        header { height: 60px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .container { max-width: 500px; margin: auto; padding: 20px; }
        .notif-card { background: var(--glass); padding: 15px; border-radius: 15px; margin-bottom: 10px; border-left: 4px solid transparent; cursor: pointer; transition: 0.3s; }
        .notif-card.unread { border-left-color: var(--primary); background: rgba(0, 242, 255, 0.05); }
        .notif-card b { color: var(--primary); font-family: 'Orbitron'; font-size: 0.8rem; }
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 94%; max-width: 480px; height: 70px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border-radius: 28px; display: flex; align-items: center; justify-content: space-around; }
        .nav-link img { width: 22px; filter: invert(1); opacity: 0.4; }
        .active img { opacity: 1; filter: drop-shadow(0 0 8px var(--primary)) invert(1); }
    </style>
</head>
<body>

<header><div style="font-family:'Orbitron'; color:var(--primary)">ALERTAS</div></header>

<div class="container" id="notif-list"></div>

<nav class="bottom-nav">
    <a href="index.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png"></a>
    <a href="notificacoes.html" class="nav-link active"><img src="https://cdn-icons-png.flaticon.com/512/3602/3602145.png"></a>
    <a href="perfil.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png"></a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, collection, query, where, orderBy, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", authDomain: "klyon-a97ba.firebaseapp.com", projectId: "klyon-a97ba" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, user => {
        if (!user) return;
        const q = query(collection(db, "notifications"), where("to", "==", user.uid), orderBy("createdAt", "desc"));
        onSnapshot(q, snap => {
            const list = document.getElementById('notif-list');
            list.innerHTML = "";
            snap.forEach(docSnap => {
                const n = docSnap.data();
                const card = document.createElement('div');
                card.className = `notif-card ${n.read ? '' : 'unread'}`;
                card.innerHTML = `<b>@${n.fromHandle}</b> ${n.text}`;
                
                card.onclick = async () => {
                    await updateDoc(doc(db, "notifications", docSnap.id), { read: true });
                    if(n.postId) window.location.href = `index.html?post=${n.postId}`;
                };
                
                list.appendChild(card);
            });
        });
    });
</script>
</body>
</html>
