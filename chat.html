<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mensagens | KLYON</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --bg: #030307; --glass: rgba(255, 255, 255, 0.05); }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans'; height: 100vh; display: flex; flex-direction: column; }
        
        header { height: 60px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
        .back-btn { background: none; border: none; color: var(--primary); font-family: 'Orbitron'; cursor: pointer; margin-right: 15px; }
        
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 0.9rem; line-height: 1.4; position: relative; }
        .msg.sent { align-self: flex-end; background: var(--primary); color: #000; border-bottom-right-radius: 4px; font-weight: 600; }
        .msg.received { align-self: flex-start; background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-bottom-left-radius: 4px; }

        .input-area { padding: 20px; background: rgba(15, 23, 42, 0.9); border-top: 1px solid rgba(255,255,255,0.1); display: flex; gap: 10px; }
        input { flex: 1; background: var(--glass); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 12px; color: #fff; outline: none; }
        input:focus { border-color: var(--primary); }
        .send-btn { background: var(--primary); border: none; width: 45px; height: 45px; border-radius: 12px; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px var(--primary); }
    </style>
</head>
<body>

<header>
    <button class="back-btn" onclick="history.back()"><</button>
    <div id="chat-with" style="font-family:'Orbitron'; font-size: 0.8rem; color: var(--primary);">CONEXÃO...</div>
</header>

<div id="chat-window"></div>

<div class="input-area">
    <input type="text" id="msg-input" placeholder="Transmitir mensagem..." autocomplete="off">
    <button class="send-btn" id="send-msg">></button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", authDomain: "klyon-a97ba.firebaseapp.com", projectId: "klyon-a97ba" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const otherUid = urlParams.get('id'); // ID do usuário com quem você vai falar

    onAuthStateChanged(auth, async user => {
        if (!user || !otherUid) return;

        // Puxa o nome de quem você está conversando
        const otherSnap = await getDoc(doc(db, "users", otherUid));
        if(otherSnap.exists()) document.getElementById('chat-with').innerText = `@${otherSnap.data().handle}`.toUpperCase();

        // Gera um ID de chat único baseado nos dois UIDs (ordem alfabética para ser sempre o mesmo ID)
        const chatId = [user.uid, otherUid].sort().join('_');

        // Escuta mensagens em tempo real
        const q = query(collection(db, `chats/${chatId}/messages`), orderBy("createdAt", "asc"));
        onSnapshot(q, snap => {
            const win = document.getElementById('chat-window');
            win.innerHTML = "";
            snap.forEach(d => {
                const m = d.data();
                const div = document.createElement('div');
                div.className = `msg ${m.senderId === user.uid ? 'sent' : 'received'}`;
                div.innerText = m.text;
                win.appendChild(div);
            });
            win.scrollTop = win.scrollHeight; // Rola para o fim
        });

        // Enviar Mensagem
        const sendBtn = document.getElementById('send-msg');
        const input = document.getElementById('msg-input');

        const sendMessage = async () => {
            if(!input.value.trim()) return;
            const text = input.value;
            input.value = "";
            await addDoc(collection(db, `chats/${chatId}/messages`), {
                text: text,
                senderId: user.uid,
                createdAt: serverTimestamp()
            });
        };

        sendBtn.onclick = sendMessage;
        input.onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };
    });
</script>
</body>
</html>
