<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Klyon - Direct</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #000; 
            --card: #0a0a0a; 
            --border: #1a1a1a; 
            --accent: #00f2ff; 
            --text-dim: #666;
            --msg-sent: #fff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; 
            overflow: hidden; 
        }

        /* HEADER ESTRUTURAL */
        header { 
            height: 65px; display: flex; align-items: center; padding: 0 15px; 
            background: rgba(0,0,0,0.8); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border); z-index: 100;
        }
        .header-title { flex: 1; text-align: center; font-family: 'Orbitron'; font-size: 11px; letter-spacing: 3px; color: var(--accent); }

        /* LISTA DE CONVERSAS (INBOX) */
        #inbox-view { height: 100%; display: flex; flex-direction: column; }
        .search-area { padding: 15px; }
        .search-bar { 
            width: 100%; background: var(--card); border: 1px solid var(--border); 
            border-radius: 12px; padding: 12px 15px; color: #fff; font-size: 14px;
        }

        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item { 
            display: flex; align-items: center; padding: 15px 20px; 
            border-bottom: 1px solid #080808; cursor: pointer; transition: 0.2s;
        }
        .chat-item:active { background: #111; }
        .avatar { 
            width: 45px; height: 45px; border-radius: 50%; background: #111; 
            border: 1px solid #222; display: flex; align-items: center; justify-content: center;
            font-weight: 600; color: #fff; margin-right: 15px; flex-shrink: 0;
        }
        .chat-info b { display: block; font-size: 14px; margin-bottom: 2px; }
        .chat-info span { font-size: 12px; color: var(--text-dim); }

        /* JANELA DE CHAT ATIVO */
        #chat-view { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--bg); display: none; flex-direction: column; z-index: 200;
        }
        .messages-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        
        /* BOLHAS DE MENSAGEM */
        .msg { max-width: 75%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.4; }
        .msg.sent { 
            align-self: flex-end; background: var(--msg-sent); color: #000; 
            border-bottom-right-radius: 4px; font-weight: 500;
        }
        .msg.received { 
            align-self: flex-start; background: var(--card); color: #fff; 
            border: 1px solid var(--border); border-bottom-left-radius: 4px; 
        }

        /* ÁREA DE INPUT */
        .input-area { 
            padding: 15px; border-top: 1px solid var(--border); 
            display: flex; gap: 10px; align-items: center; background: #000;
            padding-bottom: calc(15px + env(safe-area-inset-bottom));
        }
        .input-area input { 
            flex: 1; background: var(--card); border: 1px solid var(--border); 
            border-radius: 25px; padding: 12px 20px; color: #fff; font-size: 15px;
        }
        .btn-send { 
            background: var(--accent); border: none; width: 45px; height: 45px; 
            border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

<div id="inbox-view">
    <header>
        <div onclick="location.href='index.html'" style="cursor:pointer;"><svg width="24" height="24" viewBox="0 0 24 24" stroke="#fff" stroke-width="2" fill="none"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></div>
        <div class="header-title">MENSAGENS</div>
        <div style="width:24px"></div>
    </header>
    
    <div class="search-area">
        <input type="text" id="user-search" class="search-bar" placeholder="Buscar frequência...">
    </div>
    
    <div id="contacts-list" class="chat-list">
        </div>
</div>

<div id="chat-view">
    <header>
        <div onclick="closeChat()" style="cursor:pointer;"><svg width="24" height="24" viewBox="0 0 24 24" stroke="#fff" stroke-width="2" fill="none"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></div>
        <div id="chat-target-name" class="header-title">USUÁRIO</div>
        <div style="width:24px"></div>
    </header>

    <div id="chat-window" class="messages-container"></div>

    <div class="input-area">
        <input type="text" id="msg-input" placeholder="Enviar sinal..." autocomplete="off">
        <button class="btn-send" id="send-msg">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#000"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, getDoc, getDocs, where, limit, setDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", 
        authDomain: "klyon-a97ba.firebaseapp.com", 
        projectId: "klyon-a97ba" 
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let myUid, unsubMessages, unsubRecent;

    onAuthStateChanged(auth, user => {
        if (!user) return window.location.href = "login.html";
        myUid = user.uid;
        
        const urlParams = new URLSearchParams(window.location.search);
        const startChatId = urlParams.get('id');
        
        if (startChatId) openChat(startChatId);
        loadRecentChats();
    });

    // LISTAR CONVERSAS RECENTES
    function loadRecentChats() {
        const list = document.getElementById('contacts-list');
        const qRecent = query(collection(db, `users/${myUid}/recent_chats`), orderBy("lastTime", "desc"));
        
        if(unsubRecent) unsubRecent();
        unsubRecent = onSnapshot(qRecent, snap => {
            list.innerHTML = "";
            if(snap.empty) {
                list.innerHTML = "<p style='text-align:center; opacity:0.2; font-size:13px; margin-top:40px;'>O vazio está silencioso.</p>";
                return;
            }
            snap.forEach(d => {
                const chat = d.data();
                const initial = chat.name ? chat.name[0].toUpperCase() : "?";
                const item = document.createElement('div');
                item.className = 'chat-item';
                item.onclick = () => openChat(d.id);
                item.innerHTML = `
                    <div class="avatar">${initial}</div>
                    <div class="chat-info">
                        <b>${chat.name}</b>
                        <span>@${chat.handle}</span>
                    </div>
                `;
                list.appendChild(item);
            });
        });
    }

    // ABRIR CHAT ESPECÍFICO
    async function openChat(otherUid) {
        document.getElementById('chat-view').style.display = 'flex';
        const win = document.getElementById('chat-window');
        win.innerHTML = "<p style='text-align:center; opacity:0.3; font-size:12px;'>Carregando sinais...</p>";

        const otherSnap = await getDoc(doc(db, "users", otherUid));
        const otherData = otherSnap.data();
        document.getElementById('chat-target-name').innerText = `@${otherData.handle}`.toUpperCase();

        const chatId = [myUid, otherUid].sort().join('_');
        const qMessages = query(collection(db, `chats/${chatId}/messages`), orderBy("createdAt", "asc"), limit(50));
        
        if(unsubMessages) unsubMessages();
        unsubMessages = onSnapshot(qMessages, snap => {
            win.innerHTML = "";
            snap.forEach(d => {
                const m = d.data();
                const div = document.createElement('div');
                div.className = `msg ${m.senderId === myUid ? 'sent' : 'received'}`;
                div.innerText = m.text;
                win.appendChild(div);
            });
            win.scrollTop = win.scrollHeight;
        });

        document.getElementById('send-msg').onclick = () => sendMessage(otherUid, chatId, otherData);
    }

    // ENVIAR MENSAGEM
    async function sendMessage(otherUid, chatId, otherData) {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if(!text) return;
        input.value = "";

        await addDoc(collection(db, `chats/${chatId}/messages`), { 
            text, senderId: myUid, createdAt: serverTimestamp() 
        });

        // Atualiza recentes para ambos
        const mySnap = await getDoc(doc(db, "users", myUid));
        const myData = mySnap.data();

        await setDoc(doc(db, `users/${myUid}/recent_chats`, otherUid), {
            name: otherData.name, handle: otherData.handle, lastTime: serverTimestamp()
        });
        await setDoc(doc(db, `users/${otherUid}/recent_chats`, myUid), {
            name: myData.name, handle: myData.handle, lastTime: serverTimestamp()
        });
    }

    // PESQUISA DE USUÁRIOS
    document.getElementById('user-search').oninput = async (e) => {
        const val = e.target.value.toLowerCase().trim();
        const list = document.getElementById('contacts-list');
        if(val.length < 2) { loadRecentChats(); return; }

        const q = query(collection(db, "users"), where("handle", ">=", val), where("handle", "<=", val + "\uf8ff"), limit(5));
        const s = await getDocs(q);
        list.innerHTML = "";
        s.forEach(docU => {
            if(docU.id === myUid) return;
            const u = docU.data();
            const item = document.createElement('div');
            item.className = 'chat-item';
            item.onclick = () => openChat(docU.id);
            item.innerHTML = `<div class="avatar">${u.name[0]}</div><div class="chat-info"><b>${u.name}</b><span>@${u.handle}</span></div>`;
            list.appendChild(item);
        });
    };

    window.closeChat = () => {
        document.getElementById('chat-view').style.display = 'none';
        if(unsubMessages) unsubMessages();
        const url = new URL(window.location);
        url.searchParams.delete('id');
        window.history.pushState({}, '', url);
    };
</script>
</body>
</html>
