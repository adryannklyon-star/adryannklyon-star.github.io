<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Direct</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --bg: #030307; --glass: rgba(255, 255, 255, 0.05); }
        
        /* Previne o scroll elástico no iOS e garante altura total */
        html, body { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans';
            overflow: hidden; /* O body não scrola, apenas a janela de chat */
        }

        body {
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at 50% 0%, #0f172a 0%, #030307 100%);
        }
        
        header { 
            height: 60px; display: flex; align-items: center; padding: 0 15px; 
            border-bottom: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(15px);
            z-index: 10; flex-shrink: 0;
        }

        .back-btn { 
            background: none; border: none; color: var(--primary); 
            font-size: 1.5rem; cursor: pointer; padding: 10px; margin-right: 5px;
        }
        
        /* Janela de Chat Responsiva */
        #chat-window { 
            flex: 1; overflow-y: auto; padding: 15px; 
            display: flex; flex-direction: column; gap: 12px;
            -webkit-overflow-scrolling: touch; /* Scroll suave no iOS */
        }
        
        .msg { 
            max-width: 85%; padding: 12px 16px; border-radius: 18px; 
            font-size: 0.95rem; line-height: 1.4; word-wrap: break-word;
        }
        .msg.sent { 
            align-self: flex-end; background: var(--primary); color: #000; 
            border-bottom-right-radius: 4px; font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 242, 255, 0.2);
        }
        .msg.received { 
            align-self: flex-start; background: var(--glass); 
            border: 1px solid rgba(255,255,255,0.1); border-bottom-left-radius: 4px; 
        }

        /* Área de input fixa na base que não some com o teclado */
        .input-area { 
            padding: 15px; background: rgba(15, 23, 42, 0.95); 
            border-top: 1px solid rgba(255,255,255,0.1); 
            display: flex; gap: 10px; align-items: center;
            flex-shrink: 0; padding-bottom: calc(15px + env(safe-area-inset-bottom));
        }

        input { 
            flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); 
            border-radius: 25px; padding: 12px 20px; color: #fff; outline: none; 
            font-size: 16px; /* Evita zoom automático no iOS ao focar */
        }

        .send-btn { 
            background: var(--primary); border: none; width: 48px; height: 48px; 
            border-radius: 50%; cursor: pointer; color: #000; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px var(--primary); flex-shrink: 0;
        }
    </style>
</head>
<body>

<header>
    <button class="back-btn" onclick="window.location.href='index.html'">←</button>
    <div id="chat-with" style="font-family:'Orbitron'; font-size: 0.75rem; color: var(--primary); letter-spacing: 1px;">CARREGANDO...</div>
</header>

<div id="chat-window"></div>

<div class="input-area">
    <input type="text" id="msg-input" placeholder="Mensagem..." autocomplete="off">
    <button class="send-btn" id="send-msg">➤</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", 
        authDomain: "klyon-a97ba.firebaseapp.com", 
        projectId: "klyon-a97ba" 
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const otherUid = urlParams.get('id');

    onAuthStateChanged(auth, async user => {
        if (!user || !otherUid) return;

        const otherSnap = await getDoc(doc(db, "users", otherUid));
        if(otherSnap.exists()) document.getElementById('chat-with').innerText = `@${otherSnap.data().handle}`.toUpperCase();

        const chatId = [user.uid, otherUid].sort().join('_');

        const q = query(collection(db, `chats/${chatId}/messages`), orderBy("createdAt", "asc"));
        onSnapshot(q, snap => {
            const win = document.getElementById('chat-window');
            win.innerHTML = "";
            snap.forEach(d => {
                const m = d.data();
                const div = document.createElement('div');
                div.className = `msg ${m.senderId === user.uid ? 'sent' : 'received'}`;
                div.innerText = m.text;
                win.appendChild(div);
            });
            // Scroll para o fim com suavidade
            win.scrollTo({ top: win.scrollHeight, behavior: 'smooth' });
        });

        const sendBtn = document.getElementById('send-msg');
        const input = document.getElementById('msg-input');

        const sendMessage = async () => {
            const text = input.value.trim();
            if(!text) return;
            input.value = "";
            await addDoc(collection(db, `chats/${chatId}/messages`), {
                text: text,
                senderId: user.uid,
                createdAt: serverTimestamp()
            });
        };

        sendBtn.onclick = sendMessage;
        input.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });
    });

    // Ajuste para teclados mobile que mudam o viewport
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => {
            document.body.style.height = window.visualViewport.height + 'px';
            window.scrollTo(0, 0);
            const win = document.getElementById('chat-window');
            win.scrollTop = win.scrollHeight;
        });
    }
</script>
</body>
</html>
