<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/png" href="logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLYON | Direct</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --bg: #030307; --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans'; overflow: hidden; }
        body { display: flex; flex-direction: column; background: radial-gradient(circle at 50% 0%, #0f172a 0%, #030307 100%); }
        
        header { 
            height: 65px; display: flex; align-items: center; padding: 0 15px; 
            border-bottom: 1px solid var(--glass-border); backdrop-filter: blur(15px);
            z-index: 10; flex-shrink: 0;
        }

        .back-btn { background: none; border: none; color: var(--primary); font-size: 1.5rem; cursor: pointer; padding: 10px; display: flex; align-items: center; }
        .back-btn svg { width: 24px; height: 24px; stroke: var(--primary); fill: none; stroke-width: 2.5; filter: drop-shadow(0 0 5px var(--primary)); }
        
        #chat-with { font-family: 'Orbitron'; font-size: 0.75rem; color: var(--primary); letter-spacing: 2px; text-align: center; flex: 1; text-shadow: 0 0 10px var(--primary); }
        #chat-with span:hover { color: #fff; text-shadow: 0 0 15px var(--primary); transition: 0.3s; }

        /* LISTA DE CONVERSAS */
        #inbox-view { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .search-container { padding: 20px; position: relative; }
        .search-bar { 
            width: 100%; background: var(--glass); border: 1px solid var(--glass-border); 
            border-radius: 15px; padding: 14px 15px 14px 45px; color: #fff; outline: none; 
            font-size: 0.9rem; font-family: 'Plus Jakarta Sans';
        }
        .search-icon { position: absolute; left: 35px; top: 33px; width: 18px; height: 18px; stroke: var(--primary); fill: none; stroke-width: 2; opacity: 0.8; }

        .chat-item { display: flex; align-items: center; padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,0.03); cursor: pointer; transition: 0.2s; }
        .chat-item:active { background: var(--glass); }
        .user-avatar { 
            width: 48px; height: 48px; background: rgba(0,0,0,0.5); border: 2px solid var(--primary); 
            border-radius: 14px; display: flex; align-items: center; justify-content: center; 
            font-family: 'Orbitron'; color: var(--primary); margin-right: 15px; 
            box-shadow: inset 0 0 8px var(--primary);
        }
        .chat-info b { display: block; font-size: 0.9rem; font-family: 'Orbitron'; color: #fff; margin-bottom: 3px; }
        .chat-info span { font-size: 0.75rem; color: var(--primary); opacity: 0.8; }

        /* JANELA DE CHAT */
        #chat-view { flex: 1; display: none; flex-direction: column; overflow: hidden; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
        
        .msg { max-width: 80%; padding: 12px 18px; border-radius: 20px; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; }
        .msg.sent { align-self: flex-end; background: var(--primary); color: #000; border-bottom-right-radius: 4px; font-weight: 700; box-shadow: 0 4px 20px rgba(0, 242, 255, 0.3); }
        .msg.received { align-self: flex-start; background: var(--glass); border: 1px solid var(--glass-border); border-bottom-left-radius: 4px; }

        .input-area { 
            padding: 15px 20px; background: rgba(3, 3, 7, 0.9); backdrop-filter: blur(10px);
            border-top: 1px solid var(--glass-border); display: flex; gap: 12px; align-items: center;
            padding-bottom: calc(15px + env(safe-area-inset-bottom));
        }
        .input-area input { flex: 1; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 18px; padding: 14px 20px; color: #fff; outline: none; font-size: 16px; }
        .send-btn { background: var(--primary); border: none; width: 50px; height: 50px; border-radius: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px var(--primary); flex-shrink: 0; }
        .send-btn svg { width: 22px; height: 22px; fill: #000; }
    </style>
</head>
<body>

<header>
    <button class="back-btn" id="header-back">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div id="chat-with">DIRECTS</div>
    <div style="width: 44px;"></div> 
</header>

<div id="inbox-view">
    <div class="search-container">
        <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="user-search" class="search-bar" placeholder="BUSCAR USUÁRIO...">
    </div>
    <div id="contacts-list"></div>
</div>

<div id="chat-view">
    <div id="chat-window"></div>
    <div class="input-area">
        <input type="text" id="msg-input" placeholder="Sinalizar mensagem..." autocomplete="off">
        <button class="send-btn" id="send-msg">
            <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, getDoc, getDocs, where, limit, setDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", authDomain: "klyon-a97ba.firebaseapp.com", projectId: "klyon-a97ba" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let myUid, unsubMessages, unsubRecent;

    onAuthStateChanged(auth, user => {
        if (!user) return window.location.href = "login.html";
        myUid = user.uid;
        const urlParams = new URLSearchParams(window.location.search);
        const otherId = urlParams.get('id');
        if (otherId) openChat(otherId); else loadRecentChats();
    });

    function loadRecentChats() {
        document.getElementById('inbox-view').style.display = 'flex';
        document.getElementById('chat-view').style.display = 'none';
        document.getElementById('chat-with').innerText = "DIRECTS";
        document.getElementById('chat-with').onclick = null;
        document.getElementById('header-back').onclick = () => window.location.href = 'index.html';

        const list = document.getElementById('contacts-list');
        const qRecent = query(collection(db, `users/${myUid}/recent_chats`), orderBy("lastTime", "desc"));
        
        if(unsubRecent) unsubRecent();
        unsubRecent = onSnapshot(qRecent, snap => {
            list.innerHTML = "";
            if(snap.empty) list.innerHTML = "<p style='text-align:center; opacity:0.4; margin-top:20px;'>Nenhuma conversa recente.</p>";
            snap.forEach(d => {
                const chat = d.data();
                const item = document.createElement('div');
                item.className = 'chat-item';
                item.onclick = () => window.location.href = `chat.html?id=${d.id}`;
                item.innerHTML = `<div class="user-avatar">${chat.name.charAt(0)}</div><div class="chat-info"><b>${chat.name}</b><span>@${chat.handle}</span></div>`;
                list.appendChild(item);
            });
        });

        document.getElementById('user-search').oninput = async (e) => {
            const val = e.target.value.toLowerCase().trim();
            if(val.length < 2) return;
            const q = query(collection(db, "users"), where("handle", ">=", val), limit(5));
            const s = await getDocs(q);
            list.innerHTML = "";
            s.forEach(docU => {
                if(docU.id === myUid) return;
                const u = docU.data();
                const item = document.createElement('div');
                item.className = 'chat-item';
                item.onclick = () => window.location.href = `chat.html?id=${docU.id}`;
                item.innerHTML = `<div class="user-avatar">${u.name.charAt(0)}</div><div class="chat-info"><b>${u.name}</b><span>@${u.handle}</span></div>`;
                list.appendChild(item);
            });
        };
    }

    async function openChat(otherUid) {
        document.getElementById('inbox-view').style.display = 'none';
        document.getElementById('chat-view').style.display = 'flex';
        
        const otherSnap = await getDoc(doc(db, "users", otherUid));
        if(!otherSnap.exists()) return;
        const otherData = otherSnap.data();

        const chatHeader = document.getElementById('chat-with');
        chatHeader.innerHTML = `<span style="cursor:pointer">@${otherData.handle}</span>`.toUpperCase();
        chatHeader.onclick = () => window.location.href = `perfil.html?u=${otherData.handle}`;

        document.getElementById('header-back').onclick = () => window.location.href = 'chat.html';

        const chatId = [myUid, otherUid].sort().join('_');
        const qMessages = query(collection(db, `chats/${chatId}/messages`), orderBy("createdAt", "asc"));
        
        if(unsubMessages) unsubMessages();
        unsubMessages = onSnapshot(qMessages, snap => {
            const win = document.getElementById('chat-window');
            win.innerHTML = "";
            snap.forEach(d => {
                const m = d.data();
                const div = document.createElement('div');
                div.className = `msg ${m.senderId === myUid ? 'sent' : 'received'}`;
                div.innerText = m.text;
                win.appendChild(div);
            });
            win.scrollTo({ top: win.scrollHeight, behavior: 'smooth' });
        });

        document.getElementById('send-msg').onclick = () => sendMessage(otherUid, chatId, otherData);
        document.getElementById('msg-input').onkeypress = (e) => { if(e.key === 'Enter') sendMessage(otherUid, chatId, otherData); };
    }

    async function sendMessage(otherUid, chatId, otherData) {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if(!text) return;
        input.value = "";

        await addDoc(collection(db, `chats/${chatId}/messages`), { text, senderId: myUid, createdAt: serverTimestamp() });

        await setDoc(doc(db, `users/${myUid}/recent_chats`, otherUid), {
            name: otherData.name, handle: otherData.handle, lastTime: serverTimestamp()
        });

        const mySnap = await getDoc(doc(db, "users", myUid));
        const myData = mySnap.data();
        await setDoc(doc(db, `users/${otherUid}/recent_chats`, myUid), {
            name: myData.name, handle: myData.handle, lastTime: serverTimestamp()
        });
    }
</script>
</body>
</html>
