<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLYON | Perfil</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --bg: #030307; --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); --text-dim: #94a3b8; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at 50% 0%, #0f172a 0%, #030307 100%); min-height: 100vh; padding-bottom: 100px; }
        
        /* Capa Estilizada sem Foto */
        .header-capa { height: 140px; background: linear-gradient(180deg, rgba(0,242,255,0.05) 0%, transparent 100%); position: relative; border-bottom: 1px solid var(--glass-border); }
        .container { max-width: 550px; margin: auto; padding: 0 15px; position: relative; }

        /* Avatar Neon que substitui a Foto */
        .neon-avatar-large {
            width: 90px; height: 90px;
            background: #000;
            border: 3px solid var(--primary);
            border-radius: 22px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Orbitron';
            color: var(--primary);
            font-size: 2.5rem;
            text-shadow: 0 0 15px var(--primary);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.3), inset 0 0 10px rgba(0, 242, 255, 0.2);
            margin-top: -45px;
            position: relative;
            z-index: 2;
        }
        
        /* Botões */
        .btn-action { background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 10px 20px; border-radius: 20px; float: right; margin-top: 15px; font-family: 'Orbitron'; font-size: 0.75rem; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .btn-action:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); }
        
        /* Posts */
        .post { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px; padding: 18px; margin-top: 15px; animation: fadeIn 0.4s ease; }
        .post b { color: var(--primary); font-family: 'Orbitron'; font-size: 0.85rem; letter-spacing: 1px; }
        .post p { line-height: 1.6; color: #cbd5e1; margin-top: 10px; white-space: pre-wrap; }

        /* Modal de Edição Limpo (Sem foto) */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 3000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .modal-card { background: #0f172a; width: 90%; max-width: 400px; padding: 30px; border-radius: 28px; border: 1px solid var(--primary); }
        .field { margin-bottom: 20px; }
        .field label { display: block; font-size: 0.7rem; color: var(--primary); margin-bottom: 8px; font-family: 'Orbitron'; letter-spacing: 1px; }
        .field input { width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); padding: 14px; border-radius: 12px; color: #fff; font-family: 'Plus Jakarta Sans'; }

        /* Menu Inferior */
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 450px; height: 70px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border-radius: 28px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-around; z-index: 1000; }
        .nav-link img { width: 24px; filter: invert(1); opacity: 0.4; transition: 0.3s; }
        .nav-link.active img { opacity: 1; filter: drop-shadow(0 0 8px var(--primary)) invert(1); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="editModal" class="modal">
    <div class="modal-card">
        <h2 style="font-family:'Orbitron'; font-size: 1rem; color: var(--primary); margin-bottom: 20px;">AJUSTAR IDENTIDADE</h2>
        
        <div class="field">
            <label>NOME DE EXIBIÇÃO</label>
            <input type="text" id="editName" placeholder="Como quer ser chamado?">
        </div>

        <div class="field">
            <label>@ HANDLE (ÚNICO)</label>
            <input type="text" id="editHandle" placeholder="seu_usuario" style="text-transform: lowercase;">
        </div>

        <p style="font-size: 0.65rem; color: var(--text-dim); margin-bottom: 20px; line-height: 1.4;">
            * O @handle deve ser único. Se você mudar para um que já existe, a alteração será negada.
        </p>

        <button id="saveBtn" onclick="saveProfile()" style="width:100%; background:var(--primary); padding:15px; border-radius:15px; border:none; font-weight:800; font-family:'Orbitron'; cursor:pointer; color:#000;">SALVAR ALTERAÇÕES</button>
        <button onclick="document.getElementById('editModal').style.display='none'" style="width:100%; background:transparent; color:#ff2d55; border:none; margin-top:15px; cursor:pointer; font-family:'Orbitron'; font-size:0.7rem;">CANCELAR</button>
    </div>
</div>

<script type="module">
    // ... (Mantenha seus imports e configs do Firebase)
    import { getFirestore, doc, onSnapshot, collection, updateDoc, arrayUnion, arrayRemove, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    // ... (Mantenha o código de onAuthStateChanged e Listeners)
    
    // Atualize a parte que abre o modal para preencher o handle também:
    // No seu if(targetUid === user.uid) { ... }
    actionBtn.onclick = () => {
        document.getElementById('editModal').style.display = 'flex';
        document.getElementById('editName').value = u.name;
        document.getElementById('editHandle').value = u.handle;
    };

    // NOVA FUNÇÃO SAVE PROFILE COM VERIFICAÇÃO DE HANDLE
    window.saveProfile = async () => {
        const btn = document.getElementById('saveBtn');
        const newName = document.getElementById('editName').value.trim();
        const newHandle = document.getElementById('editHandle').value.trim().toLowerCase().replace(/\s+/g, '_');

        if(!newName || !newHandle) return alert("Preencha todos os campos.");
        
        btn.disabled = true; 
        btn.innerText = "VERIFICANDO DISPONIBILIDADE...";

        try {
            // Se o handle mudou, precisamos verificar se já existe
            if (newHandle !== myUser.handle) {
                const q = query(collection(db, "users"), where("handle", "==", newHandle));
                const querySnapshot = await getDocs(q);
                
                if (!querySnapshot.empty) {
                    alert("Este @handle já está sendo usado por outra elite.");
                    btn.disabled = false;
                    btn.innerText = "SALVAR ALTERAÇÕES";
                    return;
                }
            }

            // Atualiza o documento do usuário
            await updateDoc(doc(db, "users", auth.currentUser.uid), {
                name: newName,
                handle: newHandle
            });

            // Opcional: Você pode querer atualizar o nome/handle nos posts antigos também, 
            // mas isso exige um loop. Por enquanto, os novos posts já sairão certos.

            document.getElementById('editModal').style.display = 'none';
            alert("Identidade atualizada!");

        } catch (e) {
            console.error(e);
            alert("Erro ao salvar. Verifique sua conexão.");
        } finally {
            btn.disabled = false; 
            btn.innerText = "SALVAR ALTERAÇÕES";
        }
    };
</script>
</body>
</html>
