<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLYON | Perfil</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --bg: #030307; --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); --text-dim: #94a3b8; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at 50% 0%, #0f172a 0%, #030307 100%); min-height: 100vh; padding-bottom: 100px; }
        .header-capa { height: 140px; background: linear-gradient(180deg, rgba(0,242,255,0.05) 0%, transparent 100%); border-bottom: 1px solid var(--glass-border); }
        .container { max-width: 550px; margin: auto; padding: 0 15px; position: relative; }
        
        .neon-avatar-large { width: 90px; height: 90px; background: #000; border: 3px solid var(--primary); border-radius: 22px; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron'; color: var(--primary); font-size: 2.5rem; text-shadow: 0 0 15px var(--primary); box-shadow: 0 0 20px rgba(0, 242, 255, 0.3); margin-top: -45px; position: relative; z-index: 2; }
        
        .btn-action { background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 10px 20px; border-radius: 20px; float: right; margin-top: 15px; font-family: 'Orbitron'; font-size: 0.75rem; cursor: pointer; transition: 0.3s; }
        .btn-action.following { background: var(--primary); color: #000; }

        .btn-direct { 
            background: rgba(0, 242, 255, 0.05); 
            border: 1px solid var(--primary); 
            color: var(--primary); 
            padding: 8px 16px; 
            border-radius: 10px; 
            font-family: 'Orbitron', sans-serif; 
            font-size: 0.65rem; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            text-transform: uppercase; 
            display: inline-block; 
            text-decoration: none;
            margin-top: 10px;
        }
        .btn-direct:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); }

        .stats-bar { display: flex; gap: 20px; margin-top: 15px; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px; }
        .stat { font-size: 0.8rem; color: var(--text-dim); }
        .stat b { color: #fff; font-family: 'Orbitron'; }

        .post { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 20px; padding: 18px; margin-top: 15px; }
        .post b { color: var(--primary); font-family: 'Orbitron'; font-size: 0.8rem; }
        
        .post-actions { 
            display: flex; 
            justify-content: space-between; 
            gap: 20px; 
            border-top: 1px solid rgba(255,255,255,0.05); 
            padding-top: 15px; 
            margin-top: 15px; 
        }
        .action-info { 
            color: var(--text-dim); 
            font-size: 0.75rem; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            font-family: 'Orbitron'; 
            cursor: pointer; 
            transition: 0.2s;
        }
        
        .action-info img { 
            width: 18px; 
            height: 18px; 
            filter: invert(1); 
            opacity: 0.4; 
            transition: 0.2s; 
        }
        
        /* Efeito Neon no Hover */
        .action-info:hover { color: var(--primary); text-shadow: 0 0 5px var(--primary); }
        .action-info:hover img { 
            opacity: 1; 
            filter: invert(80%) sepia(100%) saturate(1000%) hue-rotate(150deg); 
        }

        .comment-box { margin-top: 15px; padding-left: 15px; border-left: 2px solid var(--glass-border); }
        .comment { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 12px; margin-bottom: 8px; font-size: 0.85rem; }
        .comment b { color: var(--primary); font-size: 0.75rem; font-family: 'Orbitron'; }

        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 450px; height: 70px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border-radius: 28px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-around; z-index: 1000; }
        .nav-link img { width: 24px; filter: invert(1); opacity: 0.4; }
        .nav-link.active img { opacity: 1; filter: drop-shadow(0 0 8px var(--primary)) invert(1); }  
        /* Ícone de Republicar em CSS para ficar nítido e neon */
.action-info { 
    color: var(--text-dim); 
    font-size: 0.75rem; 
    display: flex; 
    align-items: center; 
    gap: 8px; 
    font-family: 'Orbitron'; 
    cursor: pointer; 
    transition: 0.3s;
}

/* O segredo do brilho neon no ícone */
.action-info svg {
    width: 20px;
    height: 20px;
    stroke: var(--text-dim);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: 0.3s;
}

.action-info:hover { color: var(--primary); text-shadow: 0 0 8px var(--primary); }

.action-info:hover svg { 
    stroke: var(--primary); 
    filter: drop-shadow(0 0 5px var(--primary)); 
}
    </style>
</head>
<body>

<div class="header-capa"></div>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div class="neon-avatar-large" id="userInitial">?</div>
        <button id="actionBtn" class="btn-action">...</button>
    </div>

    <div class="profile-info">
        <h1 id="userName" style="margin-bottom: 5px;">...</h1>
        <p id="userHandle" style="color: var(--primary); margin: 0;">@...</p>
        <p id="userBio" style="color: var(--text-dim); margin-top: 10px; line-height: 1.5; font-size: 0.9rem;"></p>
        <div id="directBtnContainer"></div>
    </div>

    <div class="stats-bar">
        <div class="stat"><b id="countFollowers">0</b> Conexões</div>
    </div>

    <h3 style="font-family: 'Orbitron'; font-size: 0.8rem; color: var(--text-dim); margin-top: 25px;">TRANSMISSÕES</h3>
    <div id="postsContainer"></div>
</div>

<nav class="bottom-nav">
    <a href="index.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png"></a>
    <a href="buscar.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/149/149852.png"></a>
    <a href="notificacoes.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/3602/3602145.png"></a>
    <a href="perfil.html" class="nav-link active"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png"></a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, collection, query, where, orderBy, getDocs, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", authDomain: "klyon-a97ba.firebaseapp.com", projectId: "klyon-a97ba" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let myUid = null;

    onAuthStateChanged(auth, async (user) => {
        if (!user) return window.location.href = "login.html";
        myUid = user.uid;
        
        const params = new URLSearchParams(window.location.search);
        const handleParam = params.get('u');
        let uidToLoad = myUid;

        if (handleParam) {
            const q = query(collection(db, "users"), where("handle", "==", handleParam));
            const querySnap = await getDocs(q);
            if (!querySnap.empty) uidToLoad = querySnap.docs[0].id;
        }

        setupProfile(uidToLoad);
    });

    function setupProfile(uid) {
        onSnapshot(doc(db, "users", uid), (snap) => {
            const d = snap.data();
            if (!d) return;
            document.getElementById('userName').innerText = d.name;
            document.getElementById('userHandle').innerText = `@${d.handle}`;
            document.getElementById('userInitial').innerText = d.name.charAt(0).toUpperCase();
            document.getElementById('userBio').innerText = d.bio || "Sem bio.";
            document.getElementById('countFollowers').innerText = d.followers?.length || 0;

            const btn = document.getElementById('actionBtn');
            const directContainer = document.getElementById('directBtnContainer');

            if (uid === myUid) {
                btn.innerText = "CONFIGURAR";
                btn.onclick = () => window.location.href = "configuracoes.html";
                directContainer.innerHTML = ""; 
            } else {
                const isFollowing = d.followers?.includes(myUid);
                btn.innerText = isFollowing ? "CONECTADO" : "CONECTAR";
                btn.className = isFollowing ? "btn-action following" : "btn-action";
                btn.onclick = () => toggleFollow(uid, isFollowing);
                directContainer.innerHTML = `<a href="chat.html?id=${uid}" class="btn-direct">MENSAGEM</a>`;
            }
        });

        const q = query(collection(db, "posts"), where("uid", "==", uid), orderBy("createdAt", "desc"));
        onSnapshot(q, (snap) => {
            const container = document.getElementById('postsContainer');
            container.innerHTML = "";
            snap.forEach(docSnap => {
                const p = docSnap.data();
                const pid = docSnap.id;
                
                const likes = p.likesCount || 0;
                const comments = p.commentsCount || 0;
                const reposts = p.repostsCount || 0;

                const postDiv = document.createElement('div');
                postDiv.className = 'post';
                postDiv.innerHTML = `
                    <b>${p.authorName}</b>
                    <div style="margin-top:8px; line-height: 1.5;">${p.content}</div>
                    
                    <div class="post-actions">
                        <div class="action-info">
                            <img src="https://cdn-icons-png.flaticon.com/512/5948/5948565.png" alt="Comments"> 
                            <span>${comments}</span>
                        </div>
                      <div class="action-info">
        <svg viewBox="0 0 24 24">
            <polyline points="17 1 21 5 17 9"></polyline>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <polyline points="7 23 3 19 7 15"></polyline>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
        </svg>
        <span>${p.repostsCount || 0}</span>
    </div>
                       <div class="action-info ${isLiked ? 'active' : ''}" onclick="window.toggleLike('${pid}', ${isLiked})">
    <svg viewBox="0 0 24 24">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
    </svg>
    <span>${likes.length}</span>
</div>
                    </div>
                    
                    <div class="comment-box" id="comments-${pid}"></div>
                `;
                container.appendChild(postDiv);
                loadComments(pid);
            });
        });
    }

    async function toggleFollow(targetUid, isFollowing) {
        const myRef = doc(db, "users", myUid);
        const targetRef = doc(db, "users", targetUid);
        if (isFollowing) {
            await updateDoc(myRef, { following: arrayRemove(targetUid) });
            await updateDoc(targetRef, { followers: arrayRemove(myUid) });
        } else {
            await updateDoc(myRef, { following: arrayUnion(targetUid) });
            await updateDoc(targetRef, { followers: arrayUnion(myUid) });
        }
    }

    function loadComments(postId) {
        onSnapshot(query(collection(db, `posts/${postId}/comments`), orderBy("createdAt", "asc")), snap => {
            const box = document.getElementById(`comments-${postId}`);
            if(!box) return;
            box.innerHTML = "";
            snap.forEach(cDoc => {
                const c = cDoc.data();
                box.innerHTML += `<div class="comment"><b>@${c.handle}</b>: ${c.text}</div>`;
            });
        });
    }
</script>
</body>
</html>
