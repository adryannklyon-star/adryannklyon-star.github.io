<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLYON | Perfil</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --bg: #030307; --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); --text-dim: #94a3b8; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at 50% 0%, #0f172a 0%, #030307 100%); min-height: 100vh; padding-bottom: 100px; }
        .header-capa { height: 140px; background: linear-gradient(180deg, rgba(0,242,255,0.05) 0%, transparent 100%); border-bottom: 1px solid var(--glass-border); }
        .container { max-width: 550px; margin: auto; padding: 0 15px; position: relative; }
        
        /* Avatar Neon Dinâmico */
        .neon-avatar-large { width: 90px; height: 90px; background: #000; border: 3px solid var(--primary); border-radius: 22px; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron'; color: var(--primary); font-size: 2.5rem; text-shadow: 0 0 15px var(--primary); box-shadow: 0 0 20px rgba(0, 242, 255, 0.3); margin-top: -45px; position: relative; z-index: 2; }
        
        .btn-action { background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 10px 20px; border-radius: 20px; float: right; margin-top: 15px; font-family: 'Orbitron'; font-size: 0.75rem; cursor: pointer; transition: 0.3s; }
        .btn-action.following { background: var(--primary); color: #000; }

        /* Botão Direct Neon */
        .btn-direct { background: rgba(0, 242, 255, 0.05); border: 1px solid var(--primary); color: var(--primary); padding: 10px 24px; border-radius: 12px; font-family: 'Orbitron', sans-serif; font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 2px; margin: 15px 0; box-shadow: 0 0 10px rgba(0, 242, 255, 0.1); width: 100%; }
        .btn-direct:hover { background: var(--primary); color: #000; box-shadow: 0 0 20px var(--primary); transform: translateY(-2px); }

        .stats-bar { display: flex; gap: 20px; margin-top: 15px; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px; }
        .stat { font-size: 0.8rem; color: var(--text-dim); cursor: pointer; transition: 0.2s; }
        .stat b { color: #fff; font-family: 'Orbitron'; }

        .post { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 20px; padding: 18px; margin-top: 15px; }
        .post b { color: var(--primary); font-family: 'Orbitron'; font-size: 0.8rem; }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 2000; align-items: center; justify-content: center; }
        .modal-content { width: 90%; max-width: 400px; background: #0f172a; border: 1px solid var(--glass-border); border-radius: 28px; padding: 20px; max-height: 70vh; overflow-y: auto; }
        
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 450px; height: 70px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border-radius: 28px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-around; z-index: 1000; }
        .nav-link img { width: 24px; filter: invert(1); opacity: 0.4; }
    </style>
</head>
<body>

<div id="listModal" class="modal">
    <div class="modal-content">
        <div id="modalListContainer"></div>
        <button onclick="closeModal()" style="width:100%; background:transparent; color:var(--primary); border:none; margin-top:15px; font-family:'Orbitron'; cursor:pointer;">FECHAR</button>
    </div>
</div>

<div class="header-capa"></div>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div class="neon-avatar-large" id="userInitial">?</div>
        <button id="actionBtn" class="btn-action">...</button>
    </div>

    <div class="profile-info">
        <h1 id="userName" style="margin-bottom: 5px;">...</h1>
        <p id="userHandle" style="color: var(--primary); margin: 0;">@...</p>
        <p id="userBio" style="color: var(--text-dim); margin-top: 10px; line-height: 1.5; font-size: 0.9rem;"></p>
    </div>

    <div id="directBtnContainer"></div>

    <div class="stats-bar">
        <div class="stat" onclick="showList('followers')"><b id="countFollowers">0</b> Conexões</div>
    </div>

    <h3 style="font-family: 'Orbitron'; font-size: 0.8rem; color: var(--text-dim); margin-top: 25px;">TRANSMISSÕES</h3>
    <div id="postsContainer"></div>
</div>

<nav class="bottom-nav">
    <a href="index.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png"></a>
    <a href="buscar.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/149/149852.png"></a>
    <a href="notificacoes.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/3602/3602145.png"></a>
    <a href="perfil.html" class="nav-link active"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png"></a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, collection, query, where, orderBy, updateDoc, arrayUnion, arrayRemove, getDocs, getDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", authDomain: "klyon-a97ba.firebaseapp.com", projectId: "klyon-a97ba" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let viewedUserUid = null;
    let myUid = null;

    onAuthStateChanged(auth, async (user) => {
        if (!user) return window.location.href = "login.html";
        myUid = user.uid;

        const params = new URLSearchParams(window.location.search);
        const handleParam = params.get('u');

        if (handleParam) {
            const q = query(collection(db, "users"), where("handle", "==", handleParam));
            const querySnap = await getDocs(q);
            if (!querySnap.empty) {
                viewedUserUid = querySnap.docs[0].id;
                setupProfile(viewedUserUid);
            }
        } else {
            viewedUserUid = myUid;
            setupProfile(myUid);
        }
    });

    function setupProfile(uid) {
        onSnapshot(doc(db, "users", uid), (docSnap) => {
            const data = docSnap.data();
            if (!data) return;

            document.getElementById('userName').innerText = data.name;
            document.getElementById('userHandle').innerText = `@${data.handle}`;
            document.getElementById('userInitial').innerText = data.name.charAt(0).toUpperCase();
            document.getElementById('userBio').innerText = data.bio || "Sem bio.";
            document.getElementById('countFollowers').innerText = data.followers?.length || 0;

            const btn = document.getElementById('actionBtn');
            const directContainer = document.getElementById('directBtnContainer');

            if (uid === myUid) {
                btn.innerText = "CONFIGURAR";
                btn.onclick = () => window.location.href = "configuracoes.html";
                directContainer.innerHTML = ""; 
            } else {
                const isFollowing = data.followers?.includes(myUid);
                btn.innerText = isFollowing ? "CONECTADO" : "CONECTAR";
                btn.className = isFollowing ? "btn-action following" : "btn-action";
                btn.onclick = () => toggleFollow(uid, isFollowing);
                
                // Botão Direct Dinâmico
                directContainer.innerHTML = `<button class="btn-direct" onclick="window.location.href='chat.html?id=${uid}'">ENVIAR DIRECT</button>`;
            }
        });

        // Histórico de Posts
        const qPosts = query(collection(db, "posts"), where("uid", "==", uid), orderBy("createdAt", "desc"));
        onSnapshot(qPosts, (snap) => {
            const container = document.getElementById('postsContainer');
            container.innerHTML = "";
            snap.forEach(pDoc => {
                const p = pDoc.data();
                container.innerHTML += `<div class="post"><b>${p.authorName}</b><div style="margin-top:8px;">${p.content}</div></div>`;
            });
        });
    }

    async function toggleFollow(targetUid, isFollowing) {
        const myRef = doc(db, "users", myUid);
        const targetRef = doc(db, "users", targetUid);
        if (isFollowing) {
            await updateDoc(myRef, { following: arrayRemove(targetUid) });
            await updateDoc(targetRef, { followers: arrayRemove(myUid) });
        } else {
            await updateDoc(myRef, { following: arrayUnion(targetUid) });
            await updateDoc(targetRef, { followers: arrayUnion(myUid) });
        }
    }

    window.closeModal = () => document.getElementById('listModal').style.display = "none";
</script>
</body>
</html>
