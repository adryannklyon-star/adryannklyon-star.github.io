<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Klyon - Perfil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000000; --text: #ffffff; --dim: #666; --border: #1a1a1a; --accent: #00f2ff; --card: #0a0a0a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding-bottom: 100px; }
        
        /* Header Minimalista */
        .profile-header { padding: 40px 20px 30px; text-align: center; border-bottom: 1px solid var(--border); }

        .avatar-container { display: flex; justify-content: center; margin-bottom: 20px; }

        /* Avatar com Inicial e Efeito Eclipse */
        .neon-avatar-circle {
            width: 100px; height: 100px; border-radius: 50%; 
            border: 1px solid #333; display: flex; align-items: center; justify-content: center;
            font-size: 36px; font-weight: 300; background: #000;
            box-shadow: inset -5px 5px 15px rgba(255, 255, 255, 0.1), 0 0 20px rgba(0, 0, 0, 0.8);
            color: #fff; text-transform: uppercase;
        }

        .user-info h1 { font-size: 20px; font-weight: 600; margin: 0; }
        .user-info p { color: var(--accent); font-size: 13px; margin: 5px 0 15px; font-weight: 400; opacity: 0.8; }
        .bio { font-size: 14px; color: #888; max-width: 280px; margin: 0 auto 20px; line-height: 1.5; font-weight: 300; }

        /* Stats */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; max-width: 350px; margin: 25px auto 0; padding-top: 20px; border-top: 1px solid #111; }
        .stat-item { text-align: center; }
        .stat-value { display: block; font-size: 18px; font-weight: 600; color: #fff; }
        .stat-label { display: block; font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

        /* Botões */
        .actions-row { display: flex; justify-content: center; gap: 10px; margin-top: 25px; }
        .btn-profile { padding: 10px 25px; border-radius: 30px; border: 1px solid #333; background: transparent; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.3s; text-decoration: none; }
        .btn-profile.primary { background: #fff; color: #000; border-color: #fff; }

        /* Feed de Posts no Perfil (Cards igual ao index) */
        .tabs-title { padding: 30px 20px 15px; font-size: 10px; color: var(--dim); letter-spacing: 3px; text-transform: uppercase; text-align: center; }
        #postsContainer { max-width: 500px; margin: 0 auto; padding: 0 15px; }
        .post-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 15px; }
        .post-content { font-size: 15px; font-weight: 300; line-height: 1.6; color: #ccc; }
        .post-time { margin-top: 12px; font-size: 11px; color: var(--dim); }

        /* Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 75px; background: #000; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-around; z-index: 1000; }
        .nav-link svg { width: 24px; stroke: var(--dim); fill: none; stroke-width: 1.5; }
        .nav-link.active svg { stroke: var(--accent); }
    </style>
</head>
<body>

<div class="profile-header">
    <div class="avatar-container">
        <div class="neon-avatar-circle" id="userInitial">?</div>
    </div>
    
    <div class="user-info">
        <h1 id="userName">...</h1>
        <p id="userHandle">@...</p>
        <div class="bio" id="userBio">Sincronizando com o vazio...</div>
    </div>

    <div class="stats-grid">
        <div class="stat-item">
            <span class="stat-value" id="countPosts">0</span>
            <span class="stat-label">Ecos</span>
        </div>
        <div class="stat-item">
            <span class="stat-value" id="countFriends">0</span>
            <span class="stat-label">Amigos</span>
        </div>
        <div class="stat-item">
            <span class="stat-value">0</span>
            <span class="stat-label">Votos</span>
        </div>
    </div>

    <div class="actions-row" id="profileActions">
        </div>
</div>

<div class="tabs-title">Minhas Transmissões</div>

<div id="postsContainer">
    </div>

<nav class="bottom-nav">
    <a href="index.html" class="nav-link"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></a>
    <a href="buscar.html" class="nav-link"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></a>
    <a href="notificacoes.html" class="nav-link"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path></svg></a>
    <a href="perfil.html" class="nav-link active"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle></svg></a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, query, where, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", 
        authDomain: "klyon-a97ba.firebaseapp.com", 
        projectId: "klyon-a97ba" 
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Pegar o ID do perfil da URL (ex: perfil.html?id=XYZ) ou usar o logado
    const urlParams = new URLSearchParams(window.location.search);
    const profileId = urlParams.get('id');

    onAuthStateChanged(auth, async (user) => {
        if (!user) return window.location.href = "login.html";
        
        const targetUid = profileId || user.uid;
        loadProfileData(targetUid, user.uid);
        loadUserPosts(targetUid);
    });

    async function loadProfileData(uid, myUid) {
        const snap = await getDoc(doc(db, "users", uid));
        if (snap.exists()) {
            const data = snap.data();
            document.getElementById('userName').innerText = data.name;
            document.getElementById('userHandle').innerText = `@${data.handle}`;
            document.getElementById('userBio').innerText = data.bio || "No final, somos todos apenas ecos no vazio.";
            document.getElementById('userInitial').innerText = data.name[0];
            document.getElementById('countFriends').innerText = data.friends ? data.friends.length : 0;

            // Renderiza botões dependendo se o perfil é meu ou de outro
            const actions = document.getElementById('profileActions');
            if (uid === myUid) {
                actions.innerHTML = `<a href="configuracoes.html" class="btn-profile primary">Editar Perfil</a>`;
            } else {
                actions.innerHTML = `
                    <button class="btn-profile primary" id="friendBtn">Amigar</button>
                    <a href="chat.html?id=${uid}" class="btn-profile">Mensagem</a>
                `;
            }
        }
    }

    function loadUserPosts(uid) {
        const q = query(collection(db, "posts"), where("uid", "==", uid), orderBy("createdAt", "desc"));
        
        onSnapshot(q, (snap) => {
            const container = document.getElementById('postsContainer');
            document.getElementById('countPosts').innerText = snap.size;
            container.innerHTML = "";
            
            if (snap.empty) {
                container.innerHTML = `<p style="text-align:center; color:#444; font-size:13px; margin-top:20px;">Nenhum eco encontrado.</p>`;
                return;
            }

            snap.forEach(d => {
                const p = d.data();
                container.innerHTML += `
                    <div class="post-card">
                        <div class="post-content">${p.content}</div>
                        <div class="post-time">Transmitido via Klyon</div>
                    </div>`;
            });
        });
    }
</script>
</body>
</html>
