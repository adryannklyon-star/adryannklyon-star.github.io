<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLYON | Perfil Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --bg: #030307; --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); --text-dim: #94a3b8; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at 50% 0%, #0f172a 0%, #030307 100%); min-height: 100vh; overflow-x: hidden; }
        
        /* Capa */
        .profile-header { position: relative; height: 180px; background-size: cover; background-position: center; background-color: #1a1a2e; border-bottom: 1px solid var(--glass-border); transition: 0.3s; }
        .back-btn { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.5); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; border: 1px solid var(--glass-border); }

        .container { max-width: 550px; margin: auto; padding: 0 15px 120px; position: relative; }
        
        /* Avatar e Info */
        .p-info-box { margin-top: -50px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 10px; }
        .p-avatar { width: 100px; height: 100px; border-radius: 25px; border: 4px solid var(--bg); object-fit: cover; background: #000; box-shadow: 0 8px 16px rgba(0,0,0,0.5); }
        .btn-edit { background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 0.75rem; cursor: pointer; font-family: 'Orbitron'; transition: 0.3s; }
        .btn-edit:hover { background: var(--primary); color: #000; }

        .p-details { margin-top: 15px; padding: 0 10px; }
        .p-details h2 { margin: 0; font-family: 'Orbitron'; font-size: 1.4rem; letter-spacing: 1px; }
        .p-details p { margin: 2px 0; color: var(--primary); font-weight: 600; opacity: 0.9; }

        /* Stats */
        .p-stats { display: flex; gap: 25px; padding: 15px 10px; border-bottom: 1px solid var(--glass-border); margin-bottom: 10px; }
        .stat-item { font-size: 0.9rem; color: var(--text-dim); }
        .stat-item b { color: #fff; font-size: 1rem; }

        /* Posts Estilo Feed */
        .post { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px; padding: 18px; margin-top: 16px; animation: fadeIn 0.4s ease; }
        .post-head { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
        .post-head img { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; border: 1px solid var(--primary); }
        .post-content { font-size: 0.95rem; line-height: 1.5; color: #e2e8f0; }
        .post-img { width: 100%; border-radius: 15px; margin-top: 12px; border: 1px solid var(--glass-border); display: block; }
        .post-meta { margin-top: 12px; font-size: 0.8rem; color: var(--text-dim); border-top: 1px solid var(--glass-border); padding-top: 10px; display: flex; gap: 15px; }

        /* Modal de Edição */
        #editModal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 3000; display: none; align-items: center; justify-content: center; }
        .modal-card { background: #0f172a; width: 90%; max-width: 450px; padding: 25px; border-radius: 24px; border: 1px solid var(--primary); box-shadow: 0 0 30px rgba(0, 242, 255, 0.15); }
        .field { margin-bottom: 15px; }
        .field label { display: block; font-size: 0.65rem; color: var(--primary); margin-bottom: 5px; font-family: 'Orbitron'; letter-spacing: 1px; }
        .field input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); padding: 12px; border-radius: 12px; color: #fff; font-family: inherit; }

        /* Nav */
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; height: 65px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px); border-radius: 25px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-around; z-index: 1000; }
        .nav-link img { width: 24px; filter: invert(1); opacity: 0.4; }
        .nav-link.active img { opacity: 1; filter: drop-shadow(0 0 8px var(--primary)) invert(1); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="editModal">
    <div class="modal-card">
        <h3 style="font-family:'Orbitron'; margin-top:0; color:var(--primary); font-size:1.1rem;">CONFIGURAÇÕES DE PERFIL</h3>
        <div class="field"><label>NOME EXIBIDO</label><input type="text" id="editName"></div>
        <div class="field"><label>USUÁRIO (@)</label><input type="text" id="editHandle"></div>
        <div class="field"><label>URL DA FOTO (PERFIL)</label><input type="text" id="editPhoto"></div>
        <div class="field"><label>URL DA FOTO (CAPA)</label><input type="text" id="editCover"></div>
        <button onclick="saveProfile()" style="width:100%; background:var(--primary); border:none; padding:14px; border-radius:12px; font-weight:800; cursor:pointer; font-family:'Orbitron'; margin-top:10px;">SALVAR</button>
        <button onclick="closeEdit()" style="width:100%; background:transparent; color:#ff2d55; border:none; margin-top:10px; cursor:pointer; font-weight:600;">CANCELAR</button>
    </div>
</div>

<div class="profile-header" id="uCover">
    <div class="back-btn" onclick="location.href='index.html'">⬅</div>
</div>

<div class="container">
    <div class="p-info-box">
        <img id="uPhoto" class="p-avatar" src="">
        <button id="editBtn" class="btn-edit" onclick="openEdit()" style="display:none;">EDITAR PERFIL</button>
        <button id="followBtn" class="btn-edit" style="display:none;"></button>
    </div>

    <div class="p-details">
        <h2 id="uName">Carregando...</h2>
        <p id="uHandle">@...</p>
    </div>

    <div class="p-stats">
        <div class="stat-item"><b id="cPosts">0</b> Posts</div>
        <div class="stat-item"><b id="cFollowers">0</b> Conexões</div>
    </div>

    <div id="uPosts">
        </div>
</div>

<nav class="bottom-nav">
    <a href="index.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png"></a>
    <a href="buscar.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/149/149852.png"></a>
    <a href="perfil.html" class="nav-link active"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png"></a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, updateDoc, collection, query, where, addDoc, serverTimestamp, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", authDomain: "klyon-a97ba.firebaseapp.com", projectId: "klyon-a97ba", storageBucket: "klyon-a97ba.appspot.com" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    const urlParams = new URLSearchParams(window.location.search);
    let targetUid = urlParams.get('uid');

    onAuthStateChanged(auth, user => {
        if(!user) return location.href="index.html";
        if(!targetUid) targetUid = user.uid;

        // Monitorar Dados do Perfil
        onSnapshot(doc(db, "users", targetUid), snap => {
            const u = snap.data();
            if(!u) return;

            document.getElementById('uName').innerText = u.name;
            document.getElementById('uHandle').innerText = "@" + u.handle;
            document.getElementById('uPhoto').src = u.photo;
            document.getElementById('uCover').style.backgroundImage = u.cover ? `url('${u.cover}')` : 'linear-gradient(45deg, #0f172a, #1e293b)';
            document.getElementById('cFollowers').innerText = u.followers?.length || 0;

            if(targetUid === user.uid) {
                document.getElementById('editBtn').style.display = "block";
                document.getElementById('editName').value = u.name;
                document.getElementById('editHandle').value = u.handle;
                document.getElementById('editPhoto').value = u.photo;
                document.getElementById('editCover').value = u.cover || '';
            } else {
                const fBtn = document.getElementById('followBtn');
                fBtn.style.display = "block";
                const isF = u.followers?.includes(user.uid);
                fBtn.innerText = isF ? "CONECTADO" : "CONECTAR";
                fBtn.onclick = () => toggleFollow(user.uid, targetUid, isF);
            }
        });

        // FILTRO DE POSTS: Apenas os do targetUid
        onSnapshot(collection(db, "posts"), s => {
            const container = document.getElementById('uPosts'); 
            container.innerHTML = "";
            let myPosts = [];
            
            s.forEach(d => { 
                const p = d.data();
                if(p.uid === targetUid) myPosts.push({id: d.id, ...p}); 
            });

            myPosts.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            document.getElementById('cPosts').innerText = myPosts.length;

            if(myPosts.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:50px; color:var(--text-dim); font-size:0.9rem;">Nenhuma transmissão feita por este usuário.</div>`;
            }

            myPosts.forEach(p => {
                container.innerHTML += `
                    <div class="post">
                        <div class="post-head">
                            <img src="${p.authorPhoto}">
                            <div><b>${p.authorName}</b><br><small style="color:var(--primary)">@${p.authorHandle}</small></div>
                        </div>
                        <div class="post-content">${p.content}</div>
                        ${p.image ? `<img src="${p.image}" class="post-img">` : ''}
                        <div class="post-meta">
                            <span>🔥 ${p.likes?.length || 0}</span>
                            <span>💬 ${p.comments?.length || 0}</span>
                        </div>
                    </div>`;
            });
        });
    });

    window.openEdit = () => document.getElementById('editModal').style.display = 'flex';
    window.closeEdit = () => document.getElementById('editModal').style.display = 'none';
    
    window.saveProfile = async () => {
        const up = {
            name: document.getElementById('editName').value,
            handle: document.getElementById('editHandle').value.toLowerCase().replace(/\s/g, ''),
            photo: document.getElementById('editPhoto').value,
            cover: document.getElementById('editCover').value
        };
        await updateDoc(doc(db, "users", auth.currentUser.uid), up);
        closeEdit();
    };

    async function toggleFollow(me, target, isF) {
        const tRef = doc(db, "users", target);
        const mRef = doc(db, "users", me);
        await updateDoc(tRef, { followers: isF ? arrayRemove(me) : arrayUnion(me) });
        await updateDoc(mRef, { following: isF ? arrayRemove(target) : arrayUnion(target) });
    }
</script>
</body>
</html>
