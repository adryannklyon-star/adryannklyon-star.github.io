<script type="module">
    // ... imports e configs ...

    window.handleFriendship = async () => {
        const myUid = auth.currentUser.uid;
        // Lógica de "Amigar" (Adiciona nos dois perfis)
        const isFriend = currentProfileData.friends?.includes(myUid);
        
        const myRef = doc(db, "users", myUid);
        const targetRef = doc(db, "users", targetUid);

        if (isFriend) {
            await updateDoc(myRef, { friends: arrayRemove(targetUid) });
            await updateDoc(targetRef, { friends: arrayRemove(myUid) });
        } else {
            await updateDoc(myRef, { friends: arrayUnion(targetUid) });
            await updateDoc(targetRef, { friends: arrayUnion(myUid) });
            
            // Notificar o usuário
            await addDoc(collection(db, "notifications"), {
                to: targetUid,
                text: `@${currentEliteUser.handle} conectou-se com você!`,
                createdAt: serverTimestamp(),
                read: false
            });
        }
    };

    // Função de Salvar Perfil com Upload de Foto Real
    window.saveProfile = async () => {
        const file = document.getElementById('editPhotoFile').files[0];
        let photoUrl = currentEliteUser.photo;

        if (file) {
            const fileRef = ref(storage, `avatars/${auth.currentUser.uid}`);
            await uploadBytes(fileRef, file);
            photoUrl = await getDownloadURL(fileRef);
        }

        await updateDoc(doc(db, "users", auth.currentUser.uid), {
            name: document.getElementById('editName').value,
            photo: photoUrl
        });
        location.reload();
    };
</script>
