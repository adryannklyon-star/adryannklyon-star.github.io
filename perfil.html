<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Klyon - Perfil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000000; --text: #ffffff; --dim: #888; --border: #1a1a1a; --accent: #00f2ff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding-bottom: 100px; }
        
        /* Cabeçalho Minimalista */
        .profile-header {
            padding: 60px 20px 30px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .avatar-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .neon-avatar-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 300;
            background: radial-gradient(circle, #111 0%, #000 100%);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.05), 0 0 20px rgba(0, 0, 0, 0.5);
            color: #fff;
        }

        .user-info h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.5px; }
        .user-info p { color: var(--accent); font-size: 14px; margin: 5px 0 15px; font-weight: 400; }
        .bio { font-size: 14px; color: #ccc; max-width: 300px; margin: 0 auto 20px; line-height: 1.6; font-weight: 300; }

        /* Stats no estilo da imagem */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            max-width: 350px;
            margin: 25px auto 0;
            padding-top: 20px;
            border-top: 1px solid #111;
        }
        .stat-item { text-align: center; }
        .stat-value { display: block; font-size: 18px; font-weight: 600; color: #fff; }
        .stat-label { display: block; font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

        /* Botões */
        .actions-row { display: flex; justify-content: center; gap: 10px; margin-top: 25px; }
        .btn-profile {
            padding: 10px 25px;
            border-radius: 30px;
            border: 1px solid #333;
            background: transparent;
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }
        .btn-profile.primary { background: #fff; color: #000; border-color: #fff; }
        .btn-profile:hover { opacity: 0.8; }

        /* Posts */
        .tabs-title { padding: 30px 20px 10px; font-size: 11px; color: var(--dim); letter-spacing: 2px; text-transform: uppercase; }
        .post { background: #050505; border-bottom: 1px solid var(--border); padding: 20px; }
        .post-content { font-size: 15px; font-weight: 300; line-height: 1.5; color: #eee; }
        .post-meta { margin-top: 12px; font-size: 12px; color: var(--dim); display: flex; gap: 15px; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: rgba(0,0,0,0.9); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-around; z-index: 1000; }
        .nav-link svg { width: 24px; stroke: var(--dim); fill: none; stroke-width: 1.5; }
        .nav-link.active svg { stroke: #fff; }
    </style>
</head>
<body>

<div class="profile-header">
    <div class="avatar-container">
        <div class="neon-avatar-circle" id="userInitial">?</div>
    </div>
    
    <div class="user-info">
        <h1 id="userName">Carregando...</h1>
        <p id="userHandle">@...</p>
        <div class="bio" id="userBio">No final, somos todos apenas ecos no vazio.</div>
    </div>

    <div class="stats-grid">
        <div class="stat-item">
            <span class="stat-value" id="countPosts">0</span>
            <span class="stat-label">Ecos</span>
        </div>
        <div class="stat-item">
            <span class="stat-value" id="countFollowers">0</span>
            <span class="stat-label">Amigos</span>
        </div>
        <div class="stat-item">
            <span class="stat-value">0</span>
            <span class="stat-label">Votos</span>
        </div>
    </div>

    <div class="actions-row" id="profileActions">
        </div>
</div>

<div class="tabs-title">Recentes</div>

<div id="postsContainer">
    </div>

<nav class="bottom-nav">

</nav>
