<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLYON | Perfil</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --bg: #030307; --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); --text-dim: #94a3b8; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at 50% 0%, #0f172a 0%, #030307 100%); min-height: 100vh; padding-bottom: 100px; }
        
        /* Capa Estilizada sem Foto */
        .header-capa { height: 140px; background: linear-gradient(180deg, rgba(0,242,255,0.05) 0%, transparent 100%); position: relative; border-bottom: 1px solid var(--glass-border); }
        .container { max-width: 550px; margin: auto; padding: 0 15px; position: relative; }

        /* Avatar Neon que substitui a Foto */
        .neon-avatar-large {
            width: 90px; height: 90px;
            background: #000;
            border: 3px solid var(--primary);
            border-radius: 22px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Orbitron';
            color: var(--primary);
            font-size: 2.5rem;
            text-shadow: 0 0 15px var(--primary);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.3), inset 0 0 10px rgba(0, 242, 255, 0.2);
            margin-top: -45px;
            position: relative;
            z-index: 2;
        }
        
        /* Botões */
        .btn-action { background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 10px 20px; border-radius: 20px; float: right; margin-top: 15px; font-family: 'Orbitron'; font-size: 0.75rem; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .btn-action:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); }
        
        /* Posts */
        .post { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px; padding: 18px; margin-top: 15px; animation: fadeIn 0.4s ease; }
        .post b { color: var(--primary); font-family: 'Orbitron'; font-size: 0.85rem; letter-spacing: 1px; }
        .post p { line-height: 1.6; color: #cbd5e1; margin-top: 10px; white-space: pre-wrap; }

        /* Modal de Edição Limpo (Sem foto) */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 3000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .modal-card { background: #0f172a; width: 90%; max-width: 400px; padding: 30px; border-radius: 28px; border: 1px solid var(--primary); }
        .field { margin-bottom: 20px; }
        .field label { display: block; font-size: 0.7rem; color: var(--primary); margin-bottom: 8px; font-family: 'Orbitron'; letter-spacing: 1px; }
        .field input { width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); padding: 14px; border-radius: 12px; color: #fff; font-family: 'Plus Jakarta Sans'; }

        /* Menu Inferior */
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 450px; height: 70px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border-radius: 28px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-around; z-index: 1000; }
        .nav-link img { width: 24px; filter: invert(1); opacity: 0.4; transition: 0.3s; }
        .nav-link.active img { opacity: 1; filter: drop-shadow(0 0 8px var(--primary)) invert(1); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="editModal" class="modal">
    <div class="modal-card">
        <h2 style="font-family:'Orbitron'; font-size: 1rem; color: var(--primary); margin-bottom: 20px;">AJUSTAR IDENTIDADE</h2>
        <div class="field">
            <label>NOME DE EXIBIÇÃO</label>
            <input type="text" id="editName" placeholder="Como quer ser chamado?">
        </div>
        <p style="font-size: 0.65rem; color: var(--text-dim); margin-bottom: 20px; line-height: 1.4;">
            * A rede KLYON foca no anonimato. Sua imagem de perfil é gerada automaticamente com base na inicial do seu nome.
        </p>
        <button id="saveBtn" onclick="saveProfile()" style="width:100%; background:var(--primary); padding:15px; border-radius:15px; border:none; font-weight:800; font-family:'Orbitron'; cursor:pointer; color:#000;">SALVAR ALTERAÇÕES</button>
        <button onclick="document.getElementById('editModal').style.display='none'" style="width:100%; background:transparent; color:#ff2d55; border:none; margin-top:15px; cursor:pointer; font-family:'Orbitron'; font-size:0.7rem;">CANCELAR</button>
    </div>
</div>

<div class="header-capa"></div>
<div class="container">
    <button class="btn-action" id="profileActionBtn" style="display:none;"></button>
    
    <div id="uPhotoNeon" class="neon-avatar-large"></div>

    <h2 id="uName" style="margin: 15px 0 5px 0; font-family:'Orbitron'; letter-spacing: 1px; text-transform: uppercase;"></h2>
    <p id="uHandle" style="color:var(--primary); margin: 0 0 10px 0; font-weight: 600; font-family:'Orbitron'; font-size: 0.8rem;"></p>
    
    <div id="uStats" style="display:flex; gap:20px; font-size:0.8rem; color:var(--text-dim); margin-bottom: 25px; font-family:'Orbitron';">
        <span><b id="friendCount" style="color:#fff;">0</b> CONEXÕES</span>
    </div>

    <div style="border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; margin-bottom: 10px;">
        <span style="font-family:'Orbitron'; font-size:0.7rem; color:var(--primary); letter-spacing: 2px;">TRANSMISSÕES RECENTES</span>
    </div>
    
    <div id="uPosts"></div>
</div>

<nav class="bottom-nav">
    <a href="index.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png"></a>
    <a href="buscar.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/149/149852.png"></a>
    <a href="notificacoes.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/3602/3602145.png"></a>
    <a href="perfil.html" class="nav-link active"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png"></a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, collection, updateDoc, arrayUnion, arrayRemove, query, where, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", 
        authDomain: "klyon-a97ba.firebaseapp.com", 
        projectId: "klyon-a97ba", 
        storageBucket: "klyon-a97ba.appspot.com" 
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    let targetUid = urlParams.get('uid');
    let myUser = null;

    onAuthStateChanged(auth, async user => {
        if(!user) return window.location.href="login.html";
        if(!targetUid) targetUid = user.uid;

        // Listener para o meu usuário
        onSnapshot(doc(db, "users", user.uid), snap => { myUser = snap.data(); });

        // Listener para o perfil visualizado
        onSnapshot(doc(db, "users", targetUid), snap => {
            const u = snap.data();
            if(!u) return;

            document.getElementById('uName').innerText = u.name;
            document.getElementById('uHandle').innerText = "@" + u.handle;
            document.getElementById('friendCount').innerText = u.friends?.length || 0;

            // Lógica da Inicial Neon
            const initial = (u.name || "U").charAt(0).toUpperCase();
            document.getElementById('uPhotoNeon').innerText = initial;

            const actionBtn = document.getElementById('profileActionBtn');
            actionBtn.style.display = "block";

            if(targetUid === user.uid) {
                actionBtn.innerText = "EDITAR IDENTIDADE";
                actionBtn.onclick = () => {
                    document.getElementById('editModal').style.display = 'flex';
                    document.getElementById('editName').value = u.name;
                };
            } else {
                const isFriend = u.friends?.includes(user.uid);
                actionBtn.innerText = isFriend ? "DESCONECTAR" : "CONECTAR";
                actionBtn.style.borderColor = isFriend ? "#ff2d55" : "var(--primary)";
                actionBtn.style.color = isFriend ? "#ff2d55" : "var(--primary)";
                actionBtn.onclick = () => toggleFriend(isFriend);
            }
        });

        // Posts do usuário
        const q = query(collection(db, "posts"), where("uid", "==", targetUid));
        onSnapshot(q, s => {
            const container = document.getElementById('uPosts'); 
            container.innerHTML = "";
            let posts = [];
            s.forEach(d => posts.push(d.data()));
            posts.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            
            posts.forEach(p => {
                container.innerHTML += `
                <div class="post">
                    <b>${p.authorName} <small style="color:var(--text-dim); font-size:0.6rem; margin-left:5px;">@${p.authorHandle}</small></b>
                    <p>${p.content}</p>
                </div>`;
            });
        });
    });

    async function toggleFriend(isFriend) {
        const myUid = auth.currentUser.uid;
        const targetRef = doc(db, "users", targetUid);
        const myRef = doc(db, "users", myUid);

        if(isFriend) {
            await updateDoc(targetRef, { friends: arrayRemove(myUid) });
            await updateDoc(myRef, { friends: arrayRemove(targetUid) });
        } else {
            await updateDoc(targetRef, { friends: arrayUnion(myUid) });
            await updateDoc(myRef, { friends: arrayUnion(targetUid) });
            
            await addDoc(collection(db, "notifications"), {
                to: targetUid,
                text: `@${myUser.handle} estabeleceu uma conexão com você.`,
                createdAt: serverTimestamp(),
                read: false
            });
        }
    }

    window.saveProfile = async () => {
        const btn = document.getElementById('saveBtn');
        const newName = document.getElementById('editName').value;

        if(!newName.trim()) return alert("O nome não pode estar vazio.");

        btn.disabled = true; btn.innerText = "ATUALIZANDO...";

        try {
            await updateDoc(doc(db, "users", auth.currentUser.uid), {
                name: newName
            });
            document.getElementById('editModal').style.display = 'none';
        } catch (e) {
            alert("Erro ao atualizar.");
        } finally {
            btn.disabled = false; btn.innerText = "SALVAR ALTERAÇÕES";
        }
    };
</script>
</body>
</html>
