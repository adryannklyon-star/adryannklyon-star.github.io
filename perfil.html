<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLYON | Perfil</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --bg: #030307; --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at 50% 0%, #0f172a 0%, #030307 100%); min-height: 100vh; padding-bottom: 100px; }
        
        /* Capa e Avatar */
        .header-capa { height: 180px; background-size: cover; background-position: center; background-color: #1a1a2e; position: relative; border-bottom: 1px solid var(--glass-border); }
        .container { max-width: 550px; margin: auto; padding: 0 15px; position: relative; }
        .avatar { width: 100px; height: 100px; border-radius: 25px; border: 4px solid var(--bg); margin-top: -50px; object-fit: cover; background: #000; }
        
        /* Botões */
        .btn-action { background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 10px 20px; border-radius: 20px; float: right; margin-top: 15px; font-family: 'Orbitron'; font-size: 0.75rem; cursor: pointer; transition: 0.3s; }
        .btn-action:hover { background: var(--primary); color: #000; }
        
        /* Posts no Perfil */
        .post { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px; padding: 18px; margin-top: 15px; animation: fadeIn 0.4s ease; }
        .post b { color: var(--primary); font-family: 'Orbitron'; font-size: 0.9rem; }
        .post p { line-height: 1.5; color: #e2e8f0; }

        /* Modal de Edição */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 3000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .modal-card { background: #0f172a; width: 90%; max-width: 400px; padding: 25px; border-radius: 28px; border: 1px solid var(--primary); }
        .field { margin-bottom: 20px; }
        .field label { display: block; font-size: 0.7rem; color: var(--primary); margin-bottom: 8px; font-family: 'Orbitron'; }
        .field input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); padding: 12px; border-radius: 12px; color: #fff; }

        /* Menu Inferior */
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 450px; height: 70px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border-radius: 28px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-around; z-index: 1000; }
        .nav-link img { width: 26px; filter: invert(1); opacity: 0.4; }
        .nav-link.active img { opacity: 1; filter: drop-shadow(0 0 8px var(--primary)); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="editModal" class="modal">
    <div class="modal-card">
        <div class="field"><label>NOME DE EXIBIÇÃO</label><input type="text" id="editName"></div>
        <div class="field"><label>FOTO DE PERFIL</label><input type="file" id="fileAvatar" accept="image/*"></div>
        <div class="field"><label>FOTO DE CAPA</label><input type="file" id="fileCover" accept="image/*"></div>
        <button id="saveBtn" onclick="saveProfile()" style="width:100%; background:var(--primary); padding:15px; border-radius:15px; border:none; font-weight:800; font-family:'Orbitron'; cursor:pointer;">SALVAR ALTERAÇÕES</button>
        <button onclick="document.getElementById('editModal').style.display='none'" style="width:100%; background:transparent; color:#ff2d55; border:none; margin-top:15px; cursor:pointer;">Cancelar</button>
    </div>
</div>

<div class="header-capa" id="uCover"></div>
<div class="container">
    <button class="btn-action" id="profileActionBtn" style="display:none;"></button>
    
    <img id="uPhoto" class="avatar" src="https://via.placeholder.com/150">
    <h2 id="uName" style="margin: 15px 0 5px 0; font-family:'Orbitron'; letter-spacing: 1px;"></h2>
    <p id="uHandle" style="color:var(--primary); margin: 0 0 10px 0; font-weight: 600;"></p>
    
    <div id="uStats" style="display:flex; gap:20px; font-size:0.9rem; color:var(--text-dim); margin-bottom: 25px;">
        <span><b id="friendCount" style="color:#fff;">0</b> Amigos</span>
    </div>

    <div style="border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; margin-bottom: 10px;">
        <span style="font-family:'Orbitron'; font-size:0.8rem; color:var(--primary);">POSTS</span>
    </div>
    
    <div id="uPosts"></div>
</div>

<style>
    .bottom-nav { 
        position: fixed; 
        bottom: 20px; 
        left: 50%; 
        transform: translateX(-50%); 
        width: 94%; 
        max-width: 480px; 
        height: 70px; 
        background: rgba(15, 23, 42, 0.9); 
        backdrop-filter: blur(20px); 
        border-radius: 28px; 
        border: 1px solid var(--glass-border); 
        display: flex; 
        align-items: center; 
        justify-content: space-around; 
        z-index: 1000; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    
    .nav-link { 
        position: relative; 
        display: flex; 
        align-items: center; 
        justify-content: center;
        width: 50px;
        height: 50px;
    }

    .nav-link img { 
        width: 24px; 
        height: 24px;
        filter: invert(1); 
        opacity: 0.4; 
        transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    }

    /* Efeito de brilho no ícone ativo */
    .nav-link.active img { 
        opacity: 1; 
        filter: drop-shadow(0 0 8px var(--primary)) invert(1); 
        transform: scale(1.1);
    }

    /* Badge de Notificação (Sino) */
    .notif-badge { 
        position: absolute; 
        top: 10px; 
        right: 10px; 
        width: 8px; 
        height: 8px; 
        background: #ff2d55; 
        border-radius: 50%; 
        border: 2px solid #0f172a; 
        display: none; 
    }
</style>

<nav class="bottom-nav">
    <a href="index.html" class="nav-link" id="nav-home">
        <img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png" alt="Home">
    </a>

    <a href="buscar.html" class="nav-link" id="nav-search">
        <img src="https://cdn-icons-png.flaticon.com/512/149/149852.png" alt="Buscar">
    </a>

    <a href="notificacoes.html" class="nav-link" id="nav-notif">
        <img src="https://cdn-icons-png.flaticon.com/512/3602/3602145.png" alt="Notificações">
        <div id="notifBadge" class="notif-badge"></div>
    </a>

    <a href="perfil.html" class="nav-link" id="nav-profile">
        <img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png" alt="Perfil">
    </a>

    <a href="configuracoes.html" class="nav-link" id="nav-settings">
        <img src="https://cdn-icons-png.flaticon.com/512/2040/2040504.png" alt="Configurações">
    </a>
</nav>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, collection, updateDoc, arrayUnion, arrayRemove, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-storage.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", 
        authDomain: "klyon-a97ba.firebaseapp.com", 
        projectId: "klyon-a97ba", 
        storageBucket: "klyon-a97ba.appspot.com" 
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const urlParams = new URLSearchParams(window.location.search);
    let targetUid = urlParams.get('uid');
    let myUser = null;

    onAuthStateChanged(auth, async user => {
        if(!user) return window.location.href="login.html";
        if(!targetUid) targetUid = user.uid;

        // Dados do meu usuário (quem está logado)
        onSnapshot(doc(db, "users", user.uid), snap => { myUser = snap.data(); });

        // Dados do perfil sendo visualizado
        onSnapshot(doc(db, "users", targetUid), snap => {
            const u = snap.data();
            document.getElementById('uName').innerText = u.name;
            document.getElementById('uHandle').innerText = "@" + u.handle;
            document.getElementById('uPhoto').src = u.photo || 'https://via.placeholder.com/150';
            document.getElementById('uCover').style.backgroundImage = `url('${u.cover || ''}')`;
            document.getElementById('friendCount').innerText = u.friends?.length || 0;

            const actionBtn = document.getElementById('profileActionBtn');
            actionBtn.style.display = "block";

            if(targetUid === user.uid) {
                actionBtn.innerText = "EDITAR PERFIL";
                actionBtn.onclick = () => document.getElementById('editModal').style.display = 'flex';
                // Preencher campos do modal
                document.getElementById('editName').value = u.name;
            } else {
                const isFriend = u.friends?.includes(user.uid);
                actionBtn.innerText = isFriend ? "DESCONECTAR" : "AMIGAR";
                actionBtn.style.borderColor = isFriend ? "#ff2d55" : var(--primary);
                actionBtn.onclick = () => toggleFriend(isFriend);
            }
        });

        // Posts do usuário
        const q = query(collection(db, "posts"), where("uid", "==", targetUid));
        onSnapshot(q, s => {
            const container = document.getElementById('uPosts'); container.innerHTML = "";
            let posts = [];
            s.forEach(d => posts.push(d.data()));
            posts.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            posts.forEach(p => {
                container.innerHTML += `
                <div class="post">
                    <b>${p.authorName}</b>
                    <p>${p.content}</p>
                    ${p.image ? `<img src="${p.image}" style="width:100%; border-radius:15px; margin-top:10px;">` : ''}
                </div>`;
            });
        });
    });

    // Função para Amigar/Desconectar (Twitter Style de Friends)
    async function toggleFriend(isFriend) {
        const myUid = auth.currentUser.uid;
        const targetRef = doc(db, "users", targetUid);
        const myRef = doc(db, "users", myUid);

        if(isFriend) {
            await updateDoc(targetRef, { friends: arrayRemove(myUid) });
            await updateDoc(myRef, { friends: arrayRemove(targetUid) });
        } else {
            await updateDoc(targetRef, { friends: arrayUnion(myUid) });
            await updateDoc(myRef, { friends: arrayUnion(targetUid) });
            
            // Enviar Notificação
            await addDoc(collection(db, "notifications"), {
                to: targetUid,
                text: `@${myUser.handle} conectou-se com você!`,
                createdAt: serverTimestamp(),
                read: false
            });
        }
    }

    // Salvar Perfil com Upload de Foto Real (Avatar e Capa)
    window.saveProfile = async () => {
        const btn = document.getElementById('saveBtn');
        const newName = document.getElementById('editName').value;
        const avatarFile = document.getElementById('fileAvatar').files[0];
        const coverFile = document.getElementById('fileCover').files[0];

        btn.disabled = true; btn.innerText = "PROCESSANDO...";

        let avatarUrl = document.getElementById('uPhoto').src;
        let coverUrl = document.getElementById('uCover').style.backgroundImage.slice(5, -2);

        if(avatarFile) {
            const sRef = ref(storage, `avatars/${auth.currentUser.uid}`);
            await uploadBytes(sRef, avatarFile);
            avatarUrl = await getDownloadURL(sRef);
        }

        if(coverFile) {
            const cRef = ref(storage, `covers/${auth.currentUser.uid}`);
            await uploadBytes(cRef, coverFile);
            coverUrl = await getDownloadURL(cRef);
        }

        await updateDoc(doc(db, "users", auth.currentUser.uid), {
            name: newName,
            photo: avatarUrl,
            cover: coverUrl
        });

        document.getElementById('editModal').style.display = 'none';
        btn.disabled = false; btn.innerText = "SALVAR ALTERAÇÕES";
    };
</script>
</body>
</html>
