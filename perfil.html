<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLYON | Perfil</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --bg: #030307; --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); --text-dim: #94a3b8; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at 50% 0%, #0f172a 0%, #030307 100%); min-height: 100vh; padding-bottom: 120px; }
        
        .header-capa { height: 140px; background: linear-gradient(180deg, rgba(0,242,255,0.05) 0%, transparent 100%); border-bottom: 1px solid var(--glass-border); }
        .container { max-width: 550px; margin: auto; padding: 0 15px; position: relative; }

        .neon-avatar-large {
            width: 90px; height: 90px; background: #000; border: 3px solid var(--primary);
            border-radius: 22px; display: flex; align-items: center; justify-content: center;
            font-family: 'Orbitron'; color: var(--primary); font-size: 2.5rem;
            text-shadow: 0 0 15px var(--primary); box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
            margin-top: -45px; position: relative; z-index: 2;
        }
        
        .btn-action { background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 10px 20px; border-radius: 20px; float: right; margin-top: 15px; font-family: 'Orbitron'; font-size: 0.75rem; cursor: pointer; transition: 0.3s; }
        .btn-action:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); }
        
        .profile-info { margin-top: 20px; border-bottom: 1px solid var(--glass-border); padding-bottom: 20px; margin-bottom: 20px; }
        .profile-info h1 { margin: 0; font-family: 'Orbitron'; font-size: 1.5rem; }
        .profile-info p { color: var(--primary); margin: 5px 0; font-size: 0.9rem; }

        /* Estilo dos Posts */
        .post { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 20px; padding: 18px; margin-bottom: 15px; animation: fadeIn 0.5s ease; }
        .post-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .post-header b { color: var(--primary); font-family: 'Orbitron'; font-size: 0.8rem; }
        .post-header span { color: var(--text-dim); font-size: 0.7rem; }
        .post-content { line-height: 1.6; color: #cbd5e1; font-size: 0.95rem; white-space: pre-wrap; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 3000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .modal-card { background: #0f172a; width: 90%; max-width: 400px; padding: 30px; border-radius: 28px; border: 1px solid var(--primary); }
        .field { margin-bottom: 20px; }
        .field label { display: block; font-size: 0.7rem; color: var(--primary); margin-bottom: 8px; font-family: 'Orbitron'; }
        .field input { width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); padding: 14px; border-radius: 12px; color: #fff; box-sizing: border-box; outline: none; }

        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 450px; height: 70px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border-radius: 28px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-around; z-index: 1000; }
        .nav-link img { width: 24px; filter: invert(1); opacity: 0.4; }
        .nav-link.active img { opacity: 1; filter: drop-shadow(0 0 8px var(--primary)) invert(1); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="header-capa"></div>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div class="neon-avatar-large" id="userInitial">?</div>
        <button id="actionBtn" class="btn-action">EDITAR</button>
    </div>

    <div class="profile-info">
        <h1 id="userName">Carregando...</h1>
        <p id="userHandle">@...</p>
    </div>

    <h3 style="font-family: 'Orbitron'; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 15px;">MEUS LOGS</h3>
    <div id="postsContainer">
        <p style="color: var(--text-dim); font-size: 0.8rem;">Buscando transmissões...</p>
    </div>
</div>

<div id="editModal" class="modal">
    <div class="modal-card">
        <h2 style="font-family:'Orbitron'; font-size: 1rem; color: var(--primary); margin-bottom: 20px;">AJUSTAR IDENTIDADE</h2>
        <div class="field">
            <label>NOME DE EXIBIÇÃO</label>
            <input type="text" id="editName">
        </div>
        <div class="field">
            <label>@ HANDLE (ÚNICO)</label>
            <input type="text" id="editHandle">
        </div>
        <button id="saveBtn" onclick="saveProfile()" style="width:100%; background:var(--primary); padding:15px; border-radius:15px; border:none; font-weight:800; font-family:'Orbitron'; cursor:pointer; color: #000;">SALVAR</button>
        <button onclick="document.getElementById('editModal').style.display='none'" style="width:100%; background:transparent; color:#ff2d55; border:none; margin-top:15px; cursor:pointer; font-family:'Orbitron';">CANCELAR</button>
    </div>
</div>

<nav class="bottom-nav">
    <a href="index.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png"></a>
    <a href="buscar.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/149/149852.png"></a>
    <a href="notificacoes.html" class="nav-link"><img src="https://cdn-icons-png.flaticon.com/512/3602/3602145.png"></a>
    <a href="perfil.html" class="nav-link active"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png"></a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBeyQ56dshpph4e6gGKUY_XvX77iQ3z334", 
        authDomain: "klyon-a97ba.firebaseapp.com", 
        projectId: "klyon-a97ba", 
        storageBucket: "klyon-a97ba.appspot.com",
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let myUser = null;

    onAuthStateChanged(auth, (user) => {
        if (user) {
            // 1. Carregar Dados do Perfil
            onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                if (docSnap.exists()) {
                    myUser = docSnap.data();
                    document.getElementById('userName').innerText = myUser.name;
                    document.getElementById('userHandle').innerText = `@${myUser.handle}`;
                    document.getElementById('userInitial').innerText = myUser.name.charAt(0).toUpperCase();
                    
                    document.getElementById('actionBtn').onclick = () => {
                        document.getElementById('editModal').style.display = 'flex';
                        document.getElementById('editName').value = myUser.name;
                        document.getElementById('editHandle').value = myUser.handle;
                    };
                }
            });

            // 2. Carregar Meus Posts
            loadMyPosts(user.uid);

        } else {
            window.location.href = "login.html";
        }
    });

    async function loadMyPosts(uid) {
        const container = document.getElementById('postsContainer');
        // ATENÇÃO: Essa query exige um INDEX no Firebase se usar orderBy. 
        // Se der erro no console, clique no link que o Firebase vai gerar para criar o index.
        const q = query(
            collection(db, "posts"), 
            where("uid", "==", uid),
            orderBy("createdAt", "desc")
        );

        onSnapshot(q, (snapshot) => {
            container.innerHTML = "";
            if (snapshot.empty) {
                container.innerHTML = `<p style="color: var(--text-dim); font-size: 0.8rem;">Nenhuma transmissão encontrada no seu log.</p>`;
                return;
            }

            snapshot.forEach((postDoc) => {
                const post = postDoc.data();
                const date = post.createdAt?.toDate ? post.createdAt.toDate().toLocaleDateString('pt-BR') : 'Recentemente';
                
                const postEl = document.createElement('div');
                postEl.className = 'post';
                postEl.innerHTML = `
                    <div class="post-header">
                        <b>${myUser ? myUser.name : 'Você'}</b>
                        <span>${date}</span>
                    </div>
                    <div class="post-content">${post.content}</div>
                `;
                container.appendChild(postEl);
            });
        });
    }

    window.saveProfile = async () => {
        // ... (Mesma lógica de saveProfile que já tínhamos)
        const btn = document.getElementById('saveBtn');
        const newName = document.getElementById('editName').value.trim();
        const newHandle = document.getElementById('editHandle').value.trim().toLowerCase();

        try {
            await updateDoc(doc(db, "users", auth.currentUser.uid), { name: newName, handle: newHandle });
            document.getElementById('editModal').style.display = 'none';
        } catch(e) { console.error(e); }
    };
</script>
</body>
</html>
